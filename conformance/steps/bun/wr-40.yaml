# WR-40: which steps run in the native runtime, and how each kind is
# prepared. The //native header, not the stored language, selects it for a
# Bun-family step; a nativets step reaches the embedded client by every
# spelling of file:///windmill.ts, and no other import loads.
finding: WR-40
scope: core
cases:
  - spec: WR-40/a
    variant: header
    provenance: oracle-observed
    title: language bun with a first line //native runs in the native runtime
    script: |
      //native
      export function main() { return typeof (globalThis as any).Bun; }
    runs:
      - args: '{}'
        expect: {status: success, result: "undefined"}
  - spec: WR-40/a
    variant: no-header
    provenance: oracle-observed
    title: language bunnative without the header runs as an ordinary Bun step
    language: bunnative
    script: |
      export function main() { return typeof (globalThis as any).Bun; }
    runs:
      - args: '{}'
        expect: {status: success, result: "object"}
  - spec: WR-40/b
    provenance: oracle-observed
    title: nativets imports the embedded client as ./windmill.ts
    language: nativets
    script: |
      import * as wmill from "./windmill.ts";
      export function main() { return typeof wmill.getVariable; }
    runs:
      - args: '{}'
        expect: {status: success, result: "function"}
  - spec: WR-40
    variant: client-version-and-env
    provenance: source-derived
    title: the embedded client is the 1.326.0 one, and reads BASE_INTERNAL_URL and WM_TOKEN from its own process.env
    note: >-
      setClient() with no arguments takes its base URL and token from the
      client module's own preamble (WR-45); the base URL is the loopback
      facade origin wltest check gives the harness, whose port the facade
      picks (milestone PF1).
    language: nativets
    env: {WM_TOKEN: wl-step-token}
    script: |
      import * as wmill from "./windmill.ts";
      export function main() {
        wmill.setClient();
        return [wmill.OpenAPI.VERSION, /^http:\/\/127\.0\.0\.1:[0-9]+\/api$/.test(wmill.OpenAPI.BASE), wmill.OpenAPI.TOKEN];
      }
    runs:
      - args: '{}'
        expect: {status: success, result: ["1.326.0", true, wl-step-token]}
  - spec: WR-40/c
    provenance: oracle-observed
    title: a static import of a missing host file fails the load
    language: nativets
    script: |
      import { x } from "./helper.ts";
      export function main() { return x; }
    runs:
      - args: '{}'
        claims:
          - {at: /status, equals: failure}
          - {at: /result/error/message, prefix: "execution error:\nError: failed to load module"}
          - {at: /result/error/name, equals: ExecutionErr}
          - {at: /result/error/step_id, equals: a}
          - {at: /result/error/stack, absent: true}
  - spec: WR-40/d
    variant: absolute
    provenance: oracle-observed
    title: the client imported as /windmill.ts
    language: nativets
    script: |
      import * as wmill from "/windmill.ts";
      export function main() { return typeof wmill.getVariable; }
    runs:
      - args: '{}'
        expect: {status: success, result: "function"}
  - spec: WR-40/d
    variant: file-url
    provenance: oracle-observed
    title: the client imported as file:///windmill.ts
    language: nativets
    script: |
      import * as wmill from "file:///windmill.ts";
      export function main() { return typeof wmill.getVariable; }
    runs:
      - args: '{}'
        expect: {status: success, result: "function"}
  - spec: WR-40/e
    provenance: oracle-observed
    title: a failed dynamic import is an ordinary rejection that main can catch
    language: nativets
    script: |
      export async function main() {
        try { await import("./missing.ts"); return "loaded"; }
        catch (e) { return [e instanceof Error, String((e as Error).message).includes("file:///missing.ts")]; }
      }
    runs:
      - args: '{}'
        expect: {status: success, result: [true, true]}
  - spec: WR-40/f
    provenance: oracle-observed
    title: an uncaught failed dynamic import gives the exception shape, not a load failure
    note: >-
      The reference's revision SC4 gives the error's name, TypeError, and
      its whole message, which Q-WR-21 had left to the oracle;
      windmill-lite's name is Error, so the claims hold only what both
      share.
    language: nativets
    script: |
      export async function main() { await import("./missing.ts"); return 1; }
    runs:
      - args: '{}'
        claims:
          - {at: /status, equals: failure}
          - {at: /result/error/message, prefix: "Failed to load file:///missing.ts", not_contains: [failed to load module]}
          - {at: /result/error/name, not_contains: [ExecutionErr]}
          - {at: /result/error/step_id, absent: true}
          - {at: /result/error/extra, absent: true}
  - spec: WR-40
    variant: dynamic-client
    provenance: source-derived
    title: a dynamic import of the client's URL reaches the client too
    language: nativets
    script: |
      export async function main() { const w = await import("./windmill.ts"); return typeof w.getVariable; }
    runs:
      - args: '{}'
        expect: {status: success, result: "function"}
  - spec: WR-40
    variant: bare-specifier
    provenance: source-derived
    title: a bare specifier cannot be loaded, so the static import fails the load
    language: nativets
    script: |
      import x from "lodash";
      export function main() { return x; }
    runs:
      - args: '{}'
        claims:
          - {at: /result/error/message, prefix: "execution error:\nError: failed to load module"}
          - {at: /result/error/name, equals: ExecutionErr}
  - spec: WR-40
    variant: other-scheme
    provenance: source-derived
    title: a URL with another scheme cannot be loaded either
    language: nativets
    script: |
      export async function main() {
        const out = [];
        for (const s of ["npm:lodash", "https://example.invalid/x.ts"]) {
          try { await import(s); out.push("loaded"); } catch (e) { out.push(e instanceof Error); }
        }
        return out;
      }
    runs:
      - args: '{}'
        expect: {status: success, result: [true, true]}
  - spec: WR-40
    variant: missing-named-import
    provenance: policy
    title: a named import the client does not export fails the load, as linking a module fails
    language: nativets
    script: |
      import { noSuchExport } from "./windmill.ts";
      export function main() { return typeof noSuchExport; }
    runs:
      - args: '{}'
        claims:
          - {at: /result/error/message, prefix: "execution error:\nError: failed to load module: SyntaxError: The requested module './windmill.ts' does not provide an export named 'noSuchExport'"}
          - {at: /result/error/name, equals: ExecutionErr}
  - spec: WR-40
    variant: no-client-for-bunnative
    provenance: source-derived
    title: a //native step's runtime does not load windmill.ts; its client is what its lock inlines
    note: The specifier is an argument, so the bundler leaves the import to the runtime.
    script: |
      //native
      export async function main(spec: string) {
        try { await import(spec); return "loaded"; } catch (e) { return String((e as Error).message); }
      }
    runs:
      - args: '{"spec":"./windmill.ts"}'
        expect: {status: success, result: "Failed to load file:///windmill.ts"}
  - spec: WR-40
    variant: module-scope-nativets
    provenance: source-derived
    title: the module's scope is a module's, with no arguments and this undefined (nativets)
    note: The c3n review's finding 3.
    language: nativets
    script: |
      const top = [typeof arguments, this === undefined];
      const arrow = () => typeof arguments;
      function ordinary() { return arguments.length; }
      export function main() { return [top, arrow(), (ordinary as any)(1, 2)]; }
    runs:
      - args: '{}'
        expect: {status: success, result: [["undefined", true], "undefined", 2]}
  - spec: WR-40
    variant: module-scope-bunnative
    provenance: policy
    title: the module's scope has no arguments (bunnative), and its this is what Bun's bundle makes of it
    note: >-
      Bun's bundler writes a module's own `this` as `null`, so `this ===
      undefined` is false in the bundle as loaded; a //native bundle on
      Windmill is Bun 1.3.10's too (WR-40).
    script: |
      //native
      const top = [typeof arguments, this === undefined];
      const arrow = () => typeof arguments;
      function ordinary() { return arguments.length; }
      export function main() { return [top, arrow(), (ordinary as any)(1, 2)]; }
    runs:
      - args: '{}'
        expect: {status: success, result: [["undefined", false], "undefined", 2]}
  - spec: WR-40
    variant: nativets-without-header
    provenance: source-derived
    title: a nativets script runs in the native runtime with no //native line
    note: >-
      WR-40's note (SC1): the worker dispatches a nativets step on its
      stored language alone; only bun and bunnative follow the header.
    language: nativets
    script: |
      export function main() { const g = globalThis as any; return [typeof g.Bun, typeof g.process, typeof process.env.WM_WORKSPACE, typeof WM_WORKSPACE]; }
    runs:
      - args: '{}'
        expect: {status: success, result: ["undefined", "undefined", string, string]}
  - spec: WR-40
    variant: nativets-with-header
    provenance: source-derived
    title: a nativets script with a //native line is transpiled all the same, not bundled, so its imports follow the URL rule
    note: >-
      WR-40's note (SC1). Bundled, ./windmill.ts would resolve as a
      workspace script (WR-28) and fail to build; transpiled, it reaches
      the embedded client, and the nativets preamble's bare names are there.
    language: nativets
    script: |
      //native
      import * as wmill from "./windmill.ts";
      export function main() { return [typeof wmill.getVariable, typeof (globalThis as any).Bun, typeof WM_WORKSPACE]; }
    runs:
      - args: '{}'
        expect: {status: success, result: [function, "undefined", string]}
