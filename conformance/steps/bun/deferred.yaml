note: >-
  Catalogue cases of the findings with a step file here that are not step
  cases, each with the reason and where it is checked. The test in
  cmd/wltest fails unless every catalogue case of such a finding is a step
  case or listed here.
deferred:
  - spec: WR-21/b
    reason: >-
      later: a script that writes result.json itself and exits 1; the
      harness reads no result file, since a warm process's working
      directory is shared (D10)
    expected_in: a later milestone that implements result files (L1)
  - spec: WR-31/b
    reason: a comment after code is not an annotation is a rule of the build, which records no flag; the script runs as any other
    expected_in: C2a (conformance/build/wr-31.json)
  - spec: WR-39/a
    reason: the script the wrapper scan selects is refused at load, so it never runs
    expected_in: A5 and C2a (conformance/build/wr-39.json, conformance/ir)
  - spec: WR-40/g
    reason: >-
      later: the module-level this, null in a bunnative bundle (Bun's
      bundler) and undefined in a nativets module; the semantics reference
      added the case on 2026-10-29, and no step case encodes it yet
    expected_in: C3n (the native boundary mode, with wr-40.yaml)
  - spec: WR-43/e
    reason: >-
      later: the native runtime fails a job whose entrypoint's promise never
      settles once nothing else is pending; in a shared event loop the
      harness cannot know that the realm has nothing pending (an untracked
      web API call may still be), so such a step runs until its timeout
    expected_in: not planned; ADR 0001 D5 lists it
  - spec: WR-43/i
    reason: >-
      later: JavaScriptCore keeps a thrown error's frames only in its stack
      text, so a stack replaced by a non-string leaves no source line; the
      step case WR-43/replaced-stack pins windmill-lite's null
    expected_in: ADR 0001 D5 (a difference of the native boundary mode)
  - spec: WR-44/c
    reason: >-
      later: native realms share the harness's JavaScriptCore heap, which
      has no 128 MiB cap per realm
    expected_in: not planned; ADR 0001 D5 lists it
  - spec: WR-44/d
    reason: >-
      the instance's job_default_timeout is an engine setting; the step
      runner has only the step's own timeout
    expected_in: N2 (timeouts and their messages), with engine.TimeoutError
  - spec: WR-45/g
    reason: >-
      later: the case needs a local HTTP endpoint; the user agent is
      checked against one in the Bun harness's own tests
    expected_in: harnesses/bun/test/native.test.ts
  - spec: WR-46/a
    reason: later; native result streaming is not implemented, so an async-iterable result serialises as {}
    expected_in: a later milestone that implements result streaming (WR-16, WR-46)
  - spec: WR-46/b
    reason: later; native result streaming is not implemented
    expected_in: a later milestone that implements result streaming (WR-16, WR-46)
  - spec: WR-50/a
    reason: >-
      whether CE standalone deploys and runs a codebase script, and the
      refusal in split mode, are the oracle's to observe; the run's value
      is WR-47/a's, whose step case (d13.yaml) runs the bundle on Node and
      on the harness
    expected_in: E3e (the oracle) and d13.yaml (WR-47/a)
  - spec: WR-50/b
    reason: later; the Node patch of Windmill's image is an oracle observation (Q-WR-24), and windmill-lite runs no Node
    expected_in: E3e (the oracle)
  - spec: WR-50/d
    reason: >-
      a //nodejs codebase script runs on Node on Windmill, with Bun's
      environment (WR-50, rule 2), not at the native boundary; windmill-lite
      has no Node and runs it on the Bun harness, so its probe gives
      ["object","string"] where Windmill gives ["undefined","string"], the
      same runtime difference as D13's
    expected_in: D13 (ADR 0001 §5), with d13.yaml
  - spec: WR-50/e
    reason: later; Node's module-format detection for an ESM bundle sent to Node by //nodejs depends on the Node patch (Q-WR-24)
    expected_in: E3e (the oracle) and C3n
  - spec: WA-2/b
    reason: later; an ordinary Python job's base URL, which needs the Python harness
    expected_in: L1
  - spec: WA-5/b
    reason: >-
      a schedule-triggered run's state path; schedules are out of scope
      (ADR 0001 §3), so no windmill-lite run has a schedule trigger and
      the trigger part is always "user" (wa-5.yaml)
    expected_in: none while schedules are out of scope
  - spec: WA-6/a
    reason: a loop body's runnable paths need a flow with a for loop; the step level runs no loops
    expected_in: PF3 (conformance/flows/client-api/flow-path, run seq)
  - spec: WA-6/b
    reason: a loop body made non-simple by a retry needs a flow with a for loop and a retry
    expected_in: PF3's fixture conformance/flows/client-api/flow-path (run retry), which runs once NI's retries inside containers have merged
  - spec: WA-6/c
    reason: a parallel loop's body sub-flows need a flow with a for loop; the step level runs no loops
    expected_in: PF3 (conformance/flows/client-api/flow-path, run par)
  - spec: WA-6/d
    reason: a branchone's sub-flow numbering needs a flow with a branch
    expected_in: PF3's fixture conformance/flows/client-api/flow-path (runs branch, branch_default), which runs once N3b's branches have merged
  - spec: WA-14/b
    reason: later; the Python setter's reaction to a non-404 failure needs the Python client
    expected_in: L1
  - spec: WA-14/c
    reason: >-
      later; a read by id after the run needs a completed root, which no
      step case has. windmill-lite discards the map when the run ends (the
      design note of WA-14), so the read gives null and a write is refused
      with the 404 (Q-WA-10); internal/platform's TestFlowUserState checks
      both
    expected_in: PF3 (internal/platform TestFlowUserState)
  - spec: WA-15/a
    reason: a failed child needs a target in the bundle, which a step case's bundle does not have; its result through the poll waitJob makes is recorded at the flow level
    expected_in: PF3 (conformance/flows/client-api/dispatch, run wait)
  - spec: WA-15/b
    reason: later; Python's null-result defaults need the Python client
    expected_in: L1
  - spec: WA-15/c
    reason: >-
      the query that runFlow and runFlowAsync send is the stock client's;
      the dispatch fixture makes both requests at the flow level, and
      internal/platform/facade's TestDispatchRoutes checks that parent_job
      and root_job reach the dispatcher
    expected_in: PF3 (conformance/flows/client-api/dispatch, run wait; TestDispatchRoutes)
  - spec: WA-15/d
    reason: later; Python's get_result needs the Python client
    expected_in: L1
  - spec: WA-15/e
    reason: later; Python's get_result needs the Python client; the facade's 404 for an id that names no completed job is checked by internal/platform/facade's TestResultRoutes
    expected_in: L1
  - spec: WA-16/b
    reason: a bare string is refused by the stock client's own parsing, before any request; a script without the client makes none
    expected_in: PF3 (internal/platform/facade TestObjectsOnTheClient, on windmill-client@1.767.0)
  - spec: WA-16/d
    reason: >-
      an observation of a CE server with no workspace storage (Q-WA-3);
      windmill-lite's object store is the host's, which the client
      contract does not settle, so there is nothing of windmill-lite's to
      compare with it; with none configured the job helpers answer 501
      (internal/platform/facade TestObjectRoutes)
    expected_in: none (a CE observation for the reference)
  - spec: WA-31/a
    reason: >-
      a parallel for-loop of 8 steps run 50 times is a flow; the step
      level runs no loops. The attribution it checks is checked on the
      stock client, with two runs at once in one warm process, by
      internal/platform/facade's TestAttribution (milestone PF1)
    expected_in: N3a (parallel loops) and F1 (the flow suite through wl)
  - spec: WA-31/b
    reason: >-
      a bundled step's Bun.env reads with 8-way parallelism is the
      harness's Q-WA-4 test, 16 concurrent invocations per bundling
      variant (internal/harness, qwa4_test.go)
    expected_in: W1 (internal/harness TestQWA4EnvView)
  - spec: WA-41/a
    reason: >-
      a generated service's ApiError needs the stock client, which the
      step level does not install; its 501 reply is checked on
      windmill-client@1.767.0's JobService.getJob and getIdToken
    expected_in: PF1 (internal/platform/facade TestUnsupportedPolicyOnTheClient)
  - spec: WA-11/b
    reason: later; writes (TS setVariable's create and update) are not implemented, so they answer 501
    expected_in: a later milestone that implements variable writes (ADR 0007, Variables)
  - spec: WA-12/f
    reason: >-
      a resource of 1001 items is generated by the walker's unit cases
      rather than written out in a step file
    expected_in: internal/platform/testdata/interpolation.json (WA-12/f, and 1000 items walked)
  - spec: WA-42/a
    reason: a rendering of each error variant is a unit check of the API's error type, not a step's behaviour
    expected_in: internal/platform/facade TestErrorVariants
  - spec: WA-V3/a
    reason: >-
      the argument side needs the engine's resolution of a leaf's
      arguments, which a step case does not run
    expected_in: the flow fixture client-api/providers (run services), and internal/engine TestEngineResolvesArguments
  - spec: WR-5/a
    reason: worker argument resolution is the engine's, which a step case does not run
    expected_in: the flow fixture client-api/providers (run services) and internal/platform/testdata/interpolation.json
  - spec: WR-5/b
    reason: worker argument resolution is the engine's, which a step case does not run
    expected_in: the flow fixture client-api/providers (run invalid_path) and internal/platform/testdata/interpolation.json
  - spec: WR-5/c
    reason: worker argument resolution is the engine's, which a step case does not run
    expected_in: the flow fixture client-api/providers (run services) and internal/platform/testdata/interpolation.json
  - spec: WR-5/d
    reason: worker argument resolution is the engine's, which a step case does not run
    expected_in: the flow fixture je/providers (run je42-d, JE-42/d) and internal/platform/testdata/interpolation.json
  - spec: WR-5/e
    reason: worker argument resolution is the engine's, which a step case does not run
    expected_in: the flow fixture client-api/providers (run missing_resource) and internal/platform/testdata/interpolation.json
