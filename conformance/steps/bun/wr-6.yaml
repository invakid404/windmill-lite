# WR-6: how the arguments bind to the entrypoint, through the signature the
# build recorded (conformance/build/wr-6.json is the build half).
finding: WR-6
scope: core
cases:
  - spec: WR-6/a
    provenance: source-derived
    title: a missing key gives undefined, so the defaults apply
    script: |
      export function main(a: number, b = "dflt", c?: string) { return [a, b, c ?? "none"]; }
    runs:
      - args: '{"a":1}'
        expect: {status: success, result: [1, dflt, none]}
  - spec: WR-6/b
    provenance: source-derived
    title: null is kept, and unknown keys are dropped
    script: |
      export function main(a: number, b = "dflt", c?: string) { return [a, b, c ?? "none"]; }
    runs:
      - args: '{"a":1,"b":null,"zzz":9}'
        expect: {status: success, result: [1, null, none]}
  - spec: WR-6/c
    provenance: source-derived
    title: no coercion
    script: |
      export function main(a: number, b = "dflt", c?: string) { return [a, b, c ?? "none"]; }
    runs:
      - args: '{"a":"5"}'
        expect: {status: success, result: ["5", dflt, none]}
  - spec: WR-6/d
    provenance: source-derived
    title: an arrow main without an override gets no arguments
    script: |
      export const main = (...xs) => xs.length;
    runs:
      - args: '{"a":1}'
        expect: {status: success, result: 0}
  - spec: WR-6/e
    provenance: source-derived
    title: the override fallback passes the non-underscore values, integer-like keys first and ascending
    script: |
      export function other() { return [...arguments]; }
    runs:
      - args: '{"_ENTRYPOINT_OVERRIDE":"other","9":9,"2":2,"_hidden":7}'
        expect: {status: success, result: [2, 9]}
  - spec: WR-6/f
    provenance: source-derived
    title: with non-integer keys the fallback's order is unspecified, so any permutation passes
    script: |
      export function other() { return [...arguments]; }
    compare: {unordered: [/result]}
    runs:
      - args: '{"_ENTRYPOINT_OVERRIDE":"other","a":1,"bb":2,"ccc":3}'
        expect: {status: success, result: [1, 2, 3]}
  - spec: WR-6
    variant: fallback-text-order
    provenance: policy
    title: the harness passes the fallback's non-integer keys in the order the argument text gives them
    note: >-
      The reference leaves this order unspecified (the worker's outer map is
      a hash map, WR-10 layer 1); windmill-lite's engine hands the harness
      one text, whose order JavaScript keeps after the integer-like keys.
    script: |
      export function other() { return [...arguments]; }
    runs:
      - args: '{"_ENTRYPOINT_OVERRIDE":"other","ccc":3,"a":1,"10":0,"bb":2}'
        expect: {status: success, result: [0, 3, 1, 2]}
  - spec: WR-6
    variant: codebase-wildcard-cjs
    provenance: policy
    title: a codebase script's main that its entry re-exports with export * is called, with no parameters bound, in CommonJS
    note: >-
      The entry declares no main, so its signature is an empty parameter
      list (WR-6, WR-7): main gets no arguments, and an override to a
      re-exported function with arguments gets the values of the
      non-underscore keys (WR-V1). The bundle is CommonJS, so the runs
      also hold on Node (D13) (c2b review 1, finding 2).
    codebase: {relative_path: f/wl_step}
    files:
      f/wl_step/cb_wildcard_lib.ts: |
        export function main(x?: number) { return ["main", x ?? "no argument"]; }
        export function helper(x: number) { return ["helper", x]; }
    path: f/wl_step/cb_wildcard_cjs
    script: |
      export * from "./cb_wildcard_lib";
    runs:
      - args: '{"x":1}'
        expect: {status: success, result: [main, no argument]}
      - args: '{"x":5,"_ENTRYPOINT_OVERRIDE":"helper"}'
        expect: {status: success, result: [helper, 5]}
  - spec: WR-6
    variant: codebase-wildcard-esm
    provenance: policy
    title: a codebase script's main that its entry re-exports with export * is called, with no parameters bound, in ES module output
    codebase: {relative_path: f/wl_step, format: esm}
    files:
      f/wl_step/cb_wildcard_lib.ts: |
        export function main(x?: number) { return ["main", x ?? "no argument"]; }
        export function helper(x: number) { return ["helper", x]; }
    path: f/wl_step/cb_wildcard_esm
    script: |
      export * from "./cb_wildcard_lib";
    runs:
      - args: '{"x":1}'
        expect: {status: success, result: [main, no argument]}
      - args: '{"x":5,"_ENTRYPOINT_OVERRIDE":"helper"}'
        expect: {status: success, result: [helper, 5]}
  - spec: WR-6
    variant: codebase-wildcard-host-module
    provenance: policy
    title: a re-exported main whose module imports a host-provided module is called, with no parameters bound
    note: >-
      The host-provided module imports the bun built-in, which esbuild's
      node platform cannot resolve; the codebase bundle reaches it only
      through its shim, and the export names are read with the same
      resolution (c2b review 2, finding 2).
    host_modules:
      - path: f/wl_step/cb_hostwild_host
        script: |
          import { version } from "bun";
          export function read() { return version; }
    codebase: {relative_path: f/wl_step, format: esm}
    files:
      f/wl_step/cb_hostwild_lib.ts: |
        import { read } from "./cb_hostwild_host";
        export function main(x?: number) { return [42, typeof read(), x ?? "no argument"]; }
    path: f/wl_step/cb_hostwild
    script: |
      export * from "./cb_hostwild_lib";
    runs:
      - args: '{"x":1}'
        expect: {status: success, result: [42, string, no argument]}
