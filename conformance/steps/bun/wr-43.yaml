        expect: {status: failure, result: {error: {message: null, stack: "<stack>", name: null}}}
  - spec: WR-43
    variant: null-and-string-objects
    provenance: source-derived
    title: a null field is null alone, a String object is its text, a subclass without a name is Error
    language: nativets
    script: |
      class Sub extends Error {}
      export function main(v: string) {
        if (v === "null") { const e = new Error("m"); (e as any).name = null; throw e; }
        if (v === "string-object") { const e = new Error("m"); (e as any).name = new String("S"); throw e; }
        throw new Sub();
      }
    runs:
      - args: '{"v":"null"}'
        expect: {status: failure, result: {error: {message: m, stack: "<stack>", name: null}}}
      - args: '{"v":"string-object"}'
        expect: {status: failure, result: {error: {message: m, stack: "<stack>", name: S}}}
      - args: '{"v":"subclass"}'
        expect: {status: failure, result: {error: {message: "", stack: "<stack>", name: Error}}}
  - spec: WR-43
    variant: web-api-error
    provenance: source-derived
    title: an error a web API throws is an Error too
    language: nativets
    script: |
      export function main() { return new URL("not a url"); }
    runs:
      - args: '{}'
        claims:
          - {at: /status, equals: failure}
          - {at: /result/error/name, equals: TypeError}
          - {at: /result/error/step_id, absent: true}
  - spec: WR-43
    variant: replaced-stack
    provenance: policy
    title: a stack replaced by a non-string is dropped, and with it every frame
    note: >-
      WR-43/i, which is deferred: the native runtime keeps the frames apart
      from the stack property and still writes the source line;
      JavaScriptCore reads frames only from the stack text, so windmill-lite
      gives null.
    language: nativets
    script: |
      export function main() { const e = new Error("m"); (e as any).stack = 5; throw e; }
    runs:
      - args: '{}'
        expect: {status: failure, result: {error: {message: m, stack: null, name: Error}}}
