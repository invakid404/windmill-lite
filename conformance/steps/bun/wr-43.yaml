          - {at: /result/error/name, equals: SyntaxError}
          - {at: /result/error/step_id, absent: true}
      - args: '{"api":"digest"}'
        claims:
          - {at: /status, equals: failure}
          - {at: /result/error/name, equals: NotSupportedError}
          - {at: /result/error/step_id, absent: true}
