  - spec: WR-43/c
    variant: nativets
    provenance: source-derived
    title: the stack starts with the failing source line, as loaded (nativets)
    language: nativets
    compare: {keep_stack: true}
    script: |
      export function main() {
        throw new Error("x");
      }
    runs:
      - args: '{}'
        claims:
          - {at: /result/error/message, equals: x}
          - {at: /result/error/stack, contains: ["throw new Error(\"x\");\nError: x\n"]}
  - spec: WR-43/c
    variant: bunnative
    provenance: source-derived
    title: the stack starts with the failing source line, as the bundle has it (bunnative)
    note: >-
      A //native script is bundled with Bun's syntax minification (WR-27,
      WR-40), which writes `new Error("x")` as `Error("x")`; the line as
      loaded is the bundle's, so the catalogue's `throw new Error("x")`
      cannot appear for this kind.
    compare: {keep_stack: true}
    script: |
      //native
      export function main() {
        throw new Error("x");
      }
    runs:
      - args: '{}'
        claims:
          - {at: /result/error/message, equals: x}
          - {at: /result/error/stack, contains: ["throw Error(\"x\");\nError: x\n"]}
