  - spec: WR-43
    variant: web-api-rejection-nativets
    provenance: source-derived
    title: a rejection nobody handles from a web API's promise fails the job too (nativets)
    note: >-
      WR-43/d with promises the web APIs return (c3n review, finding 1).
      The error's message is Bun's; the run gets no warning.
    language: nativets
    script: |
      export async function main(api: string) {
        if (api === "json") new Response("invalid json").json();
        else crypto.subtle.digest("bad-algorithm", new Uint8Array());
        await new Promise(r => setTimeout(r, 100));
        return "success";
      }
    runs:
      - args: '{"api":"json"}'
        claims:
