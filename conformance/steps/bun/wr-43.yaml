  - spec: WR-43
    variant: replaced-stack
    provenance: policy
    title: a stack replaced by a non-string is dropped, and with it every frame
    note: >-
      WR-43/i, which is deferred: the native runtime keeps the frames apart
      from the stack property and still writes the source line;
      JavaScriptCore reads frames only from the stack text, so windmill-lite
      gives null.
    language: nativets
    script: |
      export function main() { const e = new Error("m"); (e as any).stack = 5; throw e; }
    runs:
      - args: '{}'
        expect: {status: failure, result: {error: {message: m, stack: null, name: Error}}}
