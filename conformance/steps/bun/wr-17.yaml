# WR-17: a successful result that marks itself failed with a string
# wm_failure is retagged as failed, kept as it is with a ManualFailure
# error put in (milestone N1b, with FX-13's flow fixture).
finding: WR-17
scope: later
cases:
  - spec: WR-17/a
    provenance: source-derived
    title: a string wm_failure retags the run as failed
    script: |
      export function main() { return { wm_failure: "bad input", x: 1 }; }
    runs:
      - args: '{}'
        expect: {status: failure, result: {wm_failure: bad input, x: 1, error: {name: ManualFailure, message: bad input}}}
  - spec: WR-17/b
    provenance: source-derived
    title: a mistyped marker disables the markers
    script: |
      export function main() { return { wm_failure: true }; }
    runs:
      - args: '{}'
        expect: {status: success, result: {wm_failure: true}}
  - spec: WR-17
    variant: null-label
    provenance: source-derived
    title: a null element in wm_labels is not a string, so the markers are disabled
    note: Only a null marker counts as absent (WR-17); an element of wm_labels must be a string.
    script: |
      export function main() { return { wm_failure: "x", wm_labels: [null] }; }
    runs:
      - args: '{}'
        expect: {status: success, result: {wm_failure: x, wm_labels: [null]}}
  - spec: WR-17
    variant: mixed-labels
    provenance: source-derived
    title: a string and a null element in wm_labels disable the markers too
    script: |
      export function main() { return { wm_failure: "x", wm_labels: ["a", null], y: 1 }; }
    runs:
      - args: '{}'
        expect: {status: success, result: {wm_failure: x, wm_labels: [a, null], y: 1}}
  - spec: WR-17
    variant: null-marker
    provenance: source-derived
    title: a null wm_labels marker counts as absent, so wm_failure still fails the run
    script: |
      export function main() { return { wm_failure: "x", wm_labels: null }; }
    runs:
      - args: '{}'
        expect: {status: failure, result: {wm_failure: x, wm_labels: null, error: {name: ManualFailure, message: x}}}
