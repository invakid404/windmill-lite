  - spec: D18
    variant: c-registry-per-script
    provenance: policy
    title: two scripts that each register one name in a dependency module's registry, which refuses a second registration, both succeed
    note: >-
      The synthetic form of ADR 0013's probe, where two scripts each
      register a Mongoose model named Order: one shared instance refuses
      the second; an instance per script, as on Windmill, does not.
    files:
      f/wl_step/d18_registry.ts: |
        const names = new Set<string>();
        export function register(name: string) {
          if (names.has(name)) throw new Error(`already registered: ${name}`);
          names.add(name);
          return names.size;
        }
    path: f/wl_step/d18_c_one
    script: |
      import { register } from "./d18_registry.ts";
      const size = register("Order");
      export function main() { return size; }
    scripts:
      f/wl_step/d18_c_two: |
        import { register } from "./d18_registry.ts";
        const size = register("Order");
        export function main() { return size; }
    runs:
      - args: '{}'
        expect: {status: success, result: 1}
      - args: '{}'
        script: f/wl_step/d18_c_two
        expect: {status: success, result: 1}
  - spec: D18
    variant: d-lazy-initialisation
    provenance: policy
    title: a dependency module a script never reaches runs no load effect in its instance, and one required inside a function initialises at its first call
    codebase: {relative_path: f/wl_step}
    files:
      f/wl_step/d18_eager.ts: |
        (globalThis as any).d18d_eager = ((globalThis as any).d18d_eager ?? 0) + 1;
        export const eager = "eager";
      f/wl_step/d18_lazy.ts: |
        (globalThis as any).d18d_lazy = ((globalThis as any).d18d_lazy ?? 0) + 1;
        export const lazy = "lazy";
      f/wl_step/d18_unreached.ts: |
        (globalThis as any).d18d_unreached = ((globalThis as any).d18d_unreached ?? 0) + 1;
        export const unreached = "unreached";
    path: f/wl_step/d18_d_one
    script: |
      import { eager } from "./d18_eager";
      export function main(load: boolean) {
        const g = globalThis as any;
        const before = g.d18d_lazy ?? 0;
        const got = load ? require("./d18_lazy").lazy : null;
        return { eager, got, before, after: g.d18d_lazy ?? 0, eagerLoads: g.d18d_eager ?? 0, unreached: g.d18d_unreached ?? 0 };
      }
    scripts:
      f/wl_step/d18_d_two: |
        import { unreached } from "./d18_unreached";
        export function main() { return unreached; }
    runs:
      - args: '{"load":false}'
        expect: {status: success, result: {eager: eager, got: null, before: 0, after: 0, eagerLoads: 1, unreached: 0}}
      - args: '{"load":true}'
        expect: {status: success, result: {eager: eager, got: lazy, before: 0, after: 1, eagerLoads: 1, unreached: 0}}
  - spec: D18
    variant: e-initialisation-order
    provenance: policy
    title: an ES module dependency and a CommonJS dependency initialise in import order in both layouts
    note: >-
      esbuild 0.28.0 and Bun 1.3.10 both keep import order in a per-script
      bundle (esbuild splits the entry's code around each hoisted ES
      module), as the shared layout does, so the order is the same.
    codebase: {relative_path: f/wl_step}
    files:
      f/wl_step/d18_order_cjs.js: |
        (globalThis.d18e ??= []).push("cjs");
        module.exports = { cjs: 1 };
      f/wl_step/d18_order_esm.ts: |
        ((globalThis as any).d18e ??= []).push("esm");
        export const esm = 1;
    path: f/wl_step/d18_e
    script: |
      import cjs from "./d18_order_cjs.js";
      import { esm } from "./d18_order_esm";
      export function main() { return [cjs.cjs + esm, ...(globalThis as any).d18e]; }
    runs:
      - args: '{}'
        expect: {status: success, result: [2, cjs, esm]}
  - spec: D18
    variant: f-whole-module-pruning
    provenance: policy
    title: an unused import of a sideEffects false module that no script of the group reaches runs no load effect in either layout
    codebase: {relative_path: f/wl_step}
    files:
      node_modules/d18-pure/package.json: |
        {"name": "d18-pure", "version": "1.0.0", "main": "index.js", "sideEffects": false}
      node_modules/d18-pure/index.js: |
        globalThis.d18f = (globalThis.d18f ?? 0) + 1;
        exports.pure = 1;
    path: f/wl_step/d18_f
    script: |
      import "d18-pure";
      export function main() { return (globalThis as any).d18f ?? 0; }
    runs:
      - args: '{}'
        expect: {status: success, result: 0}
  - spec: D18
    variant: g-unused-code
    provenance: policy
    title: unused code another script uses, a pure initialiser with an effect and a re-exported sibling module, runs in the shared instance only
    deviation: D18
    note: >-
      Both effects break the claims their code makes: the initialiser is
      marked /* @__PURE__ */ and the package sideEffects false. The
      per-script bundle drops them for the first script, which uses
      neither; the group's closure keeps them for the second, and the first
      script's instance initialises the modules that hold them.
    codebase: {relative_path: f/wl_step}
    files:
      node_modules/d18-barrel/package.json: |
        {"name": "d18-barrel", "version": "1.0.0", "main": "index.js", "sideEffects": false}
      node_modules/d18-barrel/index.js: |
        export { x } from "./x.js";
        export { y } from "./y.js";
      node_modules/d18-barrel/x.js: |
        export const x = "x";
      node_modules/d18-barrel/y.js: |
        (globalThis.d18g ??= []).push("y");
        export const y = "y";
      f/wl_step/d18_pure.ts: |
        function note(n: string) { ((globalThis as any).d18g ??= []).push(n); return n; }
        export const used = "used";
        export const other = /* @__PURE__ */ note("pure");
    path: f/wl_step/d18_g_one
    script: |
      import { x } from "d18-barrel";
      import { used } from "./d18_pure";
      export function main() { return [x, used, ...((globalThis as any).d18g ?? [])]; }
    scripts:
      f/wl_step/d18_g_two: |
        import { y } from "d18-barrel";
        import { other } from "./d18_pure";
        export function main() { return [y, other]; }
    runs:
      - args: '{}'
        by_mode:
          warm: {expect: {status: success, result: [x, used, y, pure]}}
          fresh: {expect: {status: success, result: [x, used]}}
        node: {expect: {status: success, result: [x, used]}}
  - spec: D18
    variant: h-require-and-import
    provenance: policy
    title: a codebase dependency's __dirname, __filename and run-time require are the step's, and its import() of a step-local asset resolves as in the per-script bundle
    note: >-
      A require with a variable specifier goes through the instance's
      require, the step's. The import() resolves from the file holding it,
      so the script keeps its per-script bundle in warm mode too
      (shared_code_fallback, ADR 0013 decision item 5); the asset it loads
      has top-level await.
    codebase:
      relative_path: f/wl_step
      assets:
        - {from: f/wl_step/data/d18h.json, to: data/d18h.json}
        - {from: f/wl_step/data/d18h.mjs, to: data/d18h.mjs}
    files:
      f/wl_step/data/d18h.json: |
        {"v": "json asset"}
      f/wl_step/data/d18h.mjs: |
        await Promise.resolve();
        export const v = "tla asset";
      f/wl_step/d18_where.ts: |
        export function where(name: string) {
          return { dirIsCwd: __dirname === process.cwd(), fileInCwd: __filename.startsWith(process.cwd() + "/"), asset: require(name).v };
        }
      f/wl_step/d18_dyn.ts: |
        export async function load(spec: string) { return (await import(spec)).v; }
    path: f/wl_step/d18_h_where
    script: |
      import { where } from "./d18_where";
      export function main() { return where(["./data", "d18h.json"].join("/")); }
    scripts:
      f/wl_step/d18_h_dyn: |
        import { load } from "./d18_dyn";
        export async function main() { return load(["./data", "d18h.mjs"].join("/")); }
    runs:
      - args: '{}'
        expect: {status: success, result: {dirIsCwd: true, fileInCwd: true, asset: json asset}}
      - args: '{}'
        script: f/wl_step/d18_h_dyn
        expect: {status: success, result: tla asset}
  - spec: D18
    variant: h-module-and-exports
    provenance: policy
    title: an ES module dependency of a CommonJS codebase script reads and changes the step module's module.exports, and reads its exports, as in the per-script bundle
    note: >-
      In the per-script bundle a dependency's free module and exports are
      the step module's (WR-50); the closure runs with them too, and hands
      its own table of modules over apart from them.
    codebase: {relative_path: f/wl_step, format: cjs}
    files:
      f/wl_step/d18_module.ts: |
        export function keys() { return Object.keys(module.exports).sort(); }
        export function mark() { module.exports.marked = true; return keys(); }
        export function exportsKeys() { return Object.keys(exports); }
    path: f/wl_step/d18_h_module
    script: |
      import { keys, mark, exportsKeys } from "./d18_module";
      export function main() { const before = keys(); return { before, after: mark(), exports: exportsKeys() }; }
    runs:
      - args: '{}'
        expect: {status: success, result: {before: [main], after: [main, marked], exports: []}}
  - spec: D18
    variant: h-module-esm
    provenance: policy
    title: a dependency of a format esm codebase script finds no module or exports binding, as an ES module does, so reading either throws a ReferenceError
    note: >-
      An ES module codebase group's closure is an ES module file, which
      binds neither name; a binding whose value is undefined would pass the
      typeof checks but not the reads.
    codebase: {relative_path: f/wl_step, format: esm}
    files:
      f/wl_step/d18_module_esm.ts: |
        function read(f: () => unknown) { try { return String(f()); } catch (e) { return (e as Error).name; } }
        export function kinds() { return [typeof module, typeof exports, read(() => module), read(() => exports)]; }
    path: f/wl_step/d18_h_module_esm
    script: |
      import { kinds } from "./d18_module_esm";
      export function main() { return kinds(); }
    runs:
      - args: '{}'
        expect: {status: success, result: [undefined, undefined, ReferenceError, ReferenceError]}
  - spec: D18
    variant: h-module-bun
    provenance: policy
    title: a Bun-built dependency's module and exports are what its per-script bundle makes of them
    files:
      f/wl_step/d18_module_bun.ts: |
        function read(f: () => unknown) { try { return String(f()); } catch (e) { return (e as Error).name; } }
        export function kinds() { return [typeof module, typeof exports, read(() => module)]; }
    path: f/wl_step/d18_h_module_bun
    script: |
      import { kinds } from "./d18_module_bun.ts";
