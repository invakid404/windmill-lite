# D18 (ADR 0001 §5, ADR 0013): shared code. The file's bundle is built with
# shared code: a warm process runs each script's shared-layout module, which
# makes its own instance of its build group's closure, so the scripts'
# dependency modules are compiled once and their state stays per script; a
# fresh process runs the per-script bundle, as without shared code. Each
# case has scripts that share a dependency module, and every run of a case
# goes to one warm process, so a run sees what the case's earlier runs
# left in their instances. The cases show what a script sees of its
# dependencies, which is what its per-script bundle shows, and the
# differences D18 names: stack text (and a load error's message), when an
# ES module dependency's default export is read, and unused code a union
# closure can run. Bun-built cases import workspace scripts;
# codebase cases import files and packages of the folder. The build side
# (closure membership, groups, fallbacks, the manifest) is
# conformance/build/d18.json's; host mode runs the flow suite and
# cmd/windmill-lite's memory test with shared code.
finding: D18
scope: core
shared_code: true
cases:
  - spec: D18
    variant: a-state-per-script
    provenance: policy
    title: two scripts that count in a shared dependency module's state each count their own calls, and a script's own state stays its own
    deviation: D1
    files:
      f/wl_step/d18_counter.ts: |
        export const state = { calls: 0 };
    path: f/wl_step/d18_a_one
    script: |
      import { state } from "./d18_counter.ts";
      let own = 0;
      export function main() { state.calls++; own++; return { dep: state.calls, own }; }
    scripts:
      f/wl_step/d18_a_two: |
        import { state } from "./d18_counter.ts";
        export function main() { state.calls++; return { dep: state.calls }; }
    runs:
      - args: '{}'
        expect: {status: success, result: {dep: 1, own: 1}}
      - args: '{}'
        script: f/wl_step/d18_a_two
        expect: {status: success, result: {dep: 1}}
      - args: '{}'
        by_mode:
          warm: {expect: {status: success, result: {dep: 2, own: 2}}}
          fresh: {expect: {status: success, result: {dep: 1, own: 1}}}
      - args: '{}'
        script: f/wl_step/d18_a_two
        by_mode:
          warm: {expect: {status: success, result: {dep: 2}}}
          fresh: {expect: {status: success, result: {dep: 1}}}
  - spec: D18
    variant: b-identity-per-script
    provenance: policy
    title: an object and a class that a dependency module exports are different for two scripts
    deviation: D1
    files:
      f/wl_step/d18_identity.ts: |
        export class Thing {}
        export const object = { made: "here" };
    path: f/wl_step/d18_b_one
    script: |
      import { Thing, object } from "./d18_identity.ts";
      export function main() { (globalThis as any).d18b = { Thing, object }; return "stashed"; }
    scripts:
      f/wl_step/d18_b_two: |
        import { Thing, object } from "./d18_identity.ts";
        export function main() {
          const s = (globalThis as any).d18b;
          return { stashed: s !== undefined, sameClass: s?.Thing === Thing, sameObject: s?.object === object, instance: s ? new s.Thing() instanceof Thing : false };
        }
    runs:
      - args: '{}'
        expect: {status: success, result: stashed}
      - args: '{}'
        script: f/wl_step/d18_b_two
        by_mode:
          warm: {expect: {status: success, result: {stashed: true, sameClass: false, sameObject: false, instance: false}}}
          fresh: {expect: {status: success, result: {stashed: false, sameClass: false, sameObject: false, instance: false}}}
  - spec: D18
    variant: b-namespace-identity
    provenance: policy
    title: an ES module dependency's namespace object is one object for a Bun-built script's entry and its dependencies, directly and through a namespace re-export
    note: >-
      The entry and a dependency both take the dependency's namespace
      object, so the first two scripts keep their per-script bundles in
      warm mode too (shared_code_fallback, namespace_import); the third
      takes it in a dependency only and runs its shared-layout module.
    files:
      f/wl_step/d18_nsb_dep.ts: |
        export const value = 1;
      f/wl_step/d18_nsb_other.ts: |
        import * as ns from "./d18_nsb_dep.ts";
        export const seen = ns;
      f/wl_step/d18_nsb_mid.ts: |
        export * as again from "./d18_nsb_dep.ts";
    path: f/wl_step/d18_nsb_direct
    script: |
      import * as ns from "./d18_nsb_dep.ts";
      import { seen } from "./d18_nsb_other.ts";
      export function main() { return ns === seen; }
    scripts:
      f/wl_step/d18_nsb_through: |
        import * as ns from "./d18_nsb_dep.ts";
        import { again } from "./d18_nsb_mid.ts";
        export function main() { return ns === again; }
      f/wl_step/d18_nsb_named: |
        import { value } from "./d18_nsb_dep.ts";
        import { seen } from "./d18_nsb_other.ts";
        export function main() { return seen.value === value && Object.keys(seen).join(); }
    runs:
      - args: '{}'
        expect: {status: success, result: true}
      - args: '{}'
        script: f/wl_step/d18_nsb_through
        expect: {status: success, result: true}
      - args: '{}'
        script: f/wl_step/d18_nsb_named
        expect: {status: success, result: value}
