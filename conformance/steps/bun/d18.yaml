  - spec: D18
    variant: b-namespace-shape
    provenance: policy
    title: the namespace object a Bun-built script's entry takes of an ES module dependency has the module's names, in the bundler's order (Bun's is the source's), and no CommonJS interop marker
    note: >-
      Only the entry takes the namespace object, so the script runs its
      shared-layout module in warm mode; its reference lists the module's
      export names.
    files:
      f/wl_step/d18_shb_dep.ts: |
        export const value = 1;
        export function alpha() { return "a"; }
        export default "the default";
    path: f/wl_step/d18_shb
    script: |
      import * as ns from "./d18_shb_dep.ts";
      export function main() {
        return { names: Object.getOwnPropertyNames(ns), keys: Object.keys(ns), marker: "__esModule" in ns, value: ns.value, alpha: ns.alpha(), def: ns.default };
      }
    runs:
      - args: '{}'
        expect: {status: success, result: {names: [value, default, alpha], keys: [value, default, alpha], marker: false, value: 1, alpha: a, def: the default}}
