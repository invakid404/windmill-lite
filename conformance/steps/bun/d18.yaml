  - spec: D18
    variant: h-bun-import
    provenance: policy
    title: a Bun-built dependency's import() resolves from each script's own module, from two directories
    note: >-
      The case's two scripts' modules lie in two directories of the bundle
      (scripts/bun/d18/ and scripts/bun/d18/<case>/); each asks the
      dependency to import its own metadata file beside it, which only the
      script's own module's directory holds. The scripts keep their
      per-script bundles (shared_code_fallback).
    files:
      f/wl_dyn/d18_dyn_bun.ts: |
        export async function load(spec: string) { return (await import(spec)).default.path; }
    path: f/wl_a/d18_h_bun_one
