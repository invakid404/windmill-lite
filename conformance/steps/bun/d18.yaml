    title: a timer a dependency starts while loading is module state, which the fence leaves running, and one it starts in an invocation is cleared when that settles
    files:
      f/wl_step/d18_timer.ts: |
        export const ticks = { n: 0 };
        setInterval(() => ticks.n++, 20);
        export function later() { setTimeout(() => { (globalThis as any).d18s_late = true; }, 150); }
    path: f/wl_step/d18_s
    script: |
      import { ticks, later } from "./d18_timer.ts";
      export async function main(arm: boolean) {
        if (arm) { later(); return "armed"; }
        const at = ticks.n;
        await new Promise((r) => setTimeout(r, 300));
        return { ticking: ticks.n > at, late: (globalThis as any).d18s_late ?? false };
      }
    runs:
      - args: '{"arm":true}'
        expect: {status: success, result: armed}
        warnings: [left_behind]
      - args: '{"arm":false}'
        expect: {status: success, result: {ticking: true, late: false}}
