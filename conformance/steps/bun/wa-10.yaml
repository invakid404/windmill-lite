finding: WA-10
scope: core
note: >-
  Milestone PF2: the read behind getResource, resources/get_value_interpolated
  without a job id, answered by the platform facade (ADR 0007). Each script reads the platform as the stock client does, by fetch at BASE_URL with its token, so the cases need no client: the same reads go through the intercepted fetch (warm) and over loopback TCP (fresh), and the case's setup is what the facade serves. The stock client's own handling of the answers (its prefixes and error wrapping) is checked with windmill-client@1.767.0 by internal/platform/facade's TestProvidersOnTheClient, and the walker's rules at unit level by internal/platform/testdata/interpolation.json.
cases:
  - spec: WA-10/a
    provenance: oracle-observed
    title: "a missing resource is the direct path's 404, text/plain, which getResource wraps and getResource(p, true) turns into undefined"
    script: |
      export async function main(path: string) {
        const e = process.env;
        const res = await fetch(`${e.BASE_URL}/api/w/${e.WM_WORKSPACE}/${path}`, { headers: { authorization: `Bearer ${e.WM_TOKEN}` } });
        return { status: res.status, type: res.headers.get("content-type"), body: await res.text() };
      }
    runs:
      - args: '{"path":"resources/get_value_interpolated/u/x/none"}'
        expect: {status: success, result: {status: 404, type: text/plain, body: "Not found: Resource u/x/none not found"}}
        calls: ["404 GET /w/{ws}/resources/get_value_interpolated/{path}"]
