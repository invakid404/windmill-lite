# WR-50: how a codebase script's job directory is laid out and which
# runtime loads its bundle. The worker writes a placeholder package.json
# of {} first; a tar then unpacks main.js and the assets, so an asset named
# package.json replaces the placeholder, and on Node its "type" decides how
# main.js loads. wltest check's Node side lays out the job directory in that
# order (c2b review 1, finding 3). The case that reads such an asset is in
# d13.yaml; this file's one case has a bundle of its own, because the
# harness extracts every asset of a bundle into its working directory
# (D10), and a package.json there declaring "type": "module" also makes
# Bun import the default export of every CommonJS module in that directory
# as Node does, the whole exports object.
finding: WR-50
scope: core
cases:
  - spec: WR-50
    variant: package-json-type-module
    provenance: source-derived
    title: a package.json asset declaring type module makes Node load a CommonJS bundle as an ES module, which fails; the harness runs it (D13)
    note: >-
      On Node, main.js under "type": "module" is an ES module, so the
      CommonJS bundle fails as it loads, on its first use of module or
      exports. The harness loads a CommonJS codebase module as .cjs, which
      Bun runs as CommonJS whatever package.json says. Node's message
      names the cause, but a 600-character tail may cut it, so the claims
      compare the failure's shape.
    codebase:
      relative_path: f/wl_step
      assets: [{from: f/wl_step/esm/package.json, to: package.json}]
    files:
      f/wl_step/esm/package.json: '{"type": "module"}'
    path: f/wl_step/cb_type_module
    script: |
      export function main() { return "ran"; }
    runs:
      - args: '{}'
        expect: {status: success, result: ran}
        node:
          claims:
            - {at: /status, equals: failure}
            - {at: /result/error/name, equals: ExecutionErr}
            - {at: /result/error/message, prefix: "exit code for \"bun run\": 1, last log lines:\n"}
            - {at: /result/error/exit_code, equals: 1}
