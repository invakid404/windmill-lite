# D11 (ADR 0001 §5, ADR 0004 failure model item 6): an intercepted
# process.exit fixes the step's outcome at the call, as Windmill's exit
# would, but the call goes on: finally blocks run, a catch can swallow the
# sentinel, and how the call ends is reported late. In fresh mode the
# process ends with the call. The outcome is WR-4's: exit 0 with no result
# is WR-V2's empty result, any other code WR-20's log-tail error.
finding: D11
scope: core
cases:
  - spec: D11
    variant: exit-code
    provenance: source-derived
    title: process.exit with a non-zero code fails the step with that exit code; the sentinel ends the call
    deviation: D11
    script: |
      export function main() { process.exit(3); }
    runs:
      - args: '{}'
        by_mode:
          warm:
            expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 3, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 3}}}
            late: [{kind: error, final: true}]
            settled: completed
          fresh:
            expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 3, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 3}}}
            settled: process_exited
  - spec: D11
    variant: exit-caught
    provenance: policy
    title: a catch that swallows the sentinel goes on and returns; the outcome stays the exit's, and the return is late
    deviation: D11
    script: |
      export function main() { try { process.exit(3); } catch {} return "after"; }
    runs:
      - args: '{}'
        by_mode:
          warm:
            expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 3, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 3}}}
            late: [{kind: result, final: true, body: '"after"'}]
            settled: completed
          fresh:
            expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 3, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 3}}}
            settled: process_exited
  - spec: D11
    variant: exit-zero-caught
    provenance: policy
    title: process.exit(0) gives the empty result even when the call goes on and returns
    deviation: D11
    script: |
      export function main() { try { process.exit(0); } catch {} return 1; }
    runs:
      - args: '{}'
        by_mode:
          warm:
            expect: {status: failure, result: {error: {message: "Internal: Result of job is invalid json (empty)", name: InternalErr}}}
            late: [{kind: result, final: true, body: "1"}]
            settled: completed
          fresh:
            expect: {status: failure, result: {error: {message: "Internal: Result of job is invalid json (empty)", name: InternalErr}}}
            settled: process_exited
  - spec: D11
    variant: finally-runs
    provenance: policy
    title: a finally block runs after the exit in warm mode, which a later run of the script sees (with D1)
    deviation: D11
    script: |
      export function main(check: boolean) {
        if (check) return globalThis.wlFinallyRan ?? false;
        try { process.exit(4); } finally { globalThis.wlFinallyRan = true; }
      }
    runs:
      - args: '{}'
        expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 4, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 4}}}
      - args: '{"check":true}'
        by_mode:
          warm: {expect: {status: success, result: true}}
          fresh: {expect: {status: success, result: false}}
  - spec: D11
    variant: exit-status
    provenance: policy
    title: the exit status is the code modulo 256, read as Bun reads it, a numeric string included
    note: Observed on Bun 1.3.10 (process.exit(258) exits 2, "-1" exits 255, 256 exits 0).
    script: |
      export function main(code: unknown) { process.exit(code as number); }
    runs:
      - args: '{"code":258}'
        claims:
          - {at: /result/error/exit_code, equals: 2}
      - args: '{"code":"-1"}'
        claims:
          - {at: /result/error/exit_code, equals: 255}
      - args: '{"code":256}'
        expect: {status: failure, result: {error: {message: "Internal: Result of job is invalid json (empty)", name: InternalErr}}}
      - args: '{}'
        note: No code is process.exitCode, which nothing set, so 0.
        expect: {status: failure, result: {error: {message: "Internal: Result of job is invalid json (empty)", name: InternalErr}}}
      - args: '{"code":9007199254740991}'
        note: The largest safe integer is a valid code.
        claims:
          - {at: /result/error/exit_code, equals: 255}
      - args: '{"code":-9007199254740991}'
        claims:
          - {at: /result/error/exit_code, equals: 1}
      - args: '{"code":"  12  "}'
        note: A string is read as Number reads it.
        claims:
          - {at: /result/error/exit_code, equals: 12}
      - args: '{"code":" "}'
        note: A string of white space reads as 0, so the result is the empty one.
        expect: {status: failure, result: {error: {message: "Internal: Result of job is invalid json (empty)", name: InternalErr}}}
  - spec: D11
    variant: invalid-code
    provenance: policy
    title: a code Bun refuses makes process.exit throw Bun's own error, which the wrapper catches
    note: >-
      On Bun 1.3.10, process.exit(1.5) throws a RangeError before it exits;
      its code, ERR_OUT_OF_RANGE, is not an own property, so it is not in
      extra.
    script: |
      export function main() { process.exit(1.5); }
    runs:
      - args: '{}'
        claims:
          - {at: /status, equals: failure}
          - {at: /result/error/name, equals: RangeError}
          - {at: /result/error/message, prefix: "The value of \"code\" is out of range. It must be an integer. Received 1.5"}
          - {at: /result/error/extra, absent: true}
          - {at: /result/error/step_id, equals: a}
  - spec: D11
    variant: refused-codes
    provenance: policy
    title: codes beyond the safe integers, the empty string and non-numbers are refused with Bun's own error, which the wrapper catches
    note: Observed on Bun 1.3.10 (c3a review 1, finding 3). The error's code is not an own property, so there is no extra.
    script: |
      export function main(code: unknown) { process.exit(code as number); }
    runs:
      - args: '{"code":9007199254740992}'
        claims:
          - {at: /result/error/name, equals: RangeError}
          - {at: /result/error/message, contains: ["must be >= -9007199254740991 and <= 9007199254740991. Received 9007199254740992"]}
      - args: '{"code":-9007199254740992}'
        claims:
          - {at: /result/error/name, equals: RangeError}
      - args: '{"code":"9007199254740993"}'
        claims:
          - {at: /result/error/name, equals: RangeError}
      - args: '{"code":""}'
        claims:
          - {at: /result/error/name, equals: TypeError}
          - {at: /result/error/message, contains: ["Received type string ('')"]}
      - args: '{"code":"x"}'
        claims:
          - {at: /result/error/name, equals: TypeError}
      - args: '{"code":[5]}'
        claims:
          - {at: /result/error/name, equals: TypeError}
  - spec: D11
    variant: refused-code-caught
    provenance: policy
    title: a refused code fixes no outcome, so a step that catches Bun's error goes on to its own result, and process.exitCode is untouched
    script: |
      export function main(code: unknown) {
        try { process.exit(code as number); } catch (e) { return [e.name, process.exitCode ?? null]; }
      }
    runs:
      - args: '{"code":9007199254740992}'
        expect: {status: success, result: [RangeError, null]}
      - args: '{"code":""}'
        expect: {status: success, result: [TypeError, null]}
  - spec: D11
    variant: top-level
    provenance: policy
    title: process.exit while the module evaluates fails every invocation of the script with that exit
    deviation: D11
    script: |
      process.exit(5);
      export function main() { return 1; }
    runs:
      - args: '{}'
        by_mode:
          warm:
            expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 5, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 5}}}
            late: [{kind: error, final: true}]
            settled: completed
          fresh:
            expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 5, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 5}}}
            settled: process_exited
      - args: '{}'
        by_mode:
          warm:
            expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 5, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 5}}}
            settled: completed
          fresh:
            expect: {status: failure, result: {error: {message: "exit code for \"bun run\": 5, last log lines:\n", name: ExecutionErr, step_id: a, exit_code: 5}}}
            settled: process_exited
  - spec: D11
    variant: exit-from-timer
    provenance: policy
    title: an exit from a timer of a call that never ends fixes its outcome, and the call stays in flight
    deviation: D11
    script: |
      export async function main() { setTimeout(() => process.exit(2), 10); return new Promise(() => {}); }
    runs:
      - args: '{}'
        by_mode:
          warm:
            claims:
              - {at: /result/error/exit_code, equals: 2}
            settled: pending
          fresh:
            claims:
              - {at: /result/error/exit_code, equals: 2}
            settled: process_exited
  - spec: D11
    variant: exit-after-result
    provenance: source-derived
    title: a process.exit from a timer after the result changes nothing; Windmill's exit came first (WR-2), and the warm process lives on
    note: >-
      The second run waits until the timer has called process.exit, which it
      sees only in warm mode (D1). The late error it reports is
      internal/harness's TestBunWorkAfterTheResultIsLate.
    deviation: D11
    script: |
      export async function main(wait: boolean) {
        if (wait) {
          for (let i = 0; i < 200 && !globalThis.wlLateExit; i++) await Bun.sleep(10);
          return globalThis.wlLateExit ?? false;
        }
        setTimeout(() => { globalThis.wlLateExit = true; process.exit(9); }, 10);
        return "done";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: done}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: true}}
          fresh: {expect: {status: success, result: false}}
