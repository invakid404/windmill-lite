finding: WA-V2
scope: core
note: >-
  Milestone PF3: the result poll of a UUID that names no job, which the
  facade answers as Windmill does for an id with no job row; the runs a
  step dispatches are polled at the flow level
  (conformance/flows/client-api/dispatch).
cases:
  - spec: WA-V2/a
    provenance: oracle-observed
    title: an unknown job, default query, answers the four fields with explicit nulls
    script: |
      export async function main() {
        const e = process.env;
        const res = await fetch(`${e.BASE_URL}/api/w/${e.WM_WORKSPACE}/jobs_u/completed/get_result_maybe/00000000-0000-4000-8000-000000000000`, { headers: { authorization: `Bearer ${e.WM_TOKEN}` } });
        return [res.status, await res.json()];
      }
    runs:
      - args: '{}'
        expect: {status: success, result: [200, {started: null, success: null, completed: false, result: null}]}
        calls: ["200 GET /w/{ws}/jobs_u/completed/get_result_maybe/{id}"]
  - spec: WA-V2/b
    provenance: oracle-observed
    title: an unknown job with get_started=true answers started false
    script: |
      export async function main() {
        const e = process.env;
        const res = await fetch(`${e.BASE_URL}/api/w/${e.WM_WORKSPACE}/jobs_u/completed/get_result_maybe/00000000-0000-4000-8000-000000000000?get_started=true`, { headers: { authorization: `Bearer ${e.WM_TOKEN}` } });
        return [res.status, await res.json()];
      }
    runs:
      - args: '{}'
        expect: {status: success, result: [200, {started: false, success: null, completed: false, result: null}]}
        calls: ["200 GET /w/{ws}/jobs_u/completed/get_result_maybe/{id}"]
