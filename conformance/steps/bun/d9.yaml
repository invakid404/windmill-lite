# D9 (ADR 0001 §5, ADR 0004 failure model items 2 to 4): process-level
# errors in a shared process. One raised in an invocation's context (a
# timer's throw) fails that invocation as escaped, as the process's exit
# would on Windmill, while its call goes on; one no context owns (a
# detached rejection) fails nothing and reaches every invocation in flight
# as a warning. Work after the result keeps running; its errors are late.
finding: D9
scope: core
cases:
  - spec: D9
    variant: attributed
    provenance: policy
    title: an error thrown from a timer fails its own invocation as escaped with exit code 1 (Q-WR-2), and the call's return is late
    deviation: D9
    script: |
      export async function main() {
        setTimeout(() => { throw new Error("from a timer"); }, 10);
        await Bun.sleep(200);
        return "done";
      }
    runs:
      - args: '{}'
        by_mode:
          warm:
            claims:
              - {at: /status, equals: failure}
              - {at: /result/error/name, equals: ExecutionErr}
              - {at: /result/error/message, prefix: "exit code for \"bun run\": 1, last log lines:\n"}
              - {at: /result/error/message, contains: [from a timer]}
              - {at: /result/error/exit_code, equals: 1}
              - {at: /result/error/step_id, equals: a}
            late: [{kind: result, final: true, body: '"done"'}]
            settled: completed
          fresh:
            claims:
              - {at: /status, equals: failure}
              - {at: /result/error/name, equals: ExecutionErr}
              - {at: /result/error/exit_code, equals: 1}
            settled: process_exited
  - spec: D9
    variant: unattributed
    provenance: policy
    title: a detached rejection fails nothing in warm mode and reaches the invocation in flight as a warning
    note: >-
      In fresh mode the process has no handler to keep it alive: ADR 0004
      measured Bun 1.3.10 exiting with code 1 on one detached rejection;
      Windmill's exit status for it is Q-WR-2's.
    deviation: D9
    script: |
      export async function main() {
        setTimeout(() => Promise.reject(new Error("detached")), 10);
        await Bun.sleep(200);
        return "done";
      }
    runs:
      - args: '{}'
        by_mode:
          warm:
            expect: {status: success, result: done}
            warnings: [unattributed_error]
          fresh:
            claims:
              - {at: /status, equals: failure}
              - {at: /result/error/name, equals: ExecutionErr}
              - {at: /result/error/exit_code, equals: 1}
  - spec: D9
    variant: warning-after-fixed-outcome
    provenance: policy
    title: a call whose outcome an exit fixed is still in flight, so an unattributed error before it ends reaches it as a warning
    note: The runner observes a run up to its settlement, not only up to its outcome (c3a review 1, finding 5).
    deviation: D9
    script: |
      export async function main() {
        try { process.exit(3); } catch {}
        setTimeout(() => Promise.reject(new Error("detached")), 10);
        await Bun.sleep(100);
        return "after";
      }
    runs:
      - args: '{}'
        by_mode:
          warm:
            claims:
              - {at: /result/error/exit_code, equals: 3}
            warnings: [unattributed_error]
          fresh:
            claims:
              - {at: /result/error/exit_code, equals: 3}
            settled: process_exited
  - spec: D9
    variant: process-scope
    provenance: policy
    title: work a module starts through the process scope it captured at load belongs to no invocation, so its error is unattributed
    note: >-
      The module evaluates inside its first invocation's context; the scope
      it captures leaves that invocation out, as a pooled client's
      maintenance timers must be (C3b's settle-time fence never clears
      them). In fresh mode the error ends the process, as in the
      unattributed case.
    deviation: D9
    script: |
      const inProcess = globalThis[Symbol.for("windmill-lite.processScope")]?.capture() ?? ((f) => f());
      export async function main() {
        inProcess(() => setTimeout(() => { throw new Error("pool maintenance"); }, 10));
        await Bun.sleep(200);
        return "done";
      }
    runs:
      - args: '{}'
        by_mode:
          warm:
            expect: {status: success, result: done}
            warnings: [unattributed_error]
          fresh:
            claims:
              - {at: /status, equals: failure}
              - {at: /result/error/name, equals: ExecutionErr}
              - {at: /result/error/exit_code, equals: 1}
  - spec: D9
    variant: error-after-result
    provenance: source-derived
    title: a timer that would throw after the result never fires; Windmill's exit cuts it off (WR-2), and in warm mode the settle-time fence clears it
    note: >-
      The second run waits for a control timer that the first run started
      through the process scope at the same moment and with the same delay,
      which the fence leaves alone: once it has fired, the step's timer
      would have fired too. In fresh mode neither fires, since the process
      ended with the first run. Before the fence (C3a) the warm reading was
      that the timer fired and its error was late. That no late report
      arrives even after settlement is checked at the end of the case.
    deviation: D9
    script: |
      const inProcess = globalThis[Symbol.for("windmill-lite.processScope")]?.capture() ?? ((f) => f());
      export async function main(wait: boolean) {
        if (wait) {
          for (let i = 0; i < 100 && !globalThis.wlControlFired; i++) await Bun.sleep(10);
          return [globalThis.wlControlFired ?? false, globalThis.wlLateThrown ?? false];
        }
        setTimeout(() => { globalThis.wlLateThrown = true; throw new Error("late"); }, 10);
        inProcess(() => setTimeout(() => { globalThis.wlControlFired = true; }, 10));
        return "done";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: done}
        warnings: [left_behind]
        left: {timeout: 1}
        settled: completed
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: [true, false]}}
          fresh: {expect: {status: success, result: [false, false]}}
  - spec: D9
    variant: fence-timers
    provenance: policy
    title: every timeout, interval and immediate a step leaves pending is reported when it settles, and the fence clears them all
    note: >-
      The report is a left_behind warning just before the frame that
      settles the invocation, in both modes: in fresh mode the process's
      exit then cuts the work off, as on Windmill (WR-2). The second run
      waits for a control timer of the process scope, which the fence leaves
      alone, before it reads what fired.
    deviation: D9
    script: |
      const inProcess = globalThis[Symbol.for("windmill-lite.processScope")]?.capture() ?? ((f) => f());
      export async function main(wait: boolean) {
        if (wait) {
          for (let i = 0; i < 100 && !globalThis.wlControlFired; i++) await Bun.sleep(10);
          return [globalThis.wlControlFired ?? false, globalThis.wlFired ?? []];
        }
        const fired = (what) => () => { (globalThis.wlFired ??= []).push(what); };
        setTimeout(fired("timeout"), 10);
        setInterval(fired("interval"), 10);
        setImmediate(fired("immediate"));
        const kept = setTimeout(fired("cleared"), 10);
        clearTimeout(kept);
        setTimeout(() => {}, 0).unref();
        inProcess(() => setTimeout(() => { globalThis.wlControlFired = true; }, 30));
        return "done";
      }
    runs:
      - args: '{}'
        note: The cleared timeout is not left behind; the unref'd one is.
        expect: {status: success, result: done}
        warnings: [left_behind]
        left: {immediate: 1, interval: 1, timeout: 2}
        settled: completed
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: [true, []]}}
          fresh: {expect: {status: success, result: [false, []]}}
  - spec: D9
    variant: fence-node-timers
    provenance: policy
    title: the fence covers the timers of node:timers, which a step imports by name
    deviation: D9
    script: |
      import { setTimeout as later, setInterval as every } from "node:timers";
      export async function main(wait: boolean) {
        if (wait) {
          await Bun.sleep(100);
          return globalThis.wlFired ?? [];
        }
        later(() => { (globalThis.wlFired ??= []).push("timeout"); }, 10);
        every(() => { (globalThis.wlFired ??= []).push("interval"); }, 10);
        return "done";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: done}
        warnings: [left_behind]
        left: {interval: 1, timeout: 1}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: []}}
          fresh: {expect: {status: success, result: []}}
  - spec: D9
    variant: fence-fetch
    provenance: policy
    title: a request a step leaves in flight is aborted when it settles, with an AbortError
    note: >-
      The module starts a local server whose handler never answers; the
      step requests it and returns without awaiting the response. In fresh
      mode the second run's process never made the request.
    deviation: D9
    script: |
      const server = Bun.serve({ port: 0, hostname: "127.0.0.1", fetch: () => new Promise(() => {}) });
      export async function main(wait: boolean) {
        if (wait) {
          for (let i = 0; i < 100 && globalThis.wlFetch === undefined && globalThis.wlRequested; i++) await Bun.sleep(10);
          return globalThis.wlFetch ?? null;
        }
        globalThis.wlRequested = true;
        fetch(server.url).then(() => "answered", (e) => e.name).then((r) => { globalThis.wlFetch = r; });
        return "requested";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: requested}
        warnings: [left_behind]
        left: {fetch: 1}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: AbortError}}
          fresh: {expect: {status: success, result: null}}
  - spec: D9
    variant: fence-log
    provenance: policy
    title: output that a step's work writes after it settled is dropped, though the work itself runs on
    note: >-
      The write comes from a continuation of a promise-based wait, which
      the fence does not stop. No late report reaches the engine for the
      first run up to the end of the case; the second run sees that the
      continuation ran, in warm mode only.
    deviation: D9
    script: |
      export async function main(wait: boolean) {
        if (wait) {
          for (let i = 0; i < 100 && !globalThis.wlLogged; i++) await Bun.sleep(10);
          return globalThis.wlLogged ?? false;
        }
        console.log("before the result");
        Bun.sleep(20).then(() => { console.log("after settlement"); process.stdout.write("again\n"); globalThis.wlLogged = true; });
        return "done";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: done}
        settled: completed
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: true}}
          fresh: {expect: {status: success, result: false}}
  - spec: D9
    variant: module-evaluation
    provenance: policy
    title: a timer a step module starts while it evaluates belongs to the module, so it survives the invocation that loaded it and is not reported
    note: >-
      Module state outlives invocations in warm mode (D1), and a client a
      module makes at load keeps its maintenance timers there: the fence
      leaves them alone (ADR 0004, loading). In fresh mode the process ended
      with the first run, and the second run's module is new.
    deviation: D9
    script: |
      globalThis.wlTicks = 0;
      setInterval(() => { globalThis.wlTicks++; }, 5);
      export async function main(wait: boolean) {
        if (!wait) {
          globalThis.wlAtSettlement = globalThis.wlTicks;
          return "loaded";
        }
        if (globalThis.wlAtSettlement === undefined) return false;
        for (let i = 0; i < 100 && globalThis.wlTicks <= globalThis.wlAtSettlement; i++) await Bun.sleep(5);
        return globalThis.wlTicks > globalThis.wlAtSettlement;
      }
    runs:
      - args: '{}'
        expect: {status: success, result: loaded}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: true}}
          fresh: {expect: {status: success, result: false}}
  - spec: D9
    variant: work-after-settlement
    provenance: policy
    title: a timer that a step's work starts after the step settled is cleared at once, so it never fires
    deviation: D9
    script: |
      export async function main(wait: boolean) {
        if (wait) {
          for (let i = 0; i < 100 && !globalThis.wlScheduled; i++) await Bun.sleep(10);
          await Bun.sleep(50);
          return [globalThis.wlScheduled ?? false, globalThis.wlFired ?? false];
        }
        Bun.sleep(10).then(() => {
          setTimeout(() => { globalThis.wlFired = true; }, 0);
          globalThis.wlScheduled = true;
        });
        return "done";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: done}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: [true, false]}}
          fresh: {expect: {status: success, result: [false, false]}}
  - spec: D9
    variant: fence-fetch-body
    provenance: policy
    title: a request whose response headers arrived but whose body is still arriving is in flight, so it is reported and its body aborted; a response read to the end is not
    note: >-
      The module's server sends a first chunk and holds the rest. The step
      awaits the headers, starts reading the body without awaiting it, and
      returns; a second request, read to the end, is the control (c3b
      review 1, R1-2).
    deviation: D9
    script: |
      const server = Bun.serve({
        port: 0,
        hostname: "127.0.0.1",
        fetch: (req) =>
          new URL(req.url).pathname === "/whole"
            ? new Response("whole")
            : new Response(new ReadableStream({ start(c) { c.enqueue(new TextEncoder().encode("first")); } })),
      });
      export async function main(wait: boolean) {
        if (wait) {
          for (let i = 0; i < 100 && globalThis.wlBody === undefined && globalThis.wlRequested; i++) await Bun.sleep(10);
          return [globalThis.wlWhole ?? null, globalThis.wlBody ?? null];
        }
        globalThis.wlRequested = true;
        globalThis.wlWhole = await (await fetch(new URL("/whole", server.url))).text();
        const res = await fetch(new URL("/stream", server.url));
        res.text().then(() => "read", (e) => e.name).then((r) => { globalThis.wlBody = r; });
        return "headers";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: headers}
        warnings: [left_behind]
        left: {fetch: 1}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: [whole, AbortError]}}
          fresh: {expect: {status: success, result: [null, null]}}
  - spec: D9
    variant: fence-refresh
    provenance: policy
    title: a timeout re-armed with refresh() after it fired, by the step or by its own callback, is the step's again, so it is reported and cleared
    note: >-
      A process-scope timeout that refreshes itself is the control: it fires
      twice, after the step settled (c3b review 1, R1-3).
    deviation: D9
    script: |
      const inProcess = globalThis[Symbol.for("windmill-lite.processScope")]?.capture() ?? ((f) => f());
      const count = (k) => { globalThis[k] = (globalThis[k] ?? 0) + 1; };
      export async function main(wait: boolean) {
        if (wait) {
          for (let i = 0; i < 100 && !(globalThis.wlControl >= 2); i++) await Bun.sleep(10);
          return [globalThis.wlControl ?? 0, globalThis.wlRefreshed ?? 0, globalThis.wlSelf ?? 0];
        }
        // Each is re-armed last, so both are pending when the step returns.
        await new Promise((r) => { const s = setTimeout(() => { count("wlSelf"); s.refresh(); r(); }, 50); });
        let t;
        await new Promise((r) => { t = setTimeout(() => { count("wlRefreshed"); r(); }, 1); });
        t.refresh();
        inProcess(() => { const c = setTimeout(() => { count("wlControl"); if (globalThis.wlControl === 1) c.refresh(); }, 5); });
        return "done";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: done}
        warnings: [left_behind]
        left: {timeout: 2}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: [2, 1, 1]}}
          fresh: {expect: {status: success, result: [0, 0, 0]}}
  - spec: D9
    variant: fence-fetch-branches
    provenance: policy
    title: a read that fails without reading, or one clone canceled while the other reads, leaves the request in flight, so settlement reports and aborts it
    note: >-
      The module's server sends a first chunk and holds the rest. One
      response is read while a second text() fails with a TypeError; another
      is cloned, the clone read and the original's body canceled. Both
      requests are still arriving when the step settles (c3b review 2, R2-1).
    deviation: D9
    script: |
      const server = Bun.serve({
        port: 0,
        hostname: "127.0.0.1",
        fetch: () => new Response(new ReadableStream({ start(c) { c.enqueue(new TextEncoder().encode("first")); } })),
      });
      const outcome = (p) => p.then(() => "read", (e) => e.name);
      export async function main(wait: boolean) {
        const g = globalThis;
        if (wait) {
          for (let i = 0; i < 100 && g.wlStarted && !(g.wlFirst && g.wlCloned); i++) await Bun.sleep(10);
          return [g.wlSecond ?? null, g.wlFirst ?? null, g.wlCloned ?? null];
        }
        g.wlStarted = true;
        const one = await fetch(server.url);
        outcome(one.text()).then((r) => { g.wlFirst = r; });
        g.wlSecond = await outcome(one.text());
        const two = await fetch(server.url);
        outcome(two.clone().text()).then((r) => { g.wlCloned = r; });
        void two.body.cancel();
        return "reading";
      }
    runs:
      - args: '{}'
        expect: {status: success, result: reading}
        warnings: [left_behind]
        left: {fetch: 2}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: [TypeError, AbortError, AbortError]}}
          fresh: {expect: {status: success, result: [null, null, null]}}
  - spec: D9
    variant: fetch-read-unhandled
    provenance: policy
    title: a reading method's rejection that the step leaves unhandled stays unhandled through the fetch view, so it is the unattributed error a detached rejection is
    note: >-
      The module's server answers text that is not JSON; the step calls
      json() and neither awaits nor catches it. The failed read is no
      evidence that the transfer ended, so the request is also counted at
      settlement (c3b review 3).
    deviation: D9
    script: |
      const server = Bun.serve({ port: 0, hostname: "127.0.0.1", fetch: () => new Response("not json") });
      export async function main() {
        const res = await fetch(server.url);
        res.json();
        await Bun.sleep(100);
        return "done";
      }
    runs:
      - args: '{}'
        by_mode:
          warm:
            expect: {status: success, result: done}
            warnings: [unattributed_error, left_behind]
            left: {fetch: 1}
          fresh:
            claims:
              - {at: /status, equals: failure}
              - {at: /result/error/name, equals: ExecutionErr}
              - {at: /result/error/exit_code, equals: 1}
