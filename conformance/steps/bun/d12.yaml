# D12 (ADR 0001 §5, ADR 0010): host-provided modules. A harness the engine
# spawned registers the bundle's own copy of each, in the manifest's
# order, before any step loads; a step reaches it through its shim, so the
# copy is evaluated once per process. (In host mode the host registers its
# own instances; cmd/windmill-lite tests that.)
finding: D12
scope: core
cases:
  - spec: D12
    variant: spawned-registration
    provenance: policy
    title: a step reads the registered copy of a host-provided module through its shim, and inlines none of its own
    host_modules:
      - path: f/wl_step/shared
        script: |
          globalThis.wlLoads = (globalThis.wlLoads ?? 0) + 1;
          export const tag = "registered copy";
          export function loads() { return globalThis.wlLoads; }
    script: |
      import { loads, tag } from "./shared.ts";
      export function main() { return [tag, loads()]; }
    runs:
      - args: '{}'
        expect: {status: success, result: [registered copy, 1]}
  - spec: D12
    variant: registration-order
    provenance: policy
    title: a host-provided module that imports another is registered after it and reads its registered instance
    host_modules:
      - path: f/wl_step/base
        script: |
          export const counter = { n: 0 };
      - path: f/wl_step/derived
        script: |
          import { counter } from "./base.ts";
          export function bump() { return ++counter.n; }
    script: |
      import { counter } from "./base.ts";
      import { bump } from "./derived.ts";
      export function main() { bump(); bump(); return counter.n; }
    runs:
      - args: '{}'
        expect: {status: success, result: 2}
  - spec: D12
    variant: lazy-import-cycle
    provenance: policy
    title: host-provided modules whose cycle closes only through an import() inside a function are registered by their load-time imports, once each
    note: >-
      lazy_a imports lazy_b while it loads; lazy_b imports lazy_a only when
      later() is called. The harness registers lazy_b, then lazy_a; the
      step and lazy_b's copy reach lazy_a through the registry, so each
      module loads once in the process.
    host_modules:
      - path: f/wl_step/lazy_a
        script: |
          import { b } from "./lazy_b.ts";
          const loads = (globalThis.wlLazyLoads ??= { a: 0, b: 0 });
          loads.a++;
          export function a() { return "a" + b(); }
      - path: f/wl_step/lazy_b
        script: |
          const loads = (globalThis.wlLazyLoads ??= { a: 0, b: 0 });
          loads.b++;
          export function b() { return "b"; }
          export async function later() { const { a } = await import("./lazy_a.ts"); return a(); }
    script: |
      import { a } from "./lazy_a.ts";
      import { later } from "./lazy_b.ts";
      export async function main() { return [a(), await later(), globalThis.wlLazyLoads]; }
    runs:
      - args: '{}'
        expect: {status: success, result: [ab, ab, {a: 1, b: 1}]}
  - spec: D12
    variant: lazy-import-during-load
    provenance: policy
    title: a function-level import() that runs while its module registers, before the imported module does, fails naming that module's key, and works after
    note: >-
      early_b calls later() at top level, while the harness registers it
      and before early_a is registered; the read of early_a fails with the
      not-registered error, which early_b keeps. The step's call reads
      early_a after its registration.
    host_modules:
      - path: f/wl_step/early_a
        script: |
          import { b } from "./early_b.ts";
          export function a() { return "a" + b(); }
      - path: f/wl_step/early_b
        script: |
          export function b() { return "b"; }
          export async function later() { const { a } = await import("./early_a.ts"); return a(); }
          export const early = await later().then(String, (e) => e.message);
    script: |
      import { early, later } from "./early_b.ts";
      export async function main() { return [early, await later()]; }
    runs:
      - args: '{}'
        expect:
          status: success
          result:
            - "host-provided module not registered: f/wl_step/early_a.ts (a listed module registered before it imports it lazily, and read it before its registration)"
            - ab
  - spec: D12
    variant: pool-process-scope
    provenance: policy
    title: a host-provided pool that captures the process scope at load starts its maintenance through it, so a step that triggers it owns none of it
    note: >-
      The process scope is published before the harness registers the
      bundle's host-provided modules, so a capture at load finds it. A
      factory called later runs in its caller's context unless it re-enters
      the captured one, as start() does here; its timer's error is then
      unattributed, not the step's (c3a review 1, finding 1).
    deviation: D9
    host_modules:
      - path: f/wl_step/pool
        script: |
          const scope = globalThis[Symbol.for("windmill-lite.processScope")];
          if (!scope) throw new Error("the process scope is not published");
          const inProcess = scope.capture();
          export function start() {
            inProcess(() => setTimeout(() => { throw new Error("pool maintenance"); }, 10));
          }
    script: |
      import { start } from "./pool.ts";
      export async function main() { start(); await Bun.sleep(150); return "done"; }
    runs:
      - args: '{}'
        by_mode:
          warm:
            expect: {status: success, result: done}
            warnings: [unattributed_error]
          fresh:
            claims:
              - {at: /status, equals: failure}
              - {at: /result/error/name, equals: ExecutionErr}
              - {at: /result/error/exit_code, equals: 1}
  - spec: D12
    variant: pool-without-scope
    provenance: policy
    title: the same pool without the process scope starts its timer in the calling step's context, which then owns its error
    note: 'The control of pool-process-scope: a module that loaded outside every invocation is not enough.'
    host_modules:
      - path: f/wl_step/bare_pool
        script: |
          export function start() {
            setTimeout(() => { throw new Error("pool maintenance"); }, 10);
          }
    script: |
      import { start } from "./bare_pool.ts";
      export async function main() { start(); await Bun.sleep(150); return "done"; }
    runs:
      - args: '{}'
        claims:
          - {at: /status, equals: failure}
          - {at: /result/error/name, equals: ExecutionErr}
          - {at: /result/error/exit_code, equals: 1}
          - {at: /result/error/message, contains: [pool maintenance]}
  - spec: D12
    variant: pool-monitor
    provenance: policy
    title: a pooled client made in run 1 through the pool's captured scope keeps its monitor after run 1 settles, so run 2 sees the failover it detected
    note: >-
      The pool makes its client, and the client's monitor timer, in the
      scope it captured at load, never the borrower's (decisions,
      2026-10-28, the pooler study), so the settle-time fence does not
      clear the monitor and run 1 leaves nothing behind. Run 2 waits, up to
      2 s, for the client run 1 made to have checked three times, and then
      borrows: an interval that a busy process holds up does not catch up
      the ticks it missed, so a fixed wait could see fewer (FU7). In fresh
      mode, where the process is new, there is no client to wait for, and
      run 2 gets a new one whose monitor has not run.
    deviation: D9
    host_modules:
      - path: f/wl_step/monitored_pool
        script: |
          const inProcess = globalThis[Symbol.for("windmill-lite.processScope")].capture();
          let client;
          export function connect() {
            return inProcess(() => {
              client ??= { primary: "node-a", checks: 0 };
              client.monitor ??= setInterval(() => {
                client.checks++;
                if (client.checks === 3) client.primary = "node-b";
              }, 5);
              return client;
            });
          }
          export function existing() {
            return client;
          }
    script: |
      import { connect, existing } from "./monitored_pool.ts";
      export async function main(later: boolean) {
        const until = Date.now() + 2000;
        while (later && existing() && existing().checks < 3 && Date.now() < until) await Bun.sleep(5);
        const c = connect();
        return [c.primary, c.checks >= 3];
      }
    runs:
      - args: '{}'
        expect: {status: success, result: [node-a, false]}
      - args: '{"later":true}'
        by_mode:
          warm: {expect: {status: success, result: [node-b, true]}}
          fresh: {expect: {status: success, result: [node-a, false]}}
  - spec: D12
    variant: pool-handshake-timeout
    provenance: policy
    title: a pool's handshake timeout that crosses the borrowing step's settlement still fires, and gives its permit back
    note: >-
      Run 1 starts a connection, which takes the pool's one permit and
      never answers, and returns before the handshake's timeout. The timeout
      was set in the pool's captured scope, so the fence leaves it alone;
      run 2 finds the permit back. In fresh mode run 2's pool is new.
    deviation: D9
    host_modules:
      - path: f/wl_step/permit_pool
        script: |
          const inProcess = globalThis[Symbol.for("windmill-lite.processScope")].capture();
          export const pool = { permits: 1 };
          export function connect(ms) {
            return inProcess(() => {
              pool.permits--;
              return new Promise((_, reject) => setTimeout(() => { pool.permits++; reject(new Error("handshake timed out")); }, ms));
            });
          }
    script: |
      import { connect, pool } from "./permit_pool.ts";
      export async function main(wait: boolean) {
        if (!wait) {
          connect(30).catch(() => {});
          return pool.permits;
        }
        for (let i = 0; i < 100 && pool.permits < 1; i++) await Bun.sleep(10);
        return pool.permits;
      }
    runs:
      - args: '{}'
        expect: {status: success, result: 0}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: 1}}
          fresh: {expect: {status: success, result: 1}}
  - spec: D12
    variant: pool-handshake-without-scope
    provenance: policy
    title: the same pool without the captured scope sets its handshake timeout in the borrower's context, so the fence clears it and the permit is lost
    note: >-
      The control of pool-handshake-timeout, and why a pool must make its
      connections in its own scope: run 1 leaves the timeout behind, which
      is reported, and in warm mode run 2 waits in vain for the permit.
    deviation: D9
    host_modules:
      - path: f/wl_step/bare_permit_pool
        script: |
          export const pool = { permits: 1 };
          export function connect(ms) {
            pool.permits--;
            return new Promise((_, reject) => setTimeout(() => { pool.permits++; reject(new Error("handshake timed out")); }, ms));
          }
    script: |
      import { connect, pool } from "./bare_permit_pool.ts";
      export async function main(wait: boolean) {
        if (!wait) {
          connect(30).catch(() => {});
          return pool.permits;
        }
        for (let i = 0; i < 30 && pool.permits < 1; i++) await Bun.sleep(10);
        return pool.permits;
      }
    runs:
      - args: '{}'
        expect: {status: success, result: 0}
        warnings: [left_behind]
        left: {timeout: 1}
      - args: '{"wait":true}'
        by_mode:
          warm: {expect: {status: success, result: 0}}
          fresh: {expect: {status: success, result: 1}}
