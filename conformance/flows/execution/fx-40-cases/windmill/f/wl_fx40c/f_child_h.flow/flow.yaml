summary: "FX-40/f: with a failure module"
value:
  modules:
    - id: a
      value:
        type: rawscript
        content: "!inline a.ts"
        language: bun
        input_transforms: {v: {type: javascript, expr: flow_input.v}}
      stop_after_if:
        expr: "true"
        skip_if_stopped: false
        error_message: halt
  failure_module:
    id: failure
    value:
      type: rawscript
      content: "!inline failure.ts"
      language: bun
      input_transforms: {}
  cache_ttl: 60
schema:
  "$schema": "https://json-schema.org/draft/2020-12/schema"
  type: object
  properties: {v: {type: string}}
