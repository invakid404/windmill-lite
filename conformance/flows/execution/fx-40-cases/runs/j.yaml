# FX-40/j: a hit does not resolve $var: the variable changes from a to b
# between the calls, and both return the first call's value, which starts
# a:.
spec: [FX-40/j]
target: f/wl_fx40c/j
expect:
  status: success
  result: "a:<job:m:s1/m:s>"
  steps:
    "m:s1": {status: success, result: "a:<job:m:s1/m:s>"}
    "m:u": {status: success, result: 200}
    "m:s2": {status: success, result: "a:<job:m:s1/m:s>"}
