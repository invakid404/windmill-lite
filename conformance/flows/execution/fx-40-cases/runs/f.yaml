# FX-40/f: an error stop is not stored: both calls fail with the
# EarlyStopError and a runs both times (the calls tolerate the failure, so
# the second one runs).
spec: [FX-40/f]
target: f/wl_fx40c/f
note: "Predicted with a's module status a success; recorded in oracle run 40994947681 as a failure while a's job succeeded with 1, as for any stop (FX-V2/a)."
expect:
  status: success
  result: {error: {name: EarlyStopError, message: halt}}
  steps:
    "m:s1":
      status: failure
      result: {error: {name: EarlyStopError, message: halt}}
    "m:s1/m:a":
      status: success
      module: failure
      result: 1
      carried: {error: {name: EarlyStopError, message: halt}}
    "m:s2":
      status: failure
      result: {error: {name: EarlyStopError, message: halt}}
    "m:s2/m:a":
      status: success
      module: failure
      result: 1
      carried: {error: {name: EarlyStopError, message: halt}}
