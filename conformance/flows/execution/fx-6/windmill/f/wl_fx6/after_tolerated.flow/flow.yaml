summary: FX-6/b the step after a tolerated failure sees the wrapped error
value:
  modules:
    - id: a
      value:
        type: rawscript
        content: '!inline a.ts'
        input_transforms: {}
        lock: '!inline a.lock'
        language: bun
      continue_on_error: true
    - id: b
      value:
        type: rawscript
        content: '!inline b.ts'
        input_transforms:
          p:
            type: javascript
            expr: previous_result
        lock: '!inline b.lock'
        language: bun
