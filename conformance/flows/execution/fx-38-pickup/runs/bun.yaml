# FX-38/b's variant: b a Bun step, whose script job ends the same way
# without running.
spec: [FX-38/b]
target: f/wl_fx38b/bun
cancel_after_ms: 4500
expect:
  status: canceled
  result:
    error:
      message: "Job canceled: wltest: cancel_after_ms by admin"
      name: Canceled
      reason: "wltest: cancel_after_ms"
      canceler: admin
  steps:
    "m:a": {status: success, result: 1}
    "m:b":
      status: failure
      result:
        error:
          message: "Job canceled: wltest: cancel_after_ms by admin"
          name: Canceled
          reason: "wltest: cancel_after_ms"
          canceler: admin
