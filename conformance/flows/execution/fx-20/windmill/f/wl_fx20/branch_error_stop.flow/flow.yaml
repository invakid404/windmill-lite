summary: FX-20 an error-stop in a branch body fails the parent
value:
  modules:
    - id: br
      value:
        type: branchone
        branches: []
        default:
          - id: x
            value:
              type: rawscript
              content: '!inline x.ts'
              input_transforms: {}
              lock: '!inline x.lock'
              language: bun
            stop_after_if:
              error_message: E
              expr: 'true'
              skip_if_stopped: false
    - id: y
      value:
        type: rawscript
        content: '!inline y.ts'
        input_transforms: {}
        lock: '!inline y.lock'
        language: bun
