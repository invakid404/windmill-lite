summary: FX-21 a throwing stop_after_if still enters the failure module
value:
  modules:
    - id: a
      value:
        type: rawscript
        content: '!inline a.ts'
        language: bun
        input_transforms: {}
      stop_after_if:
        expr: 'null.x'
        skip_if_stopped: false
      continue_on_error: true
    - id: b
      value:
        type: rawscript
        content: '!inline b.ts'
        language: bun
        input_transforms: {}
  failure_module:
    id: failure
    value:
      type: rawscript
      content: '!inline failure.ts'
      language: bun
      input_transforms: {}
