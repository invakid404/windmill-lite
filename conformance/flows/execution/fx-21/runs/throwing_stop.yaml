# FX-21/a: evaluating the predicate throws, so the completion becomes an
# unrecoverable failure whose error value is the evaluation error's display
# string; continue_on_error does not apply, so b never runs. a's stored job
# result stays 1 (FX-V2). The string is FX-21's "Error: QuickJS evaluation
# error: ... @<location>", here with the engine's stack before the Rust
# location, as oracle run 40685013818 recorded it.
spec: [FX-21/a, FX-V2]
target: f/wl_fx21/throwing_stop
expect:
  status: failure
  result: {error: "Error: QuickJS evaluation error: Error: cannot read property 'x' of null\n    at <anonymous> (eval_script:1:35)\n    at <eval> (eval_script:1:44)\n @worker_flow.rs:2451:11"}
  steps:
    "m:a": {status: success, module: failure, args: {}, result: 1}
    "m:b": {status: not_run}
