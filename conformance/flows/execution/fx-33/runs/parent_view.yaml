# FX-33, seen from a parent (FX-33/h): the child recovers, so its own job
# is marked successful, but the parent sees a failed module whose result is
# the failure module's. The parent has no failure module of its own, and
# the failure ends it: on CE v1.862.0 the failure carries the child's
# recovery, so the parent, a root flow, succeeds with that result; on CE
# v1.767.0 it failed with it. The step error's job_id and flow_path are CE
# v1.862.0's error keys.
spec: [FX-33, FX-33/h]
target: f/wl_fx33/parent
args: {ret: {recover: true, v: 1}}
expect:
  status: success
  result: {recover: true, v: 1}
  steps:
    "m:s":
      status: success
      module: failure
      args: {ret: {recover: true, v: 1}}
      result: {recover: true, v: 1}
    "m:s/m:a":
      status: failure
      args: {}
      result: {error: {message: x, name: Error, stack: "<stack>", step_id: a, job_id: "<job:m:s/m:a>", flow_path: f/wl_fx33/recover}}
    "m:s/s:failure": {status: success, args: {v: {recover: true, v: 1}}, result: {recover: true, v: 1}}
