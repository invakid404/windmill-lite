summary: FX-V6/a computed indexing
value:
  modules:
    - id: a
      value:
        type: rawscript
        content: '!inline a.ts'
        input_transforms: {}
        lock: '!inline a.lock'
        language: bun
      stop_after_if:
        error_message: E
        expr: 'true'
        skip_if_stopped: false
  failure_module:
    id: failure
    value:
      type: rawscript
      content: '!inline failure.ts'
      input_transforms:
        carried:
          type: javascript
          expr: previous_result && results[flow_input.target]
        stored:
          type: javascript
          expr: results[flow_input.target]
      lock: '!inline failure.lock'
      language: bun
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
