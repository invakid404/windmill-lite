# FX-7/d: a bare result is an unbound identifier in a transform, so the step
# fails before it runs with the pre-run error of FX-14: ExecutionErr, empty
# args, no step_id. The reference asserts only the prefix and an engine
# ReferenceError. Oracle run 40685013818 recorded the engine text: Windmill
# renders the exception as "QuickJS evaluation error: Error: ...", with the
# name Error rather than ReferenceError, followed by the engine's stack.
spec: [FX-7/d, FX-14]
target: f/wl_fx7/result_unbound
expect:
  status: failure
  result: {error: {name: ExecutionErr, message: "Error during isolated evaluation of expression `result`:\nQuickJS evaluation error: Error: result is not defined\n    at <anonymous> (eval_script:1:1)\n    at <eval> (eval_script:1:35)\n"}}
  steps:
    "m:a":
      status: failure
      args: {}
      result: {error: {name: ExecutionErr, message: "Error during isolated evaluation of expression `result`:\nQuickJS evaluation error: Error: result is not defined\n    at <anonymous> (eval_script:1:1)\n    at <eval> (eval_script:1:35)\n"}}
