# FX-7/d: a bare result is an unbound identifier in a transform, so the step
# fails before it runs with the pre-run error of FX-14: ExecutionErr, empty
# args, no step_id. The engine's ReferenceError text follows the prefix.
spec: [FX-7/d, FX-14]
target: f/wl_fx7/result_unbound
expect:
  status: failure
  result: {error: {name: ExecutionErr, message: "Error during isolated evaluation of expression `result`:\nReferenceError: result is not defined"}}
  steps:
    "m:a":
      status: failure
      args: {}
      result: {error: {name: ExecutionErr, message: "Error during isolated evaluation of expression `result`:\nReferenceError: result is not defined"}}
