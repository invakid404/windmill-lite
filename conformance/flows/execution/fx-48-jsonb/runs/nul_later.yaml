# FX-48/c: the same transform on a second step: CE 1.862.0 removes the NUL
# when a's job is pushed, so a receives and returns "" and the flow
# succeeds.
spec: [FX-48/c]
target: f/wl_fx51/nul_later
expect:
  status: success
  result: ""
  steps:
    "m:x": {status: success, result: 1}
    "m:a": {status: success, args: {s: ""}, result: ""}
