# FX-51/c: a $jsonvar: text holding an unpaired surrogate escape fails the
# step before its script runs, with the execution envelope and serde's
# position.
spec: [FX-51/c]
target: f/wl_fx51/jsonvar_surrogate
expect:
  status: failure
  result:
    error:
      name: ExecutionErr
      message: "execution error:\nInternal: Failed to parse $jsonvar value as JSON: unexpected end of hex escape at line 1 column 14<loc>"
      step_id: a
