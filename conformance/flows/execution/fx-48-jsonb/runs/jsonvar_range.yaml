# FX-51/c: a $jsonvar: number out of a double's range fails the same way, at
# column 11.
spec: [FX-51/c]
target: f/wl_fx51/jsonvar_range
expect:
  status: failure
  result:
    error:
      name: ExecutionErr
      message: "execution error:\nInternal: Failed to parse $jsonvar value as JSON: number out of range at line 1 column 11<loc>"
      step_id: a
