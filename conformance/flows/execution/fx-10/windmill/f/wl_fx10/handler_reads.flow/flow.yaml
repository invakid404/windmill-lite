summary: FX-10/a a failure module reads an error-stopped step three ways
value:
  modules:
    - id: a
      value:
        type: rawscript
        content: '!inline a.ts'
        language: bun
        input_transforms: {}
      stop_after_if:
        expr: 'true'
        skip_if_stopped: false
        error_message: E
  failure_module:
    id: failure
    value:
      type: rawscript
      content: '!inline failure.ts'
      language: bun
      input_transforms:
        p:
          type: javascript
          expr: results.a
        x:
          type: javascript
          expr: results.a.x
        k:
          type: javascript
          expr: Object.keys(results.a)
