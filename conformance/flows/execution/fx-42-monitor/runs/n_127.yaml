# FX-42/n on a sequential loop: the input nested 127 levels deep passes
# nesting past the backend's limit into the child flow's stored result, so
# the read of l's children fails, but no job is completed with that text:
# the flow stays running, neither b nor the failure module runs, and the
# zombie-flow monitor cancels it some 60 s or more later.
spec: [FX-42/n]
target: f/wl_fx42m/m_seq
args:
  k:
    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - []
expect:
  status: canceled
  result: {error: {name: Canceled}}
  steps: {"m:b": {status: not_run}, "s:failure": {status: not_run}}
