# FX-25, FX-27: a timed-out step is retried with the same arguments, and
# times out again.
spec: [FX-25, FX-27]
target: f/wl_fx25/retried
expect:
  status: failure
  result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: a}}
  steps:
    "m:a/r:0": {status: canceled, args: {ms: 3000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: a}}}
    "m:a": {status: canceled, args: {ms: 3000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: a}}}
