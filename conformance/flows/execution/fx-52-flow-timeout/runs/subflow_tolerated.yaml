# FX-52/g: the timed-out subflow step is tolerated (continue_on_error),
# and d receives the timeout error.
spec: [FX-52/g]
target: f/wl_fx52/subflow_tolerated
expect:
  status: success
  result: {error: {name: ExecutionErr, message: "flow terminated due to timeout: the flow exceeded its 1s timeout"}}
  steps:
    "m:c": {status: canceled, args: {}, result: {error: {name: Canceled, message: "Job canceled: the flow exceeded its 1s timeout by timeout", reason: "the flow exceeded its 1s timeout", canceler: timeout}}}
    "m:c/m:x": {status: canceled, args: {ms: 6000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to cancelled by timeout (reason: the flow exceeded its 1s timeout)", step_id: x}}}
    "m:d": {status: success, args: {x: {error: {name: ExecutionErr, message: "flow terminated due to timeout: the flow exceeded its 1s timeout"}}}, result: {error: {name: ExecutionErr, message: "flow terminated due to timeout: the flow exceeded its 1s timeout"}}}
