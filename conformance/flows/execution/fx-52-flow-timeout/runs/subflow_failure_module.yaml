# FX-52/h: the timed-out subflow runs its own failure module before its
# caller hears of it; the caller's step fails with the failure module's
# result.
spec: [FX-52/h]
target: f/wl_fx52/subflow_failure_module
expect:
  status: failure
  result: {n: ExecutionErr, m: "flow terminated due to timeout: the flow exceeded its 1s timeout"}
  steps:
    "m:c": {status: canceled, args: {}, result: {error: {name: Canceled, message: "Job canceled: the flow exceeded its 1s timeout by timeout", reason: "the flow exceeded its 1s timeout", canceler: timeout}}}
    "m:c/m:x": {status: canceled, args: {ms: 6000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to cancelled by timeout (reason: the flow exceeded its 1s timeout)", step_id: x}}}
    "m:c/s:failure":
      status: success
      args: {e: {name: ExecutionErr, message: "flow terminated due to timeout: the flow exceeded its 1s timeout"}}
      result: {n: ExecutionErr, m: "flow terminated due to timeout: the flow exceeded its 1s timeout"}
