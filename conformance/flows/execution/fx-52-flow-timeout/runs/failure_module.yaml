# FX-52/b: the failure module runs after the flow's timeout, with the
# timeout error, and the flow still ends canceled with the canceled value.
spec: [FX-52/b]
target: f/wl_fx52/failure_module
expect:
  status: canceled
  result: {error: {name: Canceled, message: "Job canceled: the flow exceeded its 1s timeout by timeout", reason: "the flow exceeded its 1s timeout", canceler: timeout}}
  steps:
    "m:a": {status: canceled, args: {ms: 6000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to cancelled by timeout (reason: the flow exceeded its 1s timeout)", step_id: a}}}
    "s:failure":
      status: success
      args: {e: {name: ExecutionErr, message: "flow terminated due to timeout: the flow exceeded its 1s timeout"}}
      result: {n: ExecutionErr, m: "flow terminated due to timeout: the flow exceeded its 1s timeout"}
