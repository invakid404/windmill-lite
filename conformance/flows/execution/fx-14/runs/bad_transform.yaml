# FX-14/a: the job runs with empty args and fails with the pre-run
# error, without step_id. The catalogue asserts the message prefix
# only; the recording holds the full engine text.
spec: [FX-14/a]
target: f/wl_fx14/bad_transform
expect:
  status: failure
  result: {error: {name: ExecutionErr, message: "Error during isolated evaluation of expression `flow_input.a.b.c`:\nTypeError: cannot read property 'b' of undefined"}}
  steps:
    "m:a":
      status: failure
      args: {}
      result: {error: {name: ExecutionErr, message: "Error during isolated evaluation of expression `flow_input.a.b.c`:\nTypeError: cannot read property 'b' of undefined"}}
