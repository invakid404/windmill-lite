summary: FX-19/e a tolerated error-stop advances to the next step
value:
  modules:
    - id: a
      value:
        type: script
        input_transforms: {}
        path: f/wl_fx19/three
      continue_on_error: true
      stop_after_if:
        error_message: E
        expr: 'true'
        skip_if_stopped: false
    - id: b
      value:
        type: script
        input_transforms: {}
        path: f/wl_fx19/four
  failure_module:
    id: failure
    value:
      type: script
      input_transforms: {}
      path: f/wl_fx19/handler
