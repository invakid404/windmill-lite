summary: FX-19/e a tolerated error-stop advances to the next step
value:
  modules:
    - id: a
      value:
        type: script
        path: f/wl_fx19/three
        input_transforms: {}
      stop_after_if:
        expr: 'true'
        skip_if_stopped: false
        error_message: E
      continue_on_error: true
    - id: b
      value:
        type: script
        path: f/wl_fx19/four
        input_transforms: {}
  failure_module:
    id: failure
    value:
      type: script
      path: f/wl_fx19/handler
      input_transforms: {}
