summary: FX-19/d an error-stop is retried before the handler
value:
  modules:
    - id: a
      value:
        type: script
        path: f/wl_fx19/three
        input_transforms: {}
      stop_after_if:
        expr: 'true'
        skip_if_stopped: false
        error_message: E
      retry:
        constant:
          attempts: 1
          seconds: 0
  failure_module:
    id: failure
    value:
      type: script
      path: f/wl_fx19/handler
      input_transforms: {}
