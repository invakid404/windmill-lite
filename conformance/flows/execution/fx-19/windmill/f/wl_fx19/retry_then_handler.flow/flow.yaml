summary: FX-19/d an error-stop is retried before the handler
value:
  modules:
    - id: a
      value:
        type: script
        input_transforms: {}
        path: f/wl_fx19/three
      retry:
        constant:
          attempts: 1
          seconds: 0
      stop_after_if:
        error_message: E
        expr: 'true'
        skip_if_stopped: false
  failure_module:
    id: failure
    value:
      type: script
      input_transforms: {}
      path: f/wl_fx19/handler
