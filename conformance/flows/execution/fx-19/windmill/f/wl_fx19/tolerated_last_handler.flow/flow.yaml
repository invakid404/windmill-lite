summary: FX-19/i a tolerated error-stop at the final module enters the handler
value:
  modules:
    - id: a
      value:
        type: script
        input_transforms: {}
        path: f/wl_fx19/three
      continue_on_error: true
      stop_after_if:
        error_message: E
        expr: 'true'
        skip_if_stopped: false
  failure_module:
    id: failure
    value:
      type: script
      input_transforms: {}
      path: f/wl_fx19/handler
