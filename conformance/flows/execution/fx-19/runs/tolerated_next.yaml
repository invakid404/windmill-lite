# FX-19/e: continue_on_error with a failure module: the cursor advances, b
# runs, and the handler is not reached for this stop.
spec: [FX-19/e]
target: f/wl_fx19/tolerated_next
expect:
  status: success
  result: 4
  steps:
    "m:a":
      status: success
      module: failure
      args: {}
      result: 3
      # FX-2 completion step 4: the error stop replaces the value a
      # carries on with the EarlyStopError; the oracle exposes no carried
      # value, so the recording cannot show it.
      carried: {error: {name: EarlyStopError, message: E}}
    "m:b": {status: success, args: {}, result: 4}
    "s:failure": {status: not_run}
