# FX-19/i: continue_on_error at the final module with a failure module: the
# cursor reaches len and the handler runs once (FX-V4); the flow fails with
# its result.
spec: [FX-19/i, FX-V4]
target: f/wl_fx19/tolerated_last_handler
expect:
  status: failure
  result: H
  steps:
    "m:a":
      status: success
      module: failure
      args: {}
      result: 3
      # FX-2 completion step 4: the error stop replaces the value a
      # carries on with the EarlyStopError; the oracle exposes no carried
      # value, so the recording cannot show it.
      carried: {error: {name: EarlyStopError, message: E}}
    "s:failure": {status: success, args: {}, result: H}
