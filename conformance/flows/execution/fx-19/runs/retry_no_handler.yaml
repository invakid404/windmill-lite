# FX-19/h: without a failure module the continue decision stops first, so
# the configured retry is not used: a runs once.
spec: [FX-19/h]
target: f/wl_fx19/retry_no_handler
expect:
  status: failure
  result: {error: {name: EarlyStopError, message: E}}
  steps:
    "m:a":
      status: success
      module: failure
      args: {}
      result: 3
      # FX-2 completion step 4: the error stop replaces the value a
      # carries on with the EarlyStopError, the flow's result; the oracle
      # exposes no carried value, so the recording cannot show it.
      carried: {error: {name: EarlyStopError, message: E}}
