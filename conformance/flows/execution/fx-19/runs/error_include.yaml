# FX-19/b: an error-stop with error_include_result: the module fails with
# an EarlyStopError holding the stopping result, while a's stored job
# result stays the success value 3 (FX-V2).
spec: [FX-19/b, FX-V2]
target: f/wl_fx19/error_include
expect:
  status: failure
  result: {error: {name: EarlyStopError, message: too big, result: 3}}
  steps:
    "m:a":
      status: success
      module: failure
      args: {}
      result: 3
      # FX-2 completion step 4: the error stop replaces the value a
      # carries on with the EarlyStopError, the flow's result; the oracle
      # exposes no carried value, so the recording cannot show it.
      carried: {error: {name: EarlyStopError, message: too big, result: 3}}
