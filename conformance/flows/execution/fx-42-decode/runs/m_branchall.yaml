# FX-42/m on a branchall whose one branch is an identity: the child flow's
# stored result holds a number beyond a double, so the read of l's children
# fails, but no job is completed with that text: the flow stays running,
# neither b nor the failure module runs, and the zombie-flow monitor cancels
# it some 60 s or more later (its reason's start is checked in the batch
# manifest).
spec: [FX-42/m]
target: f/wl_fx42d/m_branchall
args: {"n": 1e400}
expect:
  status: canceled
  result: {error: {name: Canceled}}
  steps: {"m:b": {status: not_run}, "s:failure": {status: not_run}}
