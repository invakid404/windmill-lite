# FX-42/n: the input nested 127 levels deep passes nesting past the
# backend's limit into the child flow's stored result, so the flow waits for
# the monitor as in FX-42/m.
spec: [FX-42/n]
target: f/wl_fx42d/m_seq
args:
  k:
    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - []
expect:
  status: canceled
  result: {error: {name: Canceled}}
  steps: {"m:b": {status: not_run}, "s:failure": {status: not_run}}
