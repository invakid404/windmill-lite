# FX-40/d (contested, Q-FX-17): a rawscript body with an explicit common
# path. Recorded: reading (b), the default of ADR 0001 section 6; the
# iterations share an entry, so iteration 1 returns iteration 0's result.
spec: [FX-40/d, Q-FX-17]
target: f/fx40/d_raw_path
expect:
  status: success
  result: ["<job:m:l/i:0/m:b>", "<job:m:l/i:0/m:b>"]
  steps:
    "m:l":
      status: success
      result: ["<job:m:l/i:0/m:b>", "<job:m:l/i:0/m:b>"]
    "m:l/i:0/m:b":
      status: success
      args: {v: "<job:>"}
      result: "<job:m:l/i:0/m:b>"
    "m:l/i:1/m:b":
      status: success
      args: {v: "<job:>"}
      result: "<job:m:l/i:0/m:b>"
    "m:n": {status: success, args: {}, result: "<job:>"}
