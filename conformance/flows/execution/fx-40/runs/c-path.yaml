# FX-40/c, by-path body whose script has no cache_ttl: the loop module's
# TTL is dropped, so the second call runs the script again.
spec: [FX-40/c, Q-FX-5]
target: f/fx40/c_path_twice
expect:
  status: success
  result: ["<job:m:s2/m:l/i:0/m:b>"]
  steps:
    "m:n": {status: success, args: {}, result: "<job:>"}
    "m:s1":
      status: success
      args: {v: "<job:>"}
      result: ["<job:m:s1/m:l/i:0/m:b>"]
    "m:s1/m:l": {status: success, result: ["<job:m:s1/m:l/i:0/m:b>"]}
    "m:s1/m:l/i:0/m:b":
      status: success
      args: {v: "<job:>"}
      result: "<job:m:s1/m:l/i:0/m:b>"
    "m:s2":
      status: success
      args: {v: "<job:>"}
      result: ["<job:m:s2/m:l/i:0/m:b>"]
    "m:s2/m:l": {status: success, result: ["<job:m:s2/m:l/i:0/m:b>"]}
    "m:s2/m:l/i:0/m:b":
      status: success
      args: {v: "<job:>"}
      result: "<job:m:s2/m:l/i:0/m:b>"
