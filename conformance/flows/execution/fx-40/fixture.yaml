# Recording batch E3d (ADR 0012): FX-40, cache_ttl.
# Synthetic flows written for this repository from
# docs/semantics/conformance.md#fx-40.
#
# Every cache key here includes a nonce: step n returns WM_ROOT_JOB_ID, which
# the normaliser writes <job:>, and the cached call takes it as an argument.
# So each run starts with an empty cache, and the repeated runs of the oracle
# workflow observe the same thing. A cache hit is visible as a result naming
# another job: every cached script returns its own WM_JOB_ID, which the
# normaliser writes as that job's site.
id: execution/fx-40
spec:
  - FX-40
  - FX-40/a
  - FX-40/b
  - FX-40/c
  - FX-40/d
  - Q-FX-17
  - Q-FX-6
  - Q-FX-5
scope: later
provenance: disputed
languages: [bun]
oracle: {workers: 1}
compare: {mode: subset}
note: "FX-40 is DISPUTED (Q-FX-17): the d runs discriminate. \"Run twice\" in the catalogue is done inside one run, by calling the cached flow twice, so that the oracle's repeated runs stay comparable."
