note: >-
  Corrected after recording. The prediction had serde_json's error alone;
  oracle run 40828218479 recorded it inside the evaluation's error, "Error
  parsing result as serde_json::value::Value: … Value was: nope", in the
  ExecutionErr debug form of a failed sleep evaluation.
