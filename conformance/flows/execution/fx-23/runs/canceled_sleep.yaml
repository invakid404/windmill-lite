# FX-23, FX-38: canceled 3 s after submission while b's job waits out a's
# 60 s sleep: the queued job is made due and fails without running, with
# the Canceled error, and the flow ends canceled. The job is a failure,
# not a canceled job: its canceled flag stays unset.
spec: [FX-23, FX-38]
target: f/wl_fx23/canceled_sleep
cancel_after_ms: 3000
expect:
  status: canceled
  result: {error: {message: "Job canceled: wltest: cancel_after_ms by admin", name: Canceled, reason: "wltest: cancel_after_ms", canceler: admin}}
  steps:
    "m:a": {status: success, args: {x: 1}, result: 1}
    "m:b": {status: failure, args: {x: 2}, result: {error: {message: "Job canceled: wltest: cancel_after_ms by admin", name: Canceled, reason: "wltest: cancel_after_ms", canceler: admin}}}
note: >-
  Corrected after recording. The prediction had b's status canceled, as for
  a running step that a cancellation kills (FX-38/a); oracle run
  40818457347 recorded failure, with the predicted Canceled error.
