# FX-23, FX-38: canceled 3 s after submission while b's job waits out a's
# 60 s sleep: the queued job is made due and fails without running, with
# the Canceled error, and the flow ends canceled.
spec: [FX-23, FX-38]
target: f/wl_fx23/canceled_sleep
cancel_after_ms: 3000
expect:
  status: canceled
  result: {error: {message: "Job canceled: wltest: cancel_after_ms by admin", name: Canceled, reason: "wltest: cancel_after_ms", canceler: admin}}
  steps:
    "m:a": {status: success, args: {x: 1}, result: 1}
    "m:b": {status: canceled, args: {x: 2}, result: {error: {message: "Job canceled: wltest: cancel_after_ms by admin", name: Canceled, reason: "wltest: cancel_after_ms", canceler: admin}}}
