# JE-29: a failed evaluation quotes the expression and the evaluator's
# text, bare at a later transition.
spec: [JE-29, FX-15]
target: f/wl_fx24/js_error
expect:
  status: failure
  result: {error: {name: InternalError, message: "Error during evaluation of expression `nope`:\nQuickJS evaluation error: Error: nope is not defined\n    at <anonymous> (eval_script:1:1)\n    at <eval> (eval_script:1:33)\n"}}
  steps:
    "m:x": {status: success, args: {x: 1}, result: 1}
    "m:a": {status: not_run}
