# FX-24: a zero timeout is strictly below the maximum, so it is used as it
# is, job-specific, and leaves the step no time at all.
spec: [FX-24, FX-25]
target: f/wl_fx24/zero
expect:
  status: failure
  result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout after exceeding job-specific duration limit", step_id: a}}
  steps:
    "m:a": {status: failure, args: {x: 1}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout after exceeding job-specific duration limit", step_id: a}}}
