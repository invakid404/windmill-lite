# FX-24 path 4, OF-16: a flow's metadata timeout (beside value) is stored
# with the flow but reaches no run, so nothing enforces it: the 3 s step
# outlives the flow's 1 s and the flow succeeds. (The enforced limit is
# value.timeout, FX-52.)
spec: [FX-24, OF-16]
target: f/wl_fx24/flow_timeout
expect:
  status: success
  result: 3000
  steps:
    "m:a": {status: success, args: {ms: 3000}, result: 3000}
