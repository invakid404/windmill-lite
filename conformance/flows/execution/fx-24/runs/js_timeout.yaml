# FX-24, JE-29: the same with a javascript timeout, evaluated when the
# step's job is pushed.
spec: [FX-24, FX-25, JE-29]
target: f/wl_fx24/js_timeout
expect:
  status: failure
  result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout after exceeding job-specific duration limit", step_id: a}}
  steps:
    "m:a": {status: failure, args: {ms: 3000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout after exceeding job-specific duration limit", step_id: a}}}
