# FX-30: a's status is Failure but the cursor advances; b sees the
# wrapped error as previous_result and as results.a.
spec: [FX-30]
target: f/wl_fx30/tolerated_middle
expect:
  status: success
  result:
    p: {error: {message: x, name: Error, stack: "<stack>", step_id: a, job_id: "<job:m:a>", flow_path: f/wl_fx30/tolerated_middle}}
    r: {error: {message: x, name: Error, stack: "<stack>", step_id: a, job_id: "<job:m:a>", flow_path: f/wl_fx30/tolerated_middle}}
  steps:
    "m:a":
      status: failure
      args: {}
      result: {error: {message: x, name: Error, stack: "<stack>", step_id: a, job_id: "<job:m:a>", flow_path: f/wl_fx30/tolerated_middle}}
    "m:b":
      status: success
      args:
        p: {error: {message: x, name: Error, stack: "<stack>", step_id: a, job_id: "<job:m:a>", flow_path: f/wl_fx30/tolerated_middle}}
        r: {error: {message: x, name: Error, stack: "<stack>", step_id: a, job_id: "<job:m:a>", flow_path: f/wl_fx30/tolerated_middle}}
      result:
        p: {error: {message: x, name: Error, stack: "<stack>", step_id: a, job_id: "<job:m:a>", flow_path: f/wl_fx30/tolerated_middle}}
        r: {error: {message: x, name: Error, stack: "<stack>", step_id: a, job_id: "<job:m:a>", flow_path: f/wl_fx30/tolerated_middle}}
