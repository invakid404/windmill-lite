# FX-34/a: iteration 0 fails and its copy of the failure module runs
# there (as failure-0-0), giving "F"; iteration 1 returns 2. The loop
# tolerates the failed iteration, so the flow succeeds with ["F", 2].
spec: [FX-34/a]
target: f/wl_fx34/loop
expect:
  status: success
  result: [F, 2]
  steps:
    "m:l": {status: success, result: [F, 2]}
    "m:l/i:0/m:x":
      status: failure
      args: {v: 1}
      result: {error: {message: one, name: Error, stack: "<stack>", step_id: x}}
    "m:l/i:0/s:failure": {status: success, args: {}, result: F}
    "m:l/i:1/m:x": {status: success, args: {v: 2}, result: 2}
    "m:l/i:1/s:failure": {status: not_run}
    "s:failure": {status: not_run}
