# FX-42/h, Q-FX-16: the stored argument is the reference string; the
# arguments file holds the resolved value. The expectation is reading (b),
# the ADR 0001 section 6 default: insertion order kept, numbers and strings
# re-serialised from parsed values (1e3 as 1000.0, 1e21 as 1e21, the 64-bit
# integer exact, the larger one as a double, 1.50e3 as 1500.0, the escapes
# decoded, no spaces). Reading (a) would keep the variable's text.
spec: [FX-42/h, WR-5]
target: f/wl_fx42/args_file
expect:
  status: success
  result: '{"v":{"zz":1000.0,"b":1e21,"aaa":12345678901234567891,"big":1.2345678901234568e29,"n":1500.0,"s":"A/"}}'
  steps:
    "m:a":
      status: success
      args: {v: "$jsonvar:f/wl_fx42/numbers"}
      result: '{"v":{"zz":1000.0,"b":1e21,"aaa":12345678901234567891,"big":1.2345678901234568e29,"n":1500.0,"s":"A/"}}'
