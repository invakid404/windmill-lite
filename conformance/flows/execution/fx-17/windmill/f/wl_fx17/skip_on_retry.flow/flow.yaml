summary: FX-17/b a module skipped only on its retry returns {}
value:
  modules:
    - id: reset
      value:
        type: rawscript
        content: '!inline reset.ts'
        input_transforms: {}
        lock: '!inline reset.lock'
        language: bun
    - id: a
      value:
        type: rawscript
        content: '!inline a.ts'
        input_transforms:
          x:
            type: static
            value: 1
        lock: '!inline a.lock'
        language: bun
      retry:
        constant:
          attempts: 1
          seconds: 0
      skip_if:
        expr: variable('f/wl_fx17/flag') === 'skip'
