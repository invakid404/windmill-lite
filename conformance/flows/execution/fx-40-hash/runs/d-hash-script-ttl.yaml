# FX-40/d, the TTL matrix for a hash-pinned script: the script's own cache_ttl
# is dropped, and the loop has none, so nothing is cached and iteration 1
# runs.
spec: [FX-40/d]
target: f/fx40h/d_hash_script_ttl
expect:
  status: success
  result: ["<job:m:l/i:0/m:b>", "<job:m:l/i:1/m:b>"]
  steps:
    "m:l":
      status: success
      result: ["<job:m:l/i:0/m:b>", "<job:m:l/i:1/m:b>"]
    "m:l/i:0/m:b":
      status: success
      args: {v: "<job:>"}
      result: "<job:m:l/i:0/m:b>"
    "m:l/i:1/m:b":
      status: success
      args: {v: "<job:>"}
      result: "<job:m:l/i:1/m:b>"
    "m:n": {status: success, args: {}, result: "<job:>"}
