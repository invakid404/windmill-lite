# FX-26/a: 5 runs in all, with delays of 1, 1, 8 (2^3) and 16 (2^4) s;
# the flow fails with the 5th failure's error.
spec: [FX-26/a, FX-27]
target: f/wl_fx26/phases
expect:
  status: failure
  result: {error: {message: e, name: Error, stack: "<stack>", step_id: a}}
  steps:
    "m:a/r:0": {status: failure, args: {msg: e}, result: {error: {message: e, name: Error, stack: "<stack>", step_id: a}}}
    "m:a/r:1": {status: failure, args: {msg: e}, result: {error: {message: e, name: Error, stack: "<stack>", step_id: a}}}
    "m:a/r:2": {status: failure, args: {msg: e}, result: {error: {message: e, name: Error, stack: "<stack>", step_id: a}}}
    "m:a/r:3": {status: failure, args: {msg: e}, result: {error: {message: e, name: Error, stack: "<stack>", step_id: a}}}
    "m:a": {status: failure, args: {msg: e}, result: {error: {message: e, name: Error, stack: "<stack>", step_id: a}}}
delays:
  - {from: "m:a/r:0", to: "m:a/r:1", at_least_ms: 1000}
  - {from: "m:a/r:1", to: "m:a/r:2", at_least_ms: 1000}
  - {from: "m:a/r:2", to: "m:a/r:3", at_least_ms: 8000}
  - {from: "m:a/r:3", to: "m:a", at_least_ms: 16000}
