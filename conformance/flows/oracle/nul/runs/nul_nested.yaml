# Q-OR-6 (nested): a NUL in a nested value is removed like OR-27/a's
# top-level one, so the stored value is ["x"].
spec: [OR-27/b]
target: f/wl_probe/nul_nested
expect:
  status: success
  result: {"p": {"a": ["x"]}, "r": {"a": ["x"]}}
  steps:
    "m:a": {"status": "success", "args": {}, "result": {"a": ["x"]}}
    "m:b": {"status": "success", "args": {"p": {"a": ["x"]}, "r": {"a": ["x"]}}, "result": {"p": {"a": ["x"]}, "r": {"a": ["x"]}}}
