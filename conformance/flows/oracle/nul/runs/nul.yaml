# probe nul (OR-27/a, FX-48/a): CE 1.862.0 removes the NUL when a's result
# is stored, so a and the root succeed with "xy" and b receives and
# returns it.
spec: [OR-27/a, FX-48/a]
target: f/wl_probe/nul
expect:
  status: success
  result: {"p": "xy", "r": "xy"}
  steps:
    # windmill-lite's observation also holds the value a carries on in
    # memory, the producer's text with its NUL (FX-48 case 1), which the
    # oracle does not expose.
    "m:a": {"status": "success", "args": {}, "result": "xy", "carried": "x\u0000y"}
    "m:b": {"status": "success", "args": {"p": "xy", "r": "xy"}, "result": {"p": "xy", "r": "xy"}}
