# probe nul (OR-27/a, FX-48/a): CE 1.862.0 removes the NUL when a's result
# is stored, so a and the root succeed with "xy" and b receives and
# returns it.
spec: [OR-27/a, FX-48/a]
target: f/wl_probe/nul
expect:
  status: success
  result: {"p": "xy", "r": "xy"}
  steps:
    "m:a": {"status": "success", "args": {}, "result": "xy"}
    "m:b": {"status": "success", "args": {"p": "xy", "r": "xy"}, "result": {"p": "xy", "r": "xy"}}
