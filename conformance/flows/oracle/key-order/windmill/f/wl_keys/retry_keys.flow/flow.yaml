summary: "OR-24/c: a retry reads the predecessor from storage"
value:
  modules:
    - id: a
      value:
        type: rawscript
        language: bun
        content: '!inline a.ts'
        input_transforms: {}
    - id: b
      value:
        type: rawscript
        language: bun
        content: '!inline b.ts'
        input_transforms: {}
      retry:
        constant:
          attempts: 1
          seconds: 0
      skip_if:
        expr: "Object.keys(previous_result)[0] === 'bbb' ? false : (() => { throw new Error('keys ' + JSON.stringify(Object.keys(previous_result))) })()"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
