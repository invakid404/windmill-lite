# Recording batch E3e: the probe catalogue of docs/semantics/oracle.md,
# reconstructed as executable fixtures with every transform and its binding
# written out (Q-OR-16, OR-V9). The rows marked disputed recipe are rebuilt
# as OR-V9 says: loop_seq_multi binds flow_input.iter.value (OR-V9/a, and
# its literal bare iter variant, OR-V9/b), branchone spells flow_input.n
# (OR-V9/c), and loop_par binds v to flow_input.iter.value (OR-V9/d). The
# recordings and raw captures retain the synthetic tree and its normalised
# observations, which run 1 did not. Where the catalogue's recipe needs
# something the harness does not offer, the run says how it differs: the
# retry counter is a workspace variable, reset before every run, because
# the effect sink answers no count. nul, big_payload and the missing
# variable are fixtures of their own (oracle/nul, oracle/big-payload,
# oracle/seeded). Synthetic, written for this repository from
# docs/semantics/oracle.md#probe-catalogue.
id: oracle/probes
spec: [OR-15, OR-V9, OR-28, Q-OR-16]
scope: core
provenance: oracle-observed
languages: [bun]
oracle: {workers: 1, effects: true, setup: each_run}
compare:
  # key_order's transform sees flow_input's keys in a random order (OR-23/a),
  # and so do the arguments windmill-lite resolved for it, which only an
  # expect holds (E4b's follow-up).
  unordered: [/steps/m:a0/args/fi_keys, /steps/m:a0/result/fi_keys, /steps/m:a0/resolved_args/fi_keys]
  # env's values that change between runs or sessions: the workspace,
  # the object path (a timestamp and the job), the scheduled time and the
  # runnable id; and those the environment sets, which the harness masks
  # (OR-29, OR-14): the user the run is permissioned as (WM_EMAIL,
  # WM_USERNAME, WM_PERMISSIONED_AS) and the instance's URL (WM_BASE_URL),
  # host configuration on windmill-lite (ADR 0007). The value a step
  # carries on, which only an expect holds, is masked alike.
  mask:
    - /result/env/WM_WORKSPACE
    - /result/env/WM_OBJECT_PATH
    - /result/env/WM_SCHEDULED_FOR
    - /result/env/WM_RUNNABLE_ID
    - /result/env/WM_EMAIL
    - /result/env/WM_USERNAME
    - /result/env/WM_PERMISSIONED_AS
    - /result/env/WM_BASE_URL
    - /steps/m:a/result/env/WM_WORKSPACE
    - /steps/m:a/result/env/WM_OBJECT_PATH
    - /steps/m:a/result/env/WM_SCHEDULED_FOR
    - /steps/m:a/result/env/WM_RUNNABLE_ID
    - /steps/m:a/result/env/WM_EMAIL
    - /steps/m:a/result/env/WM_USERNAME
    - /steps/m:a/result/env/WM_PERMISSIONED_AS
    - /steps/m:a/result/env/WM_BASE_URL
    - /steps/m:a/carried/env/WM_WORKSPACE
    - /steps/m:a/carried/env/WM_OBJECT_PATH
    - /steps/m:a/carried/env/WM_SCHEDULED_FOR
    - /steps/m:a/carried/env/WM_RUNNABLE_ID
    - /steps/m:a/carried/env/WM_EMAIL
    - /steps/m:a/carried/env/WM_USERNAME
    - /steps/m:a/carried/env/WM_PERMISSIONED_AS
    - /steps/m:a/carried/env/WM_BASE_URL
