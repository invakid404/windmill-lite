# probe fail_handler (OR-12/b): the handler's plain result is the failed
# root's result; b does not run.
spec: [OR-12/b]
target: f/wl_probe/fail_handler
expect:
  status: failure
  result: {saw: boom, handled: true}
  steps:
    "m:a": {status: failure, args: {}, result: {error: {name: Error, message: boom, stack: "<stack>", step_id: a}}}
    "m:b": {status: not_run, ran: false}
    "s:failure":
      status: success
      args: {error: {name: Error, message: boom, stack: "<stack>", step_id: a}}
      result: {saw: boom, handled: true}
