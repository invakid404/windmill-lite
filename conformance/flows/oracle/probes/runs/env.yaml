# probe env (OR-29/a): the step's WM_ variables, the catalogue's subset
# among them, and whether WM_END_USER_EMAIL and WM_ROOT_WORKSPACE equal
# WM_EMAIL and WM_WORKSPACE. The expect is CE 1.862.0's observation: job
# ids are placeholders, and the workspace and the root workspace, the
# object path, the scheduled time, the runnable id, the run's user
# (WM_EMAIL, WM_USERNAME, WM_PERMISSIONED_AS, WM_END_USER_EMAIL) and the
# instance's URL are masked (fixture.yaml, OR-29). Bun's version is probe
# bun_version (OR-2/a, WR-3/a), which the comparison with windmill-lite,
# pinned to another Bun, cannot share with these variables.
spec: [OR-29/a]
target: f/wl_probe/env
expect:
  status: success
  result: {"env": {"WM_EMAIL": "<masked>", "WM_TOKEN": "<token>", "WM_JOB_ID": "<job:m:a>", "WM_BASE_URL": "<masked>", "WM_JOB_PATH": "f/wl_probe/env/a", "WM_USERNAME": "<masked>", "WM_FLOW_PATH": "f/wl_probe/env", "WM_WORKSPACE": "<masked>", "WM_STATE_PATH": "f/wl_probe/env/a_user", "WM_FLOW_JOB_ID": "<job:>", "WM_OBJECT_PATH": "<masked>", "WM_ROOT_JOB_ID": "<job:>", "WM_RUNNABLE_ID": "<masked>", "WM_FLOW_STEP_ID": "a", "WM_WORKER_GROUP": "default", "WM_SCHEDULED_FOR": "<masked>", "WM_SCHEDULE_PATH": "", "WM_END_USER_EMAIL": "<masked>", "WM_ROOT_WORKSPACE": "<masked>", "WM_PERMISSIONED_AS": "<masked>", "WM_TESTED_RUNNABLE": "", "WM_ROOT_FLOW_JOB_ID": "<job:>"}, "end_user_is_email": true, "root_workspace_is_workspace": true}
  steps:
    "m:a": {"status": "success", "args": {}, "result": {"env": {"WM_EMAIL": "<masked>", "WM_TOKEN": "<token>", "WM_JOB_ID": "<job:m:a>", "WM_BASE_URL": "<masked>", "WM_JOB_PATH": "f/wl_probe/env/a", "WM_USERNAME": "<masked>", "WM_FLOW_PATH": "f/wl_probe/env", "WM_WORKSPACE": "<masked>", "WM_STATE_PATH": "f/wl_probe/env/a_user", "WM_FLOW_JOB_ID": "<job:>", "WM_OBJECT_PATH": "<masked>", "WM_ROOT_JOB_ID": "<job:>", "WM_RUNNABLE_ID": "<masked>", "WM_FLOW_STEP_ID": "a", "WM_WORKER_GROUP": "default", "WM_SCHEDULED_FOR": "<masked>", "WM_SCHEDULE_PATH": "", "WM_END_USER_EMAIL": "<masked>", "WM_ROOT_WORKSPACE": "<masked>", "WM_PERMISSIONED_AS": "<masked>", "WM_TESTED_RUNNABLE": "", "WM_ROOT_FLOW_JOB_ID": "<job:>"}, "end_user_is_email": true, "root_workspace_is_workspace": true}}
