# OR-V9/b: the literal recipe's bare iter.value is no binding: x1's
# transform fails with "iter is not defined", the iteration fails and the
# loop and the flow fail with it, as the correction says.
spec: [OR-V9/b]
target: f/wl_probe/loop_seq_multi_bare
expect:
  status: failure
  result: [{"error": {"name": "ExecutionErr", "message": "Error during isolated evaluation of expression `iter.value`:\nQuickJS evaluation error: Error: iter is not defined\n    at <anonymous> (eval_script:1:1)\n    at <eval> (eval_script:1:39)\n"}}]
  steps:
    "m:l": {"status": "failure", "result": [{"error": {"name": "ExecutionErr", "message": "Error during isolated evaluation of expression `iter.value`:\nQuickJS evaluation error: Error: iter is not defined\n    at <anonymous> (eval_script:1:1)\n    at <eval> (eval_script:1:39)\n"}}]}
    "m:l/i:0/m:x1": {"status": "failure", "args": {}, "result": {"error": {"name": "ExecutionErr", "message": "Error during isolated evaluation of expression `iter.value`:\nQuickJS evaluation error: Error: iter is not defined\n    at <anonymous> (eval_script:1:1)\n    at <eval> (eval_script:1:39)\n"}}}
    "m:l/i:0/m:x2": {"status": "not_run", "ran": false}
