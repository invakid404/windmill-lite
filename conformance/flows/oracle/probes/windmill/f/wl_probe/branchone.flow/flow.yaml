summary: 'probe branchone (OR-V9/c): predicates on flow_input.n'
value:
  modules:
    - id: br
      value:
        type: branchone
        branches:
          - modules:
              - id: big
                value:
                  type: rawscript
                  content: '!inline big.ts'
                  input_transforms: {}
                  lock: '!inline big.lock'
                  language: bun
            expr: flow_input.n > 10
            parallel: true
            skip_failure: true
          - modules:
              - id: pos
                value:
                  type: rawscript
                  content: '!inline pos.ts'
                  input_transforms: {}
                  lock: '!inline pos.lock'
                  language: bun
            expr: flow_input.n > 0
            parallel: true
            skip_failure: true
        default:
          - id: def
            value:
              type: rawscript
              content: '!inline def.ts'
              input_transforms: {}
              lock: '!inline def.lock'
              language: bun
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    n:
      type: number
  required:
    - n
