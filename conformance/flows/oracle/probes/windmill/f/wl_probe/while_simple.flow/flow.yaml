summary: 'probe while_simple: a while loop whose body stops it'
value:
  modules:
    - id: w
      value:
        type: whileloopflow
        modules:
          - id: x
            value:
              type: rawscript
              content: '!inline x.ts'
              input_transforms:
                i:
                  type: javascript
                  expr: flow_input.iter.index
              lock: '!inline x.lock'
              language: bun
            stop_after_if:
              expr: result >= 2
              skip_if_stopped: false
        skip_failures: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
