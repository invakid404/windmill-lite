      value:
        type: rawscript
        language: bun
        content: '!inline a0.ts'
        input_transforms: {}
    - id: a
      value:
        type: rawscript
        language: bun
        content: '!inline a.ts'
        input_transforms: {}
      skip_if:
        expr: flow_input.skip
    - id: b
      value:
        type: rawscript
        language: bun
        content: '!inline b.ts'
        input_transforms: 
