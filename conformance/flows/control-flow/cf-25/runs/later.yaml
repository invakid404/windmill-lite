# CF-25/d: a squashed sequential loop on CE, after a first step: it
# succeeds with its unsquashed result (CF-25/a describes a build without
# the private feature, outside the reference configuration).
spec: [CF-25/d]
target: f/cf25/later
note: "Corrected after recording: the prediction, from CF-25, was the failure Squashing flow loops is not available in OSS."
expect:
  status: success
  result: [1]
  steps:
    "m:a": {status: success, args: {x: 1}, result: 1}
    "m:l": {status: success, result: [1]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:0/m:c": {status: success, args: {x: 1}, result: 1}
