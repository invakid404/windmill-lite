# CF-23/f's control: a false retry_if inside retry runs one branch job only,
# and the flow fails as CF-23/d (i).
spec: [CF-23/f]
target: f/wl_cf23r/f_control
expect:
  status: failure
  result: 1
  steps:
    "m:b":
      status: failure
      result:
        error:
          name: InternalError
          message: "Expected an array value in the iterator expression, found: invalid type: map, expected a sequence at line 1 column 0"
      branch_chosen: {type: default}
    "m:b/b:default/m:r": {status: success, args: {}, result: 1}
    "m:b/b:default/m:l": {status: not_run, ran: false}
