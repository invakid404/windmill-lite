# Q-CF-19: a whileloopflow stopped after its third iteration with a one-step
# Bun body, without squash (the control). The body keeps a module-scope
# counter and returns its pid, the counter and v; step i reads the
# iterations back, with each job's log, and says whether a runtime was
# reused (a pid repeated or a counter above 1) and whether a log line starts
# dedicated worker bun:. Unsquashed, every iteration has its own process.
spec: [CF-25]
target: f/wl_cf25r/while_one_plain
expect:
  status: success
  result:
    values: [0, 1, 2]
    runtime_reused: false
    dedicated_worker_log: false
