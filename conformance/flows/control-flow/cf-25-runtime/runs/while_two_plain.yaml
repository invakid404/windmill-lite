# Q-CF-19: a whileloopflow stopped after its third iteration with a two-step
# Bun body, without squash (the control). The body keeps a module-scope
# counter, logs its pid and returns the counter and v; step i reads the
# iterations back with each job's log and gives the counters, how many pids
# the logs name and how many are distinct (a runtime reused shows as a
# counter above 1 or a repeated pid), and whether a log line starts
# dedicated worker bun:. Unsquashed, every iteration has its own process.
spec: [CF-25, CF-25/e]
target: f/wl_cf25r/while_two_plain
expect:
  status: success
  result:
    values: [0, 1, 2]
    counters: [1, 1, 1, 1, 1, 1]
    pids_found: 6
    distinct_pids: 6
    dedicated_worker_log: false
