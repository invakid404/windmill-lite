# Recording batch E3f (ADR 0012): ai parallelism and squash on the CE image
# (Q-CF-19, CF-25, WR-55): sequential forloopflows and whileloopflows with
# squash, with a one-step and a two-step Bun body, beside the same four
# flows
# without squash, a squashed Bash body, and a squashed loop whose body
# leaves
# a background child. A last step reads the iterations back through the jobs
# API (counters, logs and times; the pids are in the logs), since a
# recording's provenance is
# never compared. Q-CF-19 has no prediction for the squashed loops, so their
# expects state the values only. The runs compare as a subset.
#
# Each run's expect is the reference's source-derived prediction, written
# before the oracle ran it. Synthetic, written for this repository from
# docs/semantics/control-flow.md#q-cf-19. Deployed with oracle.deploy api.
id: control-flow/cf-25-runtime
spec: [CF-25, WR-55/a]
scope: core
provenance: oracle-observed
languages: [bun, bash]
oracle: {workers: 1, deploy: api}
compare: {mode: subset}
