# CF-25/c: CE ignores squash where it starts no runners: a sequential loop
# module with a sleep never starts the runners, so the flag has no effect
# and the flow gives [1, 2].
spec: [CF-25/c]
target: f/wl_cf25c/sleep
expect:
  status: success
  result: [1, 2]
  steps:
    "m:l": {status: success, result: [1, 2]}
    "m:n": {status: success, result: [1, 2]}
