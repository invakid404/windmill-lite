summary: "CF-22 retry on a branchall"
value:
  modules:
    - id: ba
      value:
        type: branchall
        branches:
          - modules:
              - id: b0
                value:
                  type: script
                  input_transforms:
                    tag:
                      type: static
                      value: b0
                    v:
                      type: static
                      value: 0
                  path: f/cf22/flaky
            skip_failure: false
          - modules:
              - id: b1
                value:
                  type: script
                  input_transforms:
                    x:
                      type: static
                      value: 1
                  path: f/cf22/echo
            skip_failure: false
        parallel: true
      retry:
        constant:
          attempts: 1
          seconds: 0
schema:
  "$schema": "https://json-schema.org/draft/2020-12/schema"
  type: object
  properties: {}
  required: []
