# CF-13/a: a truthy predicate with skip_if_stopped stops the enclosing flow,
# which is marked skipped, not just the loop.
spec: [CF-13/a]
target: f/cf13/all_iters_skip
expect:
  status: skipped
  result: [1, 2]
  steps:
    "m:l": {status: success, skipped: true, result: [1, 2]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:1/m:b": {status: success, args: {x: 2}, result: 2}
    "m:n": {status: not_run, ran: false}
