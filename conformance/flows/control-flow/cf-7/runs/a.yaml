# CF-7/a: no fail-fast; every iteration runs and the full array is the
# failed result.
spec: [CF-7/a, FX-45/b]
target: f/cf7/parallelism_two
expect:
  status: failure
  result:
    - 1
    - error:
        name: Error
        stack: "<stack>"
        message: two
        step_id: b
        job_id: "<job:m:l/i:1/m:b>"
        flow_path: f/cf7/parallelism_two/forloop-1
    - 3
    - 4
  steps:
    "m:l":
      status: failure
      result:
        - 1
        - error:
            name: Error
            stack: "<stack>"
            message: two
            step_id: b
            job_id: "<job:m:l/i:1/m:b>"
            flow_path: f/cf7/parallelism_two/forloop-1
        - 3
        - 4
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:1/m:b":
      status: failure
      args: {x: 2}
      result:
        error:
          name: Error
          stack: "<stack>"
          message: two
          step_id: b
          job_id: "<job:m:l/i:1/m:b>"
          flow_path: f/cf7/parallelism_two/forloop-1
    "m:l/i:2/m:b": {status: success, args: {x: 3}, result: 3}
    "m:l/i:3/m:b": {status: success, args: {x: 4}, result: 4}
