# CF-7/b: parallelism 1 releases the iterations in index order. The start
# times are in the recording's provenance; TestCF7bReleaseOrder checks them.
spec: [CF-7/b]
target: f/cf7/parallelism_one
note: "With the one worker of the reference session, iterations cannot overlap whatever the release order, so only the order of the start times discriminates."
expect:
  status: failure
  result:
    - 1
    - error:
        name: Error
        stack: "<stack>"
        message: two
        step_id: b
    - 3
    - 4
  steps:
    "m:l":
      status: failure
      result:
        - 1
        - error:
            name: Error
            stack: "<stack>"
            message: two
            step_id: b
        - 3
        - 4
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:1/m:b":
      status: failure
      args: {x: 2}
      result:
        error:
          name: Error
          stack: "<stack>"
          message: two
          step_id: b
    "m:l/i:2/m:b": {status: success, args: {x: 3}, result: 3}
    "m:l/i:3/m:b": {status: success, args: {x: 4}, result: 4}
