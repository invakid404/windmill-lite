# CF-27/a: the collapsed body jobs are timed by the loop's timeout of 1 s;
# the first fails and the second never starts.
spec: [CF-27/a]
target: f/cf27/a
expect:
  status: failure
  result: [{error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout after exceeding job-specific duration limit", step_id: l}}]
  steps:
    "m:l": {status: failure, result: [{error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout after exceeding job-specific duration limit", step_id: l}}]}
    "m:l/i:0/m:b": {status: failure, args: {ms: 3000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout after exceeding job-specific duration limit", step_id: l}}}
