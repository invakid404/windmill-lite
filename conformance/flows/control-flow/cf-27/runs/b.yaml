# CF-27/b: with skip_failures both body jobs time out (each stored
# canceled) and the loop succeeds.
spec: [CF-27/b]
target: f/cf27/b
expect:
  status: success
  result: [{error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: l}}, {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: l}}]
  steps:
    "m:l": {status: success, result: [{error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: l}}, {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: l}}]}
    "m:l/i:0/m:b": {status: canceled, args: {ms: 3000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: l}}}
    "m:l/i:1/m:b": {status: canceled, args: {ms: 3000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: l}}}
