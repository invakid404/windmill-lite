summary: 'CF-11/a: all_iters and an ignored error message'
value:
  modules:
    - id: l
      value:
        type: forloopflow
        modules:
          - id: b
            value:
              type: rawscript
              content: '!inline b.ts'
              input_transforms:
                x:
                  type: javascript
                  expr: flow_input.iter.value
              lock: '!inline b.lock'
              language: bun
        iterator:
          type: static
          value:
            - 1
            - 2
            - 3
            - 4
        parallel: false
        skip_failures: false
      stop_after_if:
        error_message: x
        expr: all_iters.length >= 2
        skip_if_stopped: false
    - id: n
      value:
        type: rawscript
        content: '!inline n.ts'
        input_transforms:
          x:
            type: javascript
            expr: previous_result
        lock: '!inline n.lock'
        language: bun
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
