# CF-5/b: with skip_failures every iteration runs and the loop succeeds.
spec: [CF-5/b]
target: f/cf5/skip_all
expect:
  status: success
  result:
    - 0
    - 1
    - error:
        name: Error
        stack: "<stack>"
        message: two
        step_id: l
    - 3
  steps:
    "m:l":
      status: success
      result:
        - 0
        - 1
        - error:
            name: Error
            stack: "<stack>"
            message: two
            step_id: l
        - 3
    "m:l/i:0/m:b": {status: success, args: {x: 0}, result: 0}
    "m:l/i:1/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:2/m:b":
      status: failure
      args: {x: 2}
      result:
        error:
          name: Error
          stack: "<stack>"
          message: two
          step_id: l
    "m:l/i:3/m:b": {status: success, args: {x: 3}, result: 3}
