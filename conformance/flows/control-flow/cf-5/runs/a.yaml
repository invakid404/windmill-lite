# CF-5/a: a non-skippable failure stops the loop; the flow fails with the
# array so far as its result.
spec: [CF-5/a]
target: f/cf5/stop_at_failure
expect:
  status: failure
  result:
    - 0
    - 1
    - error:
        name: Error
        stack: "<stack>"
        message: two
        step_id: l
  steps:
    "m:l":
      status: failure
      result:
        - 0
        - 1
        - error:
            name: Error
            stack: "<stack>"
            message: two
            step_id: l
    "m:l/i:0/m:b": {status: success, args: {x: 0}, result: 0}
    "m:l/i:1/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:2/m:b":
      status: failure
      args: {x: 2}
      result:
        error:
          name: Error
          stack: "<stack>"
          message: two
          step_id: l
