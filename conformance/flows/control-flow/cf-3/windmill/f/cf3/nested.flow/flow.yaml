summary: "CF-3/a: nested loops"
value:
  modules:
    - id: outer
      value:
        type: forloopflow
        iterator: {type: static, value: [a, b]}
        skip_failures: false
        parallel: false
        modules:
          - id: inner
            value:
              type: forloopflow
              iterator: {type: static, value: [1, 2]}
              skip_failures: false
              parallel: false
              modules:
                - id: c
                  value:
                    type: rawscript
                    content: "!inline c.ts"
                    input_transforms:
                      x:
                        type: javascript
                        expr: "[flow_input.iter_parent.value, flow_input.iter.index]"
                    language: bun
schema:
  "$schema": "https://json-schema.org/draft/2020-12/schema"
  type: object
  properties: {}
  required: []
