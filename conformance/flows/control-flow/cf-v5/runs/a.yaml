# CF-V5/a: by path the loop collapses: each iteration is a script job of
# the flow, whose previous_result is the iteration before's result.
spec: [CF-V5/a]
target: f/wl_cfv5/collapsed
expect:
  status: success
  result: [101, 103, 106]
  steps:
    "m:a": {status: success, args: {}, result: 100}
    "m:l": {status: success, result: [101, 103, 106]}
    "m:l/i:0/m:b": {status: success, args: {x: 1, p: 100}, result: 101}
    "m:l/i:1/m:b": {status: success, args: {x: 2, p: 101}, result: 103}
    "m:l/i:2/m:b": {status: success, args: {x: 3, p: 103}, result: 106}
