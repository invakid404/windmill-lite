# CF-14/a: predicates are evaluated in order; the first truthy one wins and
# the third, which would throw, is never evaluated.
spec: [CF-14/a]
target: f/cf14/order
expect:
  status: success
  result: mid
  steps:
    "m:a": {status: success, args: {}, result: {"n": 5}}
    "m:br":
      status: success
      result: mid
      branch_chosen: {type: branch, branch: 1}
    "m:br/b:1/m:c2": {status: success, args: {}, result: mid}
