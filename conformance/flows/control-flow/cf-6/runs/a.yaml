# CF-6/a: a loop written without skip_failures behaves as skip_failures true
# on the deployed flow. The fixture was written without the field, but the
# oracle workflow's generate-metadata writes skip_failures: true (and
# parallel: false) into flow.yaml before the push, so the pushed value
# already carries the default (batches/e3d.json, parts).
spec: [CF-6/a]
target: f/cf6/absent_skip
expect:
  status: success
  result:
    - error:
        name: Error
        stack: "<stack>"
        message: one
        step_id: l
    - 2
  steps:
    "m:l":
      status: success
      result:
        - error:
            name: Error
            stack: "<stack>"
            message: one
            step_id: l
        - 2
    "m:l/i:0/m:b":
      status: failure
      args: {x: 1}
      result:
        error:
          name: Error
          stack: "<stack>"
          message: one
          step_id: l
    "m:l/i:1/m:b": {status: success, args: {x: 2}, result: 2}
