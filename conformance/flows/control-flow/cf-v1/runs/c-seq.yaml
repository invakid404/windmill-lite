# CF-V1/c, CF-16/c: a sequential branchall counts the recovered first
# branch as failed, as CF-V1/a's loop does, and on CE v1.862.0 the root
# flow that this failure ends succeeds with the branchall's array, as for
# CF-V1/a. The step error's job_id and flow_path are CE v1.862.0's error
# keys.
spec: [CF-V1/c, CF-16/c]
target: f/wl_cfv1/seq_branchall
expect:
  status: success
  result: [{recover: true}]
  steps:
    "m:ba": {status: failure, result: [{recover: true}]}
    "m:ba/b:0/m:x": {status: failure, args: {}, result: {error: {message: e, name: Error, stack: "<stack>", step_id: x, job_id: "<job:m:ba/b:0/m:x>", flow_path: f/wl_cfv1/seq_branchall/branchall-0}}}
    "m:ba/b:0/s:failure": {status: success, args: {}, result: {recover: true}}
    "s:failure": {status: not_run}
