# CF-21, FX-24: a collapsed loop's negative timeout is unset (at v1.767.0
# it failed the first body job's push at the root's pickup), so the body
# job runs with no custom timeout, under the instance default or maximum.
spec: [CF-21, FX-24, FX-15]
target: f/cfwaits/loop_timeout_negative_root
expect:
  status: success
  result: [1]
  steps:
    "m:l": {status: success, result: [1]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
