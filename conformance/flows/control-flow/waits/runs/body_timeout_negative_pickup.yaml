# FX-24: a negative timeout on the child flow's first module is unset (at
# v1.767.0 it failed the child at its pickup with an Anyhow error), so the
# child runs both modules and the loop completes.
spec: [FX-24, FX-15]
target: f/cfwaits/body_timeout_negative_pickup
expect:
  status: success
  result: [1]
  steps:
    "m:l": {status: success, result: [1]}
    "m:l/i:0/m:b": {status: success, args: {x: 2}, result: 2}
    "m:l/i:0/m:c": {status: success, args: {x: 1}, result: 1}
