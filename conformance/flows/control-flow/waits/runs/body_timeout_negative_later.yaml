# FX-24: a negative timeout on the child flow's second module is unset
# (at v1.767.0 it aborted the child with an InternalError), so b runs and
# the loop completes.
spec: [FX-24, FX-15]
target: f/cfwaits/body_timeout_negative_later
expect:
  status: success
  result: [2]
  steps:
    "m:l": {status: success, result: [2]}
    "m:l/i:0/m:x": {status: success, args: {x: 1}, result: 1}
    "m:l/i:0/m:b": {status: success, args: {x: 2}, result: 2}
