# CF-21, FX-24: a loop's timeout is evaluated for its child; a negative one
# is unset (at v1.767.0 it was a chaining error of the loop's flow), so the
# loop runs.
spec: [CF-21, FX-24, FX-15]
target: f/cfwaits/loop_timeout_negative_later
expect:
  status: success
  result: [2]
  steps:
    "m:a": {status: success, args: {x: 1}, result: 1}
    "m:l": {status: success, result: [2]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:0/m:c": {status: success, args: {x: 2}, result: 2}
