# CF-21, FX-24: a loop's timeout is evaluated for its child; a negative one
# is a chaining error of the loop's flow, here a later transition.
spec: [CF-21, FX-24, FX-15]
target: f/cfwaits/loop_timeout_negative_later
expect:
  status: failure
  result: {error: {name: InternalError, message: "Timeout value cannot be negative"}}
  steps:
    "m:a": {status: success, args: {x: 1}, result: 1}
    "m:l": {status: not_run, ran: false}
