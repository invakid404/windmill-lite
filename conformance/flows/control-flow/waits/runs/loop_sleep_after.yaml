# FX-23: a loop's own sleep, evaluated with its own result (the array, two
# entries: 2 s), delays the next module.
spec: [FX-23]
target: f/cfwaits/loop_sleep_after
delays:
  - {from: "m:l/i:1/m:b", to: "m:n", at_least_ms: 2000}
expect:
  status: success
  result: 3
  steps:
    "m:l": {status: success, result: [1, 2]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:1/m:b": {status: success, args: {x: 2}, result: 2}
    "m:n": {status: success, args: {x: 3}, result: 3}
