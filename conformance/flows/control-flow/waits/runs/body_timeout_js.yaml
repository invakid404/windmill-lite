# FX-24: a body module's javascript timeout times its job in the child flow.
spec: [FX-24, FX-25]
target: f/cfwaits/body_timeout_js
expect:
  status: failure
  result: [{error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: b}}]
  steps:
    "m:l": {status: failure, result: [{error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: b}}]}
    "m:l/i:0/m:b": {status: canceled, args: {ms: 3000}, result: {error: {name: ExecutionErr, message: "execution error:\njob process terminated due to timeout: `bun run` exceeded the 1s custom timeout set on the script or flow step", step_id: b}}}
    "m:l/i:0/m:c": {status: not_run}
