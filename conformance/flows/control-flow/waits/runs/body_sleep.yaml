# FX-23: b's sleep delays c's job inside the iteration's child flow.
spec: [FX-23]
target: f/cfwaits/body_sleep
delays:
  - {from: "m:l/i:0/m:b", to: "m:l/i:0/m:c", at_least_ms: 2000}
expect:
  status: success
  result: [2]
  steps:
    "m:l": {status: success, result: [2]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:0/m:c": {status: success, args: {x: 2}, result: 2}
