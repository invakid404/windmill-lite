summary: "N5 a retried subflow step with a constant 2 s delay"
value:
  modules:
    - id: a
      value:
        type: flow
        input_transforms:
          tag:
            type: javascript
            expr: "'delay'"
          fails:
            type: static
            value: 1
          v:
            type: javascript
            expr: "flow_input.v"
        path: f/cfsr/child
      retry:
        constant:
          attempts: 1
          seconds: 2
    - id: b
      value:
        type: script
        input_transforms:
          x:
            type: javascript
            expr: "results.a"
        path: f/cfsr/echo
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    v:
      type: ''
  required: []
