summary: N5 a retried subflow step whose input transform throws
value:
  modules:
    - id: a
      value:
        type: flow
        input_transforms:
          fails:
            type: static
            value: 0
          tag:
            type: javascript
            expr: "'pre_run'"
          v:
            type: javascript
            expr: flow_input.missing.x
        path: f/cfsr/child
      retry:
        constant:
          attempts: 1
          seconds: 0
    - id: b
      value:
        type: script
        input_transforms:
          x:
            type: javascript
            expr: results.a
        path: f/cfsr/echo
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
