summary: "N5 a retried while loop whose first iteration fails once"
value:
  modules:
    - id: w
      value:
        type: whileloopflow
        modules:
          - id: x
            value:
              type: script
              input_transforms:
                tag:
                  type: static
                  value: w
                fails:
                  type: static
                  value: 1
                v:
                  type: javascript
                  expr: "flow_input.iter.index"
              path: f/cfsr/flaky
        skip_failures: false
      stop_after_if:
        expr: 'true'
        skip_if_stopped: false
      retry:
        constant:
          attempts: 1
          seconds: 0
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
