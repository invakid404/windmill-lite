summary: N5 child flow whose flaky step has its own retry
value:
  modules:
    - id: x
      value:
        type: script
        input_transforms:
          fails:
            type: javascript
            expr: flow_input.fails
          tag:
            type: javascript
            expr: flow_input.tag
          v:
            type: javascript
            expr: flow_input.v
        path: f/cfsr/flaky
      retry:
        constant:
          attempts: 1
          seconds: 0
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    fails:
      type: number
    tag:
      type: string
    v:
      type: ''
  required: []
