summary: "N5 child flow: one flaky step"
value:
  modules:
    - id: x
      value:
        type: script
        input_transforms:
          tag:
            type: javascript
            expr: "flow_input.tag"
          fails:
            type: javascript
            expr: "flow_input.fails"
          v:
            type: javascript
            expr: "flow_input.v"
        path: f/cfsr/flaky
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    tag:
      type: string
    fails:
      type: number
    v:
      type: ''
  required: []
