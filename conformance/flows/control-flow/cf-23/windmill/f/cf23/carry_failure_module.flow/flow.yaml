summary: CF-23/e the failure module after a branchone's aborted branch
value:
  modules:
    - id: b
      value:
        type: branchone
        branches: []
        default:
          - id: r
            value:
              type: script
              input_transforms:
                x:
                  type: static
                  value: 1
              path: f/cf23/echo
          - id: l
            value:
              type: forloopflow
              modules:
                - id: x
                  value:
                    type: script
                    input_transforms:
                      x:
                        type: static
                        value: 1
                    path: f/cf23/echo
              iterator:
                type: javascript
                expr: '({o: 1})'
              parallel: false
              skip_failures: false
  failure_module:
    id: failure
    value:
      type: script
      input_transforms:
        x:
          type: javascript
          expr: '[previous_result, error]'
      path: f/cf23/echo
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
