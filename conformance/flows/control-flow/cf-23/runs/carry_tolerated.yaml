# CF-23/d (ii): with continue_on_error on b, c's previous_result is the
# carried 1, while d's results.b reads b from storage, the InternalError,
# which is the flow's successful result.
spec: [CF-23/d]
target: f/cf23/carry_tolerated
expect:
  status: success
  result: {error: {name: InternalError, message: "Expected an array value in the iterator expression, found: invalid type: map, expected a sequence at line 1 column 0"}}
  steps:
    "m:b": {status: failure, branch_chosen: {type: default}, result: {error: {name: InternalError, message: "Expected an array value in the iterator expression, found: invalid type: map, expected a sequence at line 1 column 0"}}, carried: 1}
    "m:b/b:default/m:r": {status: success, args: {x: 1}, result: 1}
    "m:b/b:default/m:l": {status: not_run, ran: false}
    "m:c": {status: success, args: {x: 1}, result: 1}
    "m:d": {status: success, args: {x: {error: {name: InternalError, message: "Expected an array value in the iterator expression, found: invalid type: map, expected a sequence at line 1 column 0"}}}, result: {error: {name: InternalError, message: "Expected an array value in the iterator expression, found: invalid type: map, expected a sequence at line 1 column 0"}}}
