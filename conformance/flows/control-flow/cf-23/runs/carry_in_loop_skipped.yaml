# CF-23 route 3 in a branchone inside a loop that skips failures: each
# iteration's branch aborts when s starts, r's sleep a string (FX-23/c), and the loop's entries are the
# branches' carried values, which n reads from storage.
spec: [CF-23, FX-23/c]
target: f/cf23/carry_in_loop_skipped
expect:
  status: success
  result: [1, 2]
  steps:
    "m:l": {status: success, result: [1, 2]}
    "m:l/i:0/m:b": {status: failure, branch_chosen: {type: default}, result: {error: {name: InternalError, message: "Expected an integer, found: String(\"1\")"}}, carried: 1}
    "m:l/i:0/m:b/b:default/m:r": {status: success, args: {x: 1}, result: 1}
    "m:l/i:0/m:b/b:default/m:s": {status: not_run, ran: false}
    "m:l/i:1/m:b": {status: failure, branch_chosen: {type: default}, result: {error: {name: InternalError, message: "Expected an integer, found: String(\"1\")"}}, carried: 2}
    "m:l/i:1/m:b/b:default/m:r": {status: success, args: {x: 2}, result: 2}
    "m:l/i:1/m:b/b:default/m:s": {status: not_run, ran: false}
    "m:n": {status: success, args: {x: [1, 2]}, result: [1, 2]}
