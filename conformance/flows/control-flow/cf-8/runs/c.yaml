# CF-8/c: a collapsed loop at step 0 gives every iteration the flow input
# without iter.
spec: [CF-8/c]
target: f/cf8/step_zero
args: {z: 1}
expect:
  status: success
  result: [{z: 1}, {z: 1}, {z: 1}]
  steps:
    "m:l":
      status: success
      result: [{z: 1}, {z: 1}, {z: 1}]
    "m:l/i:0/m:b":
      status: success
      args: {x: {z: 1}}
      result: {z: 1}
    "m:l/i:1/m:b":
      status: success
      args: {x: {z: 1}}
      result: {z: 1}
    "m:l/i:2/m:b":
      status: success
      args: {x: {z: 1}}
      result: {z: 1}
