# CF-15/b: a non-skippable failure fails the step with the full array.
spec: [CF-15/b]
target: f/cf15/parallel_fail
expect:
  status: failure
  result:
    - [1, 2]
    - error:
        name: Error
        stack: "<stack>"
        message: b
        step_id: b1
    - [1, 3]
  steps:
    "m:a": {status: success, args: {}, result: [1]}
    "m:ba":
      status: failure
      result:
        - [1, 2]
        - error:
            name: Error
            stack: "<stack>"
            message: b
            step_id: b1
        - [1, 3]
    "m:ba/b:0/m:b0": {status: success, args: {x: [1]}, result: [1, 2]}
    "m:ba/b:1/m:b1":
      status: failure
      args: {}
      result:
        error:
          name: Error
          stack: "<stack>"
          message: b
          step_id: b1
    "m:ba/b:2/m:b2": {status: success, args: {x: [1]}, result: [1, 3]}
