# CF-12/b: each iteration's copy of the flow handler consumes its error stop;
# the loop sees ordinary failed children and skip_failures lets it continue.
spec: [CF-12/b]
target: f/cf12/handled
expect:
  status: success
  result: [handled, handled]
  steps:
    "m:l": {status: success, result: [handled, handled]}
    "m:l/i:0/s:failure": {status: success, result: handled}
    "m:l/i:1/s:failure": {status: success, result: handled}
