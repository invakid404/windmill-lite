# CF-12/c, skip_failures true: the error stop breaks the loop, which
# succeeds, and the next step runs (agreed).
spec: [CF-12/c]
target: f/cf12/no_handler_skip
expect:
  status: success
  result: after
  steps:
    "m:l":
      status: success
      result: [{error: {name: EarlyStopError, message: halt}}]
    "m:l/i:0/m:b":
      status: success
      module: failure
      args: {x: 1}
      result: 1
      carried: {error: {name: EarlyStopError, message: halt}}
    "m:l/i:0/m:c": {status: not_run, ran: false}
    "m:n": {status: success, args: {}, result: after}
