# CF-12/d: a clean stop propagates through branchone: the flow stops right
# after it with its result, and n does not run.
spec: [CF-12/d]
target: f/cf12/branchone_stop
expect:
  status: success
  result: 2
  steps:
    "m:br":
      status: success
      result: 2
      branch_chosen: {type: default}
    "m:br/b:default/m:b": {status: success, args: {x: 2}, result: 2}
    "m:n": {status: not_run, ran: false}
