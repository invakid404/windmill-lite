# CF-4/a: a parallel loop gives its results in index order.
spec: [CF-4/a]
target: f/cf4/parallel_order
expect:
  status: success
  result: [30, 10, 20]
  steps:
    "m:l": {status: success, result: [30, 10, 20]}
    "m:l/i:0/m:b": {status: success, args: {x: 3}, result: 30}
    "m:l/i:1/m:b": {status: success, args: {x: 1}, result: 10}
    "m:l/i:2/m:b": {status: success, args: {x: 2}, result: 20}
