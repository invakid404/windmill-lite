# CF-4/b: a skipped failed iteration keeps its error object in the result.
spec: [CF-4/b]
target: f/cf4/parallel_skip
expect:
  status: success
  result:
    - 30
    - error:
        name: Error
        stack: "<stack>"
        message: boom
        step_id: b
        job_id: "<job:m:l/i:1/m:b>"
        flow_path: f/cf4/parallel_skip/forloop-1
    - 20
  steps:
    "m:l":
      status: success
      result:
        - 30
        - error:
            name: Error
            stack: "<stack>"
            message: boom
            step_id: b
            job_id: "<job:m:l/i:1/m:b>"
            flow_path: f/cf4/parallel_skip/forloop-1
        - 20
    "m:l/i:0/m:b": {status: success, args: {x: 3}, result: 30}
    "m:l/i:1/m:b":
      status: failure
      args: {x: 1}
      result:
        error:
          name: Error
          stack: "<stack>"
          message: boom
          step_id: b
          job_id: "<job:m:l/i:1/m:b>"
          flow_path: f/cf4/parallel_skip/forloop-1
    "m:l/i:2/m:b": {status: success, args: {x: 2}, result: 20}
