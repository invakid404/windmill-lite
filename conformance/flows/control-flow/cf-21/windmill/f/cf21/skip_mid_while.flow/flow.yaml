summary: "CF-21 skip_if mid-loop in a while loop"
value:
  modules:
    - id: a
      value:
        type: script
        input_transforms:
          x:
            type: static
            value: 0
        path: f/cf21/echo
    - id: l
      value:
        type: whileloopflow
        modules:
          - id: b
            value:
              type: script
              input_transforms:
                x:
                  type: javascript
                  expr: "flow_input.iter.index + 1"
              path: f/cf21/echo
        skip_failures: false
      skip_if:
        expr: "previous_result == 2"
      stop_after_if:
        expr: "result >= 5"
        skip_if_stopped: false
schema:
  "$schema": "https://json-schema.org/draft/2020-12/schema"
  type: object
  properties: {}
  required: []
