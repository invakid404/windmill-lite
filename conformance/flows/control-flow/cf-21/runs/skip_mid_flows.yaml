# CF-21/b (Q-CF-6): the same with a two-step body, so each iteration is a
# child flow; the skip_if is evaluated once, at the loop's entry, and every
# iteration runs (on CE v1.767.0 the skip_if before iteration 2 saw
# iteration 1's result and skipped the loop).
spec: [CF-21/b, Q-CF-6]
target: f/cf21/skip_mid_flows
expect:
  status: success
  result: [1, 2, 3]
  steps:
    "m:a": {status: success, args: {x: 0}, result: 0}
    "m:l": {status: success, result: [1, 2, 3]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:0/m:c": {status: success, args: {x: 1}, result: 1}
    "m:l/i:1/m:b": {status: success, args: {x: 2}, result: 2}
    "m:l/i:1/m:c": {status: success, args: {x: 2}, result: 2}
    "m:l/i:2/m:b": {status: success, args: {x: 3}, result: 3}
    "m:l/i:2/m:c": {status: success, args: {x: 3}, result: 3}
