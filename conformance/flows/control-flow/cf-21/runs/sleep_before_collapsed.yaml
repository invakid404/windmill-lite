# CF-21: the sleep of the step before a collapsed loop applies once, before its
# first child: iteration 0's first job starts at least 2 s after a's job
# ended. Whether the other iterations wait too is in the recording's
# provenance.
spec: [CF-21, FX-23]
target: f/cf21/sleep_before_collapsed
delays:
  - {from: "m:a", to: "m:l/i:0/m:b", at_least_ms: 2000}
expect:
  status: success
  result: [1, 2]
  steps:
    "m:a": {status: success, args: {x: 0}, result: 0}
    "m:l": {status: success, result: [1, 2]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:1/m:b": {status: success, args: {x: 2}, result: 2}
