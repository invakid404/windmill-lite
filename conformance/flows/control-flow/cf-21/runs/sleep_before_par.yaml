# CF-21/d: the sleep of the step before a parallel loop delays the loop's
# first push, which holds every child: both iterations' first jobs start
# at least 2 s after a's job ended.
spec: [CF-21/d, FX-23]
target: f/cf21/sleep_before_par
delays:
  - {from: "m:a", to: "m:l/i:0/m:b", at_least_ms: 2000}
  - {from: "m:a", to: "m:l/i:1/m:b", at_least_ms: 2000}
expect:
  status: success
  result: [1, 2]
  steps:
    "m:a": {status: success, args: {x: 0}, result: 0}
    "m:l": {status: success, result: [1, 2]}
    "m:l/i:0/m:b": {status: success, args: {x: 1}, result: 1}
    "m:l/i:1/m:b": {status: success, args: {x: 2}, result: 2}
    "m:l/i:0/m:c": {status: success, args: {x: 1}, result: 1}
    "m:l/i:1/m:c": {status: success, args: {x: 2}, result: 2}
