# Stub mode (ADR 0011) on a retried flow step (milestone N5): a flow step
# runs a subflow by path whose second step fails on the first attempt, so
# the caller's retry runs the subflow again. Each stubbed step is answered
# from the run's replay table, which addresses a subflow step at its site
# without the caller's attempt: the replay service counts its jobs across
# the attempts. Run skipped has a subflow step skipped on the first attempt
# and run on the second: its identity job never calls and takes no place in
# the step's count. Synthetic, written for this repository.
id: stub/subflow_retry
spec: [OR-11, CF-17, FX-17, FX-26, FX-27]
scope: core
provenance: oracle-observed
languages: [bun]
oracle: {workers: 1, effects: true}
stub: true
