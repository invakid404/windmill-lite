summary: wl stub reserve an order
value:
  modules:
    - id: hold
      value:
        type: rawscript
        content: '!inline hold.ts'
        input_transforms:
          order:
            type: javascript
            expr: flow_input.order
        lock: '!inline hold.lock'
        language: bun
    - id: check
      value:
        type: rawscript
        content: '!inline check.ts'
        input_transforms:
          held:
            type: javascript
            expr: results.hold
          order:
            type: javascript
            expr: flow_input.order
        lock: '!inline check.lock'
        language: bun
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    order:
      type: string
  required:
    - order
