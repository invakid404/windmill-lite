summary: wl stub codebase scripts
value:
  modules:
    - id: each
      value:
        type: forloopflow
        modules:
          - id: reserve
            value:
              type: script
              input_transforms:
                item:
                  type: javascript
                  expr: flow_input.iter.value
                qty:
                  type: javascript
                  expr: flow_input.qty
              path: f/wl_stub_cb/cjs/reserve
            retry:
              constant:
                attempts: 1
                seconds: 0
        iterator:
          type: javascript
          expr: flow_input.items
        parallel: false
        skip_failures: false
    - id: confirm
      value:
        type: script
        input_transforms:
          order:
            type: javascript
            expr: flow_input.order
          held:
            type: javascript
            expr: results.each
        path: f/wl_stub_cb/esm/confirm
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    order:
      type: string
    qty:
      type: number
    items:
      type: array
  required:
    - order
    - qty
    - items
