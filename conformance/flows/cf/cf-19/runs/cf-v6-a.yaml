# CF-V6/a (contested, Q-CF-16): the expression is results.a, a real
# newline, then + 100. CF-V6 reads 7 (line-anchored lookup); CF-19 as drafted
# reads 107 (whole-expression lookup). ADR 0001 section 6 defaults to 7.
spec: [CF-V6/a, CF-19, JE-9/g]
target: f/wl_cf19/cf_v6_a
claims:
  - at: /status
    equals: success
  - at: /steps/m:b/args/x
    equals: 7
  - at: /result
    equals: 7
unit:
  - spec: CF-V6/a
    site: m:b
    input: x
    expr: "results.a\n+ 100"
    context:
      previous_id: m
      previous_result: "0"
      results:
        a: "7"
    expect:
      text: "7"
    note: "the reading ADR 0001 section 6 takes by default (CF-V6): the first qualifying line answers"
