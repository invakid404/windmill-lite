spec: [CF-19/c]
target: f/wl_cf19/cf19_c
claims:
  - at: /status
    equals: failure
  - at: /steps/m:c/args/x
    equals: [42]
  - at: /steps/m:d/args/x
    equals: null
  - at: /steps/m:e/status
    equals: failure
  - at: /steps/m:e/result/error/message
    contains: ["Failed to fetch result for step 'br'"]
unit:
  - spec: CF-19/c
    site: m:c
    input: x
    expr: "[results.br]"
    context:
      previous_id: br
    expect:
      text: "[42]"
    note: "an engine read of the preceding id, served from memory (FX-10 reading (b)); after the branchone's empty default that is still a's 42, which the recording cannot show, since br ran no job, so previous_result is left out"
  - spec: CF-19/c
    site: m:d
    input: x
    expr: results.br
    context:
      previous_id: c
      previous_result: "[42]"
    expect:
      text: "null"
    note: "the direct lookup of br, which ran no job, answers null (JE-9)"
  - spec: CF-19/c
    site: m:e
    input: x
    expr: "[results.br]"
    context:
      previous_id: d
      previous_result: "null"
    expect:
      error:
        contains: ["Failed to fetch result for step 'br'"]
    note: "an engine read of br from storage fails; the exact text is later scope (Q-CF-5)"
