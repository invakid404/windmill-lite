spec: [CF-19/c]
target: f/wl_cf19/cf19_c
claims:
  - at: /status
    equals: failure
  - at: /steps/m:c/args/x
    equals: [42]
  - at: /steps/m:d/args/x
    equals: null
  - at: /steps/m:e/status
    equals: failure
  - at: /steps/m:e/result/error/message
    contains: ["Failed to fetch result for step 'br'"]
# CF-19/c's unit restatement is step d's direct lookup only. Step c's
# engine read of the preceding id is served from memory, where the empty
# default left a's 42 (FX-10 reading (b)); a unit case cannot state that
# previous_result, which no recorded step holds, since br ran no job. Step
# e's engine read fails to fetch br's result, which a unit context, whose
# results are the texts a read returns, cannot express. Both stay checked
# end to end by this run's claims.
unit:
  - spec: CF-19/c
    site: m:d
    input: x
    expr: results.br
    context:
      previous_id: c
      previous_result: "[42]"
    expect:
      text: "null"
    note: "the direct lookup of br, which ran no job, answers null (JE-9)"
