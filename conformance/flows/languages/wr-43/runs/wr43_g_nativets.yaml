# the stack stays a string.
spec: [WR-43/g]
target: f/wl_n43/wr43_g_nativets
expect:
  status: failure
  result: {error: {message: null, stack: "<stack>", name: null, step_id: a, job_id: "<job:m:a>", flow_path: f/wl_n43/wr43_g_nativets}}
  steps:
    "m:a":
      status: failure
      args: {}
      result: {error: {message: null, stack: "<stack>", name: null, step_id: a, job_id: "<job:m:a>", flow_path: f/wl_n43/wr43_g_nativets}}
