# FX-47/a: a thrown string has no name, message or stack; its own
# properties go to extra. The failed step's value is the flow's result
# (FX-36), and b never gets a job (OR-11).
spec: [FX-47/a, FX-36, OR-11]
target: f/wl_e1_wr/thrown
expect:
  status: failure
  result: {error: {step_id: a, extra: {"0": a, "1": b, length: 2}}}
  steps:
    "m:a":
      status: failure
      args: {}
      result: {error: {step_id: a, extra: {"0": a, "1": b, length: 2}}}
    "m:b": {status: not_run}
