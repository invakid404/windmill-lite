# Recording batch E3f (ADR 0012): leftover processes and process reuse
# (WR-55/a to WR-55/c; Q-WR-28). Job start and completion times, and the
# results of earlier jobs, are read back by a later step through the jobs
# API with the step's own token, since a recording's provenance, which holds
# the times, is never compared. The pids are masked. The runs compare as a
# subset.
#
# Each run's expect is the reference's source-derived prediction, written
# before the oracle ran it. Synthetic, written for this repository from
# docs/semantics/conformance.md#wr-55. Deployed with oracle.deploy api.
id: languages/wr-55-processes
spec: [WR-55/a, WR-55/b, WR-55/c]
scope: core
provenance: source-derived
languages: [bun]
oracle: {workers: 1, deploy: api}
compare:
  mode: subset
  mask: ["/steps/m:a/result/pid", "/steps/m:b/result/pid"]
