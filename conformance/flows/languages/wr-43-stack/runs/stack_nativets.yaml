# WR-43/c (nativets): the stack of a's error starts with a source line,
# then Error: x; a's continue_on_error passes the error on, and b's input
# takes the stack's first two lines, trimmed, as a value that the stack
# masking of a's own result does not reach. On CE v1.862.0 the first
# frame's line is mapped through the transpiler's source map, so it counts
# a's own lines (its last, 3), and the line read at that number from the
# preamble and code is the preamble's third, BASE_INTERNAL_URL's.
spec: [WR-43/c]
target: f/wl_n43s/stack_nativets
expect:
  status: success
  result: ["const BASE_INTERNAL_URL = 'http://localhost:8000';", "Error: x"]
  steps:
    "m:a": {status: failure}
    "m:b": {status: success, result: ["const BASE_INTERNAL_URL = 'http://localhost:8000';", "Error: x"]}
