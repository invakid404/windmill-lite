# WR-50/c: //native runs the ESM bundle in the native runtime, whose
# process has only env. On the CE oracle the job did not complete in its
# first recording session (two minutes), so the run is canceled after
# 20 s and records what CE does with it.
spec: [WR-50/c]
cancel_after_ms: 20000
target: f/wl_cbx/native
expect:
  status: success
  result: ["undefined", "undefined"]
  steps:
    "m:s": {status: success, args: {}, result: ["undefined", "undefined"]}
