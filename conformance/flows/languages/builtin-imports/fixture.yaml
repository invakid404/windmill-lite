# Built-in modules under shared code, on windmill-lite only. Two Bun
# scripts reach a dependency that imports node:async_hooks by import(), and
# two reach one that imports it statically. The runtime resolves a module
# it has built in to the same module from every file, so with shared code
# all four run their shared layout, from one closure, in warm and in host
# mode; fresh runs their per-script bundles. Each step makes an
# AsyncLocalStorage and reads its store inside run, so every step returns
# 1 in every mode. Which layout each script gets is the build's
# (conformance/build/d18.json, y-builtin-imports). Shared code is
# windmill-lite's own build, which the oracle does not have, so the fixture
# holds an expect written from ADR 0013, not a recording. Synthetic, written
# for this repository.
id: languages/builtin-imports
spec: [D18]
scope: core
provenance: policy
languages: [bun]
