summary: A step behind a semaphore wait (granted)
value:
  modules:
    - id: wait
      value:
        type: flow
        path: f/wl_provided/semaphore
        input_transforms:
          key:
            type: javascript
            expr: flow_input.key
      stop_after_if:
        expr: result.granted === false
        skip_if_stopped: false
    - id: work
      value:
        type: rawscript
        content: '!inline work.ts'
        input_transforms:
          ticket:
            type: javascript
            expr: results.wait.ticket
          key:
            type: javascript
            expr: flow_input.key
        lock: '!inline work.lock'
        language: bun
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    key:
      type: string
  required: [key]
