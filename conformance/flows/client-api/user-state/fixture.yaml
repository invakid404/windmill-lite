# Milestone PF3's fixture: flow user state (WA-14), recorded on the oracle
# and run by wltest check on windmill-lite, where the platform facade
# answers the steps' calls from the job registry and the engine answers
# the expression helper. Each step makes the calls that the stock client's
# setFlowUserState and getFlowUserState make, with fetch at BASE_URL and
# its own token: the root lookup (getRootJobId, WA-V1), then the state
# routes at that root. Step a sets two keys and reads them back, a missing
# key, and the routes at its own job, which is not a flow; the iterations
# of a parallel loop share the root's map (WA-14, sharing; WA-V1: a
# parallel body starts its own innermost scope, not its own root); step b
# reads a key an iteration set through the flow_user_state() helper
# (JE-20). Synthetic, written for this repository from
# docs/semantics/client-api.md and docs/semantics/conformance.md.
