# GET jobs_u/get/{id} (WA-19) on a job whose result or arguments are large.
# Windmill replaces a value whose stored column takes 90000 bytes or more
# (OR-V1), after PostgreSQL's compression. Run whole stays below that
# uncompressed, and windmill-lite answers it exactly; runs compressible and
# incompressible are above it uncompressed, where Windmill's answer depends
# on the compression, which windmill-lite does not reproduce: it answers
# 501, which fails the reading step with UnsupportedPlatformCall, and
# TestLargeValueJobRead checks that. Synthetic, written for this
# repository.
id: client-api/job-reads-large
spec: [WA-19/o, OR-V1]
scope: core
provenance: oracle-observed
languages: [bun]
oracle: {workers: 1}
