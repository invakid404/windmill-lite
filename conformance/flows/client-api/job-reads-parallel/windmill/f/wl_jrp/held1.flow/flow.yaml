summary: job reads, a parallel loop with a parallelism of 1 read by its first
  child while the second is held
value:
  modules:
    - id: l
      value:
        type: forloopflow
        modules:
          - id: s
            value:
              type: script
              input_transforms:
                k:
                  type: static
                  value: h1
                role:
                  type: javascript
                  expr: flow_input.iter.value
              path: f/wl_jrp/role
        iterator:
          type: javascript
          expr: '["readnow", "fast"]'
        parallel: true
        parallelism:
          type: static
          value: 1
        skip_failures: false
    - id: after
      value:
        type: script
        input_transforms: {}
        path: f/wl_jrp/read
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
