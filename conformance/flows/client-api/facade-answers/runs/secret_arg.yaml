# WA-11/c: a Bun step whose static $var: argument names a secret stored as
# ciphertext under another key fails before its script runs, with the
# not-found text followed by the read's body.
spec: [WA-11/c]
target: f/wl_fa/secret_arg
expect:
  status: failure
  result:
    error:
      name: ExecutionErr
      message: "execution error:\nNot found: Variable f/wl_fa/s2 not found for `x`: Internal: Error decrypting variable f/wl_fa/s2: Internal: Could not decrypt value. The value may have been encrypted with a different key.<loc><loc>"
      step_id: x
  steps: {"m:c": {status: success, result: 201}}
