# Recording batch E3f (ADR 0012): the facade's error answers (WA-14/d,
# WA-19/b, WA-19/c, WA-V2/c; Q-WA-13), secrets and job_id on the variable
# and
# resource routes (WA-11/c, WA-11/d, WA-12/g, WA-12/h), and the answers to
# variable writes (WA-11/e), each request made by a Bun step with its own
# token, as a black-box client of the API. Paths are under f/wl_fa/ in place
# of the catalogue's u/x/. The step deletes what it creates first, so the
# oracle's repeated runs compare. WA-12/h's non-admin half needs a second
# user, which the harness has none of. The runs compare as a subset.
#
# Each run's expect is the reference's source-derived prediction, written
# before the oracle ran it. Synthetic, written for this repository from
# docs/semantics/conformance.md#wa-11, #wa-12, #wa-14, #wa-19 and #wa-v2.
# Deployed with oracle.deploy api.
id: client-api/facade-answers
spec:
  - WA-11/c
  - WA-11/d
  - WA-11/e
  - WA-12/g
  - WA-12/h
  - WA-14/d
  - WA-19/b
  - WA-19/c
  - WA-V2/c
scope: later
provenance: oracle-observed
languages: [bun]
oracle: {workers: 1, deploy: api}
compare: {mode: subset}
