# Written from the reference before the oracle ran it (WA-13/a's counter, in
# a flow): the simple loop body's iterations share the state path
# <flow>/l_user (WA-5, WA-6/a), so the first reads a state never written
# (404, 0) and creates it, and each later one reads the count and updates
# it. Texts as predicted in the answers run.
spec: [WA-13/g]
target: f/wl_state/counter
expect:
  status: success
  result:
    - i: 1
      path: f/wl_state/counter/l_user
      read: 404
      "n": 0
      exists: false
      write: 201
      written: "resource f/wl_state/counter/l_user created"
    - i: 2
      path: f/wl_state/counter/l_user
      read: 200
      "n": 1
      exists: true
      write: 200
      written: "value of resource f/wl_state/counter/l_user updated"
    - i: 3
      path: f/wl_state/counter/l_user
      read: 200
      "n": 2
      exists: true
      write: 200
      written: "value of resource f/wl_state/counter/l_user updated"
  steps:
    "m:reset": {status: success, args: {}, result: f/wl_state/counter/l_user}
    "m:l":
      status: success
      result:
        - i: 1
          path: f/wl_state/counter/l_user
          read: 404
          "n": 0
          exists: false
          write: 201
          written: "resource f/wl_state/counter/l_user created"
        - i: 2
          path: f/wl_state/counter/l_user
          read: 200
          "n": 1
          exists: true
          write: 200
          written: "value of resource f/wl_state/counter/l_user updated"
        - i: 3
          path: f/wl_state/counter/l_user
          read: 200
          "n": 2
          exists: true
          write: 200
          written: "value of resource f/wl_state/counter/l_user updated"
    "m:l/i:0/m:x":
      status: success
      args: {i: 1}
      result:
        i: 1
        path: f/wl_state/counter/l_user
        read: 404
        "n": 0
        exists: false
        write: 201
        written: "resource f/wl_state/counter/l_user created"
    "m:l/i:1/m:x":
      status: success
      args: {i: 2}
      result:
        i: 2
        path: f/wl_state/counter/l_user
        read: 200
        "n": 1
        exists: true
        write: 200
        written: "value of resource f/wl_state/counter/l_user updated"
    "m:l/i:2/m:x":
      status: success
      args: {i: 3}
      result:
        i: 3
        path: f/wl_state/counter/l_user
        read: 200
        "n": 2
        exists: true
        write: 200
        written: "value of resource f/wl_state/counter/l_user updated"
