# never written reads 404 (WA-41); update_value's value is optional in the
# schema, so {} is predicted to store null.
#
# Recorded on the oracle, which confirmed the prediction for update_value
# with {} (200, value null) and corrected the rest: a create without a value
# creates the entry with the value null (201); a delete of a missing path
# answers 404 "Not found: Resource not found at name <path>" followed by a
# Rust location, which the step drops; the JSON reads are compact.
#
# Added before a second recording, and predicted: the value of setup.yaml's
# resource read after the conflicting create, which leaves it as it was; a
# create and an update_value sent as bytes with no Content-Type header (the
# step reports the header the request carried: none) and sent as text/plain,
# each answering 415 with the text of the rejection above. The Python
# client's probe, GET resources/get, moved to client-api/resource-writes.
