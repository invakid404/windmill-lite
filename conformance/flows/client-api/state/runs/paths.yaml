# Written from the reference before the oracle ran it: a resource path is
# u/<user>/... or f/<folder>/... with a name (WA-12); the folder's existence
# and the user are predicted not to be checked for a superadmin's token, and
# a path without a name or with another prefix to be refused with 400.
#
# Recorded on the oracle, which confirmed that neither the folder's
# existence nor the user of a u/ path is checked, and corrected the rest:
# g/<group>/ paths are accepted; a malformed path (another prefix, no name,
# a trailing slash, a dot or a space in a segment) is refused with 400 and
# the text below; a non-ASCII letter such as ü is accepted.
spec: [WA-13/j]
target: f/wl_state/paths
expect:
  status: success
  result:
    dot:
      read: {body: "Not found: Resource f/wl_state/a.b not found", type: text/plain, status: 404}
      exists: {body: "false", type: application/json, status: 200}
      created:
        body: "Bad request: Invalid path: it must be of the form u/<user>/<name>, f/<folder>/<name> or g/<group>/<name>, where every segment contains only alphanumeric characters, '_' or '-'"
        type: text/plain
        status: 400
      deleted: {body: "Not found: Resource not found at name f/wl_state/a.b", type: text/plain, status: 404}
    group:
      read: {body: "{\"k\":\"group\"}", type: application/json, status: 200}
      exists: {body: "true", type: application/json, status: 200}
