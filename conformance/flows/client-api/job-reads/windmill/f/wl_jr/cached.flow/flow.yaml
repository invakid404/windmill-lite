summary: job reads, a sub-flow answered from its cache
value:
  modules:
    - id: n
      value:
        type: rawscript
        content: '!inline n.ts'
        input_transforms: {}
        lock: '!inline n.lock'
        language: bun
    - id: warm
      value:
        type: flow
        input_transforms:
          fail:
            type: javascript
            expr: 'false'
          v:
            type: javascript
            expr: results.n
        path: f/wl_jr/sub
    - id: core
      value:
        type: flow
        input_transforms:
          fail:
            type: javascript
            expr: 'false'
          v:
            type: javascript
            expr: results.n
        path: f/wl_jr/sub
      continue_on_error: true
    - id: read
      value:
        type: script
        input_transforms: {}
        path: f/wl_jr/read
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
