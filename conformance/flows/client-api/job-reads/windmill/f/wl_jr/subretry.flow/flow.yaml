summary: job reads, a sub-flow retried after its first run failed
value:
  modules:
    - id: core
      value:
        type: flow
        input_transforms: {}
        path: f/wl_jr/flaky
      retry:
        constant:
          attempts: 1
          seconds: 0
    - id: read
      value:
        type: script
        input_transforms: {}
        path: f/wl_jr/read
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
