  result:
    path: f/wl_state_client/client/a_user
    set_create: {value: "<undefined>"}
    set_update: {value: "<undefined>"}
    get_created: {value: {"n": 1}}
    get_missing: {value: "<undefined>"}
    get_updated: {value: {"n": 2}}
    explicit_get: {value: {x: 1}}
    explicit_set: {value: "<undefined>"}
    get_internal: {value: {"n": 3}}
    set_internal: {value: "<undefined>"}
    set_undefined: {value: "<undefined>"}
    explicit_missing: {value: "<undefined>"}
    get_after_internal: {value: {"n": 3}}
    get_after_undefined: {value: null}
    set_undefined_missing: {value: "<undefined>"}
    get_after_undefined_missing: {value: null}
  steps:
    "m:a":
      status: success
      args: {}
      result:
        path: f/wl_state_client/client/a_user
        set_create: {value: "<undefined>"}
        set_update: {value: "<undefined>"}
        get_created: {value: {"n": 1}}
        get_missing: {value: "<undefined>"}
        get_updated: {value: {"n": 2}}
        explicit_get: {value: {x: 1}}
