# Written from the stock client's code and the state fixture's predictions
# before the oracle ran it: getState of a state never written resolves to
# undefined (WA-41), setState resolves to undefined, the deprecated helpers
# use the same state path, setState(undefined) on an existing state stores
# null, and on a missing state its create without a value is refused, so the
# helper rejects with the generated client's error (WA-41, WA-V8).
#
# Recorded on the oracle, which corrected the prediction:
# setState(undefined) on a missing state resolves, since its create without
# a value stores null.
spec: [WA-13/l]
target: f/wl_state_client/client
expect:
