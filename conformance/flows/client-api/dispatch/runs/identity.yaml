# The job identity of the runs a step dispatches, a script tracked in its
# parent and a flow tracked and untracked, and the shape of a dispatched
# failure's error: the reference does not say them (WA-V1 leaves
# dispatched jobs out), so no expect is written and the recording is the
# reference. A tracked script's recording settled windmill-lite's rule:
# its parent is the dispatching job, its root and innermost scope are the
# query's root_job (the dispatching step's root), its flow path the
# dispatching job's runnable path (ADR 0007).
spec: [WA-15/a, WA-V1]
target: f/wl_pf3_disp/identity
