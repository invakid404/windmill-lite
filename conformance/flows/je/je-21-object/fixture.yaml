# Recording batch E3f (ADR 0012): JE-21/b's thrown object (Q-JE-1), the
# transform of step b after a step a. The message names the object's
# address, Object(0x...), which differs between runs (oracle run
# 40994947681), so the fixture masks it. The run compares as a subset.
#
# Each run's expect is the reference's source-derived prediction, written
# before the oracle ran it. Synthetic, written for this repository from
# docs/semantics/expressions.md#q-je-1. Deployed with oracle.deploy api.
id: je/je-21-object
spec: [JE-21/b]
scope: core
provenance: source-derived
languages: [bun]
oracle: {workers: 1, deploy: api}
compare:
  mode: subset
  mask:
    - "/result/error/message"
    - "/steps/m:b/result/error/message"
    - "/steps/m:b/carried/error/message"
