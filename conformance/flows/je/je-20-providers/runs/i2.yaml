# JE-42/i: a $jsonvar: text serde refuses fails b before its script runs,
# with serde's message and its line and column counted in bytes: EOF while
# parsing a value at line 1 column 0.
spec: [JE-42/i]
target: f/wl_je20/i2
expect:
  status: failure
  result:
    error:
      name: ExecutionErr
      message: "execution error:\nInternal: Failed to parse $jsonvar value as JSON: EOF while parsing a value at line 1 column 0 @common.rs:299:17"
      step_id: b
