# JE-42/j: the static $encrypted:abcd does not decrypt, so b fails before
# its script runs with CE's cause: Could not decrypt value. The value may
# have been encrypted with a different key.
spec: [JE-42/j]
target: f/wl_je20/j1
expect:
  status: failure
  result:
    error:
      name: ExecutionErr
      message: "execution error:\nInternal: Could not decrypt value. The value may have been encrypted with a different key.<loc>"
      step_id: b
