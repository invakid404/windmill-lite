# JE-42/i: a $jsonvar: text serde refuses fails b before its script runs,
# with serde's message and its line and column counted in bytes: expected
# value at line 1 column 1.
spec: [JE-42/i]
target: f/wl_je20/i1
expect:
  status: failure
  result:
    error:
      name: ExecutionErr
      message: "execution error:\nInternal: Failed to parse $jsonvar value as JSON: expected value at line 1 column 1<loc>"
      step_id: b
