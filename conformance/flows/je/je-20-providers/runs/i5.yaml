# JE-42/i: a $jsonvar: text serde refuses fails b before its script runs,
# with serde's message and its line and column counted in bytes: number out
# of range at line 2 column 12 (the same lines joined by CRLF).
spec: [JE-42/i]
target: f/wl_je20/i5
expect:
  status: failure
  result:
    error:
      name: ExecutionErr
      message: "execution error:\nInternal: Failed to parse $jsonvar value as JSON: number out of range at line 2 column 12 @common.rs:299:17"
      step_id: b
