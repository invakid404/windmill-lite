summary: 'JE-32/b: a false retry_if prevents them'
value:
  modules:
    - id: b
      value:
        type: script
        input_transforms:
          msg:
            type: static
            value: retryable
        path: f/wl_je_waits/fail
      retry:
        constant:
          attempts: 2
          seconds: 0
        retry_if:
          expr: 'false'
schema:
