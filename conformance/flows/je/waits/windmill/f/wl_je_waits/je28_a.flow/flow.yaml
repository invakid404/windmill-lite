summary: "JE-28/a: a fractional value delays the next job in milliseconds"
value:
  modules:
    - id: a
      value:
        type: script
        path: f/wl_je_waits/echo
        input_transforms:
          x:
            type: static
            value:
              s: 1.5
      sleep:
        type: javascript
        expr: result.s
    - id: b
      value:
        type: script
        path: f/wl_je_waits/echo
        input_transforms:
          x:
            type: static
            value: 2
