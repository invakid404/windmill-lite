# JE-12/d: results.a inside a non-async callback. Since CE v1.862.0 the
# read is prefetched before the expression runs, so it no longer breaks the
# callback: the step gets [3].
spec: [JE-12/d]
target: f/wl_je_shortcuts/je12_d
claims:
  - at: /status
    equals: success
  - at: /steps/m:b/status
    equals: success
  - at: /steps/m:b/args/x
    equals: [3]
unit:
  - spec: JE-12/d
    site: m:b
    input: x
    expr: "[1].map(i => results.a.v)"
    context:
      previous_id: m
      previous_result: "0"
      results:
        a: "{\"v\": 3}"
    expect:
      text: "[3]"
