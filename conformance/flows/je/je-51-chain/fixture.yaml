# Recording batch E3f (ADR 0012): a job chain that never ends (Q-JE-12,
# JE-51) at a module-0 transform. The run lasts about 70 s, the three
# evaluation attempts of JE-2, so the fixture is recorded by the oracle
# workflow's long session (oracle.session long), whose run timeout allows
# it. On CE v1.767.0 the zombie-flow monitor canceled the flow at about
# 60 s, with a message and reason that carry timestamps and the worker's
# name ("Flow <id> (<url>) was cancelled because it was hanging in between
# 2 steps." in the raw captures), so the fixture masks the root error's
# message and reason; on CE v1.862.0 the monitor puts the flow back in the
# queue instead, and the flow fails with the timeout error, which the mask
# still covers at the root. The run compares as a subset.
#
# Each run's expect is the reference's source-derived prediction, written
# before the oracle ran it. Synthetic, written for this repository from
# docs/semantics/expressions.md#q-je-12. Deployed with oracle.deploy api.
id: je/je-51-chain
spec: [JE-51, JE-2/b]
scope: core
provenance: oracle-observed
languages: [bun]
oracle: {workers: 1, deploy: api, session: long}
compare:
  mode: subset
  mask: ["/result/error/message", "/result/error/reason"]
