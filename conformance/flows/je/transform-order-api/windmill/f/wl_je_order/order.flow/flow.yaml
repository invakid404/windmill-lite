summary: "JE-23: which of t's transforms is evaluated first"
value:
  modules:
    - id: l
      value:
        type: forloopflow
        iterator:
          type: javascript
          expr: "Array.from({ length: 16 }, (_, i) => i)"
        parallel: false
        skip_failures: true
        modules:
          - id: t
            value:
              type: rawscript
              language: bun
              content: '!inline t.ts'
              input_transforms:
                zz:
                  type: javascript
                  expr: zz_first
                b:
                  type: javascript
                  expr: b_first
                aa:
                  type: javascript
                  expr: aa_first
          - id: u
            value:
              type: rawscript
              language: bun
              content: '!inline u.ts'
              input_transforms: {}
    - id: s
      value:
        type: rawscript
        language: bun
        content: '!inline s.ts'
        input_transforms: 
          seen:
            type: javascript
            expr: "new Set(results.l.map((r) => r.error.message.split('`')[1])).size > 1 ? 'varies' : results.l[0].error.message.split('`')[1]"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
