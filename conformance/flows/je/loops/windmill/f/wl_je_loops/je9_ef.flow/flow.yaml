summary: "JE-9/e, f: an index selects a loop child's result"
value:
  modules:
    - id: l
      value:
        type: forloopflow
        iterator:
          type: static
          value: [1, 2]
        skip_failures: false
        parallel: false
        modules:
          - id: s
            value:
              type: script
              path: f/wl_je_loops/echo
              input_transforms:
                x:
                  type: javascript
                  expr: "flow_input.iter.value * 10"
    - id: b_e
      value:
        type: script
        path: f/wl_je_loops/echo
        input_transforms:
          x:
            type: javascript
            expr: "results.l[1]"
    - id: b_f
      value:
        type: script
        path: f/wl_je_loops/echo
        input_transforms:
          x:
            type: javascript
            expr: results.l.foo
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
