summary: "JE-19/a: a sequential loop exposes its last iteration"
value:
  modules:
    - id: a
      value:
        type: script
        path: f/wl_je_loops/echo
        input_transforms:
          x:
            type: static
            value: 0
    - id: l
      value:
        type: forloopflow
        iterator:
          type: static
          value: [1, 2, 3]
        skip_failures: false
        parallel: false
        modules:
          - id: h
            value:
              type: script
              path: f/wl_je_loops/echo
              input_transforms:
                x:
                  type: static
                  value: 0
          - id: i
            value:
              type: script
              path: f/wl_je_loops/echo
              input_transforms:
                x:
                  type: javascript
                  expr: "flow_input.iter.value * 10"
    - id: b
      value:
        type: script
        path: f/wl_je_loops/echo
        input_transforms:
          x:
            type: javascript
            expr: results.i
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
