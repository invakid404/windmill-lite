    - id: l
      value:
        type: forloopflow
        modules:
          - id: t
            value:
              type: script
              input_transforms:
                x:
                  type: javascript
                  expr: '`Item ${flow_input.iter.index}`'
              path: f/wl_je_loops/echo
          - id: u
            value:
              type: script
              input_transforms:
                x:
                  type: static
                  value: '`Item ${flow_input.iter.index}`'
              path: f/wl_je_loops/echo
        iterator:
          type: static
          value:
            - p
            - q
        parallel: false
        skip_failures: false
schema:
