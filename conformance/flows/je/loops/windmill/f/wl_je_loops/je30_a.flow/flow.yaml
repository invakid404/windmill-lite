summary: 'JE-30/a: the iterator can read results'
value:
  modules:
    - id: a
      value:
        type: script
        input_transforms:
          x:
            type: static
            value:
              items:
                - 1
                - 2
        path: f/wl_je_loops/echo
    - id: l
      value:
        type: forloopflow
        modules:
          - id: i
            value:
              type: script
              input_transforms:
                x:
                  type: javascript
                  expr: flow_input.iter.value
              path: f/wl_je_loops/echo
        iterator:
          type: javascript
          expr: results.a.items
        parallel: false
        skip_failures: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
