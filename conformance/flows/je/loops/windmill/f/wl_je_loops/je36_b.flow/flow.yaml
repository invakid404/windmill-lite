summary: "JE-36/b: a collapsed sequential loop at module 0 sees the flow input every time"
value:
  modules:
    - id: l
      value:
        type: forloopflow
        iterator:
          type: static
          value: [x, "y"]
        skip_failures: false
        parallel: false
        modules:
          - id: s
            value:
              type: script
              path: f/wl_je_loops/echo
              input_transforms:
                x:
                  type: javascript
                  expr: previous_result
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
