# JE-11/c: non-ASCII text inside the call moves the inserted ) early by its
# extra bytes.
spec: [JE-11/c]
target: f/wl_je11/je11c
expect: {status: success, result: "(await variable(é)a)"}
unit:
  - spec: JE-11/c
    site: "m:b"
    input: x
    expr: "\"variable(éa)\""
    context: {previous_id: a, previous_result: "1"}
    expect: {text: "\"(await variable(é)a)\""}
