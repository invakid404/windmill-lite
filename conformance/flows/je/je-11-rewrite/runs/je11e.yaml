# JE-11/e: an insertion inside a multi-byte character fails b before it runs
# with the runtime's panic report, whose task number differs between runs
# (masked here; the raw captures hold it); the flow fails with that value
# and the worker keeps running.
spec: [JE-11/e]
target: f/wl_je11/je11e
expect:
  status: failure
  result: {error: {name: ExecutionErr, message: "<masked>"}}
unit:
  - spec: JE-11/e
    site: "m:b"
    input: x
    expr: "\"variable(é)\""
    context: {previous_id: a, previous_result: "1"}
    expect: {error: {name: ExecutionErr}}
    note: "the recording masks the panic report's message, so the unit checks the error's name only"
