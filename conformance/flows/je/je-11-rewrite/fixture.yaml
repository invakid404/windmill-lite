# Recording batch E3f (ADR 0012): JE-11/c and JE-11/e end to end (Q-JE-13):
# the variable() call rewrite on non-ASCII text, which moves the inserted )
# by the extra bytes, and an insertion inside a multi-byte character, which
# fails with the runtime's panic report. That report's task number differs
# between runs, so its message is masked and checked in the batch manifest.
# The runs compare as a subset.
#
# Each run's expect is the reference's source-derived prediction, written
# before the oracle ran it. Synthetic, written for this repository from
# docs/semantics/conformance.md#je-11. Deployed with oracle.deploy api.
id: je/je-11-rewrite
spec: [JE-11/c, JE-11/e]
scope: core
provenance: source-derived
languages: [bun]
oracle: {workers: 1, deploy: api}
compare:
  mode: subset
  mask: ["/result/error/message", "/steps/m:b/result/error/message"]
