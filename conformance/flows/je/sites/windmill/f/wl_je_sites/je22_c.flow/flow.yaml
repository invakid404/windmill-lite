summary: "JE-22/c: stop_after_if sees results when it names it"
value:
  modules:
    - id: a
      value:
        type: script
        path: f/wl_je_sites/echo
        input_transforms:
          x:
            type: static
            value:
              stop: true
    - id: b
      value:
        type: script
        path: f/wl_je_sites/echo
        input_transforms:
          x:
            type: static
            value: 1
      stop_after_if:
        expr: results.a.stop
        skip_if_stopped: true
    - id: c
      value:
        type: script
        path: f/wl_je_sites/echo
        input_transforms:
          x:
            type: static
            value: 2
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
