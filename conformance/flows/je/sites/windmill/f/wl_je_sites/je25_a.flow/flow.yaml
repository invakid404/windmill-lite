summary: "JE-25/a: skip_if reads results; a skipped step leaves earlier results visible"
value:
  modules:
    - id: a
      value:
        type: script
        path: f/wl_je_sites/echo
        input_transforms:
          x:
            type: static
            value:
              skip: true
    - id: b
      value:
        type: script
        path: f/wl_je_sites/echo
        input_transforms:
          x:
            type: static
            value: 5
      skip_if:
        expr: "results.a.skip === true"
    - id: c
      value:
        type: script
        path: f/wl_je_sites/echo
        input_transforms:
          x:
            type: javascript
            expr: results.a.skip
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
