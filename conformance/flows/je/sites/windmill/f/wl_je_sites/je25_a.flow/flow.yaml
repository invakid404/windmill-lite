      value:
        type: script
        input_transforms:
          x:
            type: static
            value:
              skip: true
        path: f/wl_je_sites/echo
    - id: b
      value:
        type: script
        input_transforms:
          x:
            type: static
            value: 5
        path: f/wl_je_sites/echo
      skip_if:
        expr: results.a.skip === true
    - id: c
