summary: "JE-26/c: the failure module receives a string error"
value:
  modules:
    - id: a
      value:
        type: script
        path: f/wl_je_errors/echo
        input_transforms:
          x:
            type: static
            value: 0
    - id: b
      value:
        type: script
        path: f/wl_je_errors/echo
        input_transforms:
          x:
            type: static
            value: 11
      stop_after_if:
        expr: nope
        skip_if_stopped: false
      retry:
        constant:
          attempts: 2
          seconds: 0
      continue_on_error: true
  failure_module:
    id: failure
    value:
      type: script
      path: f/wl_je_errors/echo
      input_transforms:
        x:
          type: javascript
          expr: "typeof error"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
