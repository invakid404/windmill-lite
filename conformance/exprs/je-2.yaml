# JE-2: an evaluation has a 20 s wall-clock limit, tried up to 3 times. The
# case runs about 70 s on the oracle, and the engine does not stop the
# loop, so its thread keeps spinning after the error (JE-2): slow files are
# recorded last.
finding: JE-2
scope: later
slow: true
cases:
  - spec: JE-2/a
    provenance: source-derived
    title: a CPU-bound loop times out
    expr: '(() => { while (true) {} })()'
    expect:
      error:
        name: ExecutionErr
        prefix: "Error during isolated evaluation of expression `(() => { while (true) {} })()`:\n"
        contains: ['took too long to execute (>20000ms)']
