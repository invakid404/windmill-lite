# JE-2: an evaluation has a 20 s wall-clock limit, tried up to 3 times.
# The three attempts and two pauses take about 70 s. The lifted flow's only
# module is b, so the loop hangs the flow's first transition: on CE v1.862.0
# the zombie-flow monitor puts such a flow back in the queue at about 60 s
# instead of canceling it, and b fails with the timeout error after the
# third attempt. On CE v1.767.0 the monitor canceled the flow, with a reason
# that names times and workers; the root error's message and reason stay
# masked. The engine does not stop the loop, so its thread keeps spinning
# after the run (JE-2): slow files are recorded last. The recording rests on
# no second worker picking the requeued flow up before the third attempt
# ends.
finding: JE-2
scope: later
slow: true
mask: [/result/error/message, /result/error/reason]
cases:
  - spec: JE-2/a
    provenance: oracle-observed
    title: a CPU-bound loop at the first module ends in the timeout error after the monitor requeues the flow
    note: "on CE v1.767.0 the zombie-flow monitor canceled the flow at about 60 s; on CE v1.862.0 it puts a flow that has not started back in the queue, and the timeout error surfaces"
    expr: '(() => { while (true) {} })()'
    expect:
      error:
        name: ExecutionErr
        message: "Error during isolated evaluation of expression `(() => { while (true) {} })()`:\nThe expression evaluation `(() => { while (true) {} })()` took too long to execute (>20000ms)"
