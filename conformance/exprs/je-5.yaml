# JE-5: trimming, and what error messages quote.
finding: JE-5
scope: core
cases:
  - spec: JE-5/a
    provenance: source-derived
    title: surrounding whitespace is trimmed before evaluation
    flow_input: '{"n":5}'
    expr: "\n  flow_input.n \n"
    expect: {value: '5'}
  - spec: JE-5/b
    provenance: source-derived
    scope: later
    title: the site message quotes the untrimmed text
    expr: ' nope '
    expect:
      error:
        name: ExecutionErr
        prefix: "Error during isolated evaluation of expression ` nope `:\n"
        contains: [nope is not defined]
