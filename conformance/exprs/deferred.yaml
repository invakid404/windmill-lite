    remaining: the preview run (Q-JE-5); windmill-lite has no preview mode (ADR 0001 section 1), so recording batch E3e left it outside the contract. Batch E3f has since recorded the preview on the oracle (flows/client-api/driven, run previews, its je36d part, oracle run 40994947681), which stays outside the contract
