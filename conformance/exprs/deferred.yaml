# The cases of the JE catalogue, and of CF-19 and CF-V6, that the recording
# batch E3a encodes neither as an expression case here nor as a flow fixture
# under conformance/flows, each with the reason and where it is checked;
# and the cases it records only in part. TestBatchCoverage in
# internal/oracle fails unless every such catalogue case is encoded or
# listed here.
deferred:
  - case: JE-10/e
    reason: in the evaluation, `results` is a constant and `error` is not; the semantics reference added the case on 2026-10-28 and no recording holds it yet
    checked_in: FU3, at evaluator level (internal/expr/testdata/pipeline/je-10.json, TestPipelineCasesOnEngine); batch E3e did not record it
  - case: JE-11/b
    reason: the count that places a call's `)` starts at the call, so non-ASCII text before it shifts nothing (Q-JE-13); the semantics reference added the case on 2026-10-29 (design request 10) and no recording holds it yet
    checked_in: FU6, at evaluator level (internal/expr/testdata/pipeline/je-11.json, TestPipelineCasesOnEngine); not recorded yet
  - case: JE-11/d
    reason: a call that never closes gets its `)` at the end of its part (Q-JE-13); the semantics reference added the case on 2026-10-29 (design request 10) and no recording holds it yet
    checked_in: FU6, at evaluator level (internal/expr/testdata/pipeline/je-11.json, TestPipelineCasesOnEngine); not recorded yet
  - case: JE-16/c
    reason: an evaluator-level case (point O1) whose previous_result holds the raw token -0, which no flow input reaches (the job API stores the input as jsonb, which has no negative zero); JE-16/e and JE-16/f record the oracle side
    checked_in: FU3, at evaluator level (internal/expr/testdata/pipeline/je-16.json, TestPipelineCasesOnEngine; B2b's TestBindings checks the same token)
  - case: JE-16/g
    reason: a `__proto__` key sets the prototype, not an own property; the semantics reference added the case on 2026-10-28 and no recording holds it yet
    checked_in: FU3, at evaluator level (internal/expr/testdata/pipeline/je-16.json, TestPipelineCasesOnEngine); batch E3e did not record it
  - case: JE-16/h
    reason: a fetched `results` read is built by `JSON.parse`, while the previous step served from memory is the rebuilt `previous_result` (Q-JE-13); the semantics reference added the case on 2026-10-29 (design request 10) and no recording holds it yet
    checked_in: FU6, at evaluator level (internal/expr/testdata/pipeline/je-16.json, TestPipelineCasesOnEngine); not recorded yet
  - case: JE-17/d
    reason: the entry fallbacks are falsy tests; the semantics reference added the case on 2026-10-28 and no recording holds it yet
    checked_in: FU3, at evaluator level (internal/expr/testdata/pipeline/je-17.json, TestPipelineCasesOnEngine); batch E3e did not record it
  - case: JE-18/e
    reason: a repeated module id (OF-2), which the engine's lookup resolves to the last such module with a job and the direct lookup to the one that completed most recently; the semantics reference added the case on 2026-10-29 and no recording holds it yet
    checked_in: FU6, at engine level (internal/engine, TestRepeatedIDLookups, with A5's duplicate-id occurrences); not recorded yet
  - case: JE-19/e
    reason: needs a restarted run (restart from a step); windmill-lite has no restart (ADR 0001 section 1), so the case is outside the contract; recording batch E3f's driver (conformance/flows/client-api/driven, run restart) found that the route the OpenAPI documents, POST /jobs/restart/f/{id} with {step_id}, answers 500 (Wrong number of path arguments for `Path`. Expected 4 but got 2) on CE v1.767.0, so no restart could be recorded
    checked_in: none
  - case: JE-19/f
    reason: later; as JE-19/e, a restarted run, outside the contract; the restart route answers 500 on CE v1.767.0 (recording batch E3f, conformance/flows/client-api/driven, run restart)
    checked_in: none
  - case: JE-42/k
    reason: serde's texts for a `$jsonvar:` value holding a JSON object cut short (`{"a":1,`, `{"a":1` and `{"a":1,}`), which fail `b` before its script runs as JE-42/i's do; source-derived in the semantics reference's revision SC5 (2026-10-30), and no recording holds it yet; docs/design/README.md requests it from the next run of batch E3f (section "Recording requests for a future batch E3f (SC5)"), in the style of je/je-20-providers' i runs
    checked_in: PF2's `$jsonvar:` resolution, with the flow fixture je/je-20-providers once batch E3f records the case (its JE-42/i runs, i1 to i5, run on windmill-lite); not encoded yet
  - case: JE-44/f
    reason: after an identity job, `previous_result` is jsonb's printed text, quoted here by a javascript `timeout`'s parse error; the semantics reference added the case on 2026-10-29 and no recording holds it yet
    checked_in: N1b, whose identity job reads its argument back in jsonb's printed form (internal/engine), end to end with N2's javascript timeout; not encoded yet
  - case: JE-49/e
    reason: a flow_env member nested 128 levels deep deploys and fails at the binding, its column counted in the member's own text (Q-JE-15); batch E3f could not record it, because deploying that flow stopped the CE standalone server (it answered nothing within two seconds of the deployment, oracle run 40990751153), which ended the session; the spec team is asked to settle it (internal/oracle/testdata/batches/e3f.json)
    checked_in: B2b (internal/expr's recursion limit on a bound context value, JE-49), end to end with PF2's resolution of flow_env; not encoded yet
  - case: JE-V5/a
    reason: the transforms are taken in a hash map's order, which is not fixed and may change between runs, so on the oracle which one fails first is not stable and neither is a recording; it is a host- or evaluator-level case, with a variable service that records its calls
    checked_in: B2b, PF2
