# JE-7: a top-level flow_input or flow_env key returns the stored value
# verbatim.
finding: JE-7
scope: core
flow_input: '{"n":12345678901234567890,"a.b":"lit","a":{"b":"nested"}}'
cases:
  - spec: JE-7/a
    provenance: oracle-observed
    title: a top-level key keeps full precision
    expr: flow_input.n
    expect: {value: '12345678901234567890'}
  - spec: JE-7/b
    provenance: oracle-observed
    title: arithmetic goes through JavaScript and rounds
    expr: flow_input.n + 0
    expect: {value: '12345678901234567000'}
  - spec: JE-7/c
    provenance: oracle-observed
    scope: later
    title: a dotted text is looked up as one literal key first
    expr: flow_input.a.b
    expect: {value: '"lit"'}
  - spec: JE-7/d
    provenance: oracle-observed
    title: bracket form
    expr: 'flow_input["a"]'
    expect: {value: '{"b":"nested"}'}
  - spec: JE-7/e
    provenance: oracle-observed
    title: a missing direct key gives null, and x is present
    expr: flow_input.missing
    expect: {value: 'null'}
  - spec: JE-7/f
    provenance: oracle-observed
    title: a missing direct key of an empty input gives null
    flow_input: '{}'
    expr: flow_input.absent
    expect: {value: 'null'}
  - spec: JE-7/g
    provenance: oracle-observed
    title: a missing intermediate throws on the JavaScript path
    flow_input: '{}'
    expr: flow_input.absent.child
    expect:
      error:
        name: ExecutionErr
        contains: ["cannot read property 'child' of undefined"]
