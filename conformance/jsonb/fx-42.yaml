finding: FX-42
note: >-
  FX-42 says where values cross step boundaries as text. The catalogue
  carries FX-42/a to FX-42/g as disputed with the finding, but only FX-42/h is
  contested, so these entries encode one expectation each. Every catalogue
  case here is a flow case: the entry checks the texts a Value holds, and
  rest_in names where the route half is checked. FX-42/d, FX-42/e and
  FX-42/h are in deferred.yaml.
cases:
  - spec: FX-42/a
    provenance: disputed
    title: nested arg values reach the script in jsonb order
    read: stored
    given: '{"bb":1,"a":2,"c":3}'
    expect:
      keys: [a, c, bb]
      stored: '{"a":2,"c":3,"bb":1}'
    rest_in: N1a, which binds previous_result to a's producer text and stores b's argument before b runs (ADR 0005, the argument pipeline)
  - spec: FX-42/b
    provenance: disputed
    title: an engine-built object is stored in jsonb order
    note: 'The given text is what JSON.stringify writes for ({zz: 1, y: 2}).'
    read: stored
    given: '{"zz":1,"y":2}'
    expect:
      keys: [y, zz]
      stored: '{"y":2,"zz":1}'
    rest_in: B2b, which evaluates the transform, and N1a, which stores the argument
  - spec: FX-42/c
    provenance: disputed
    title: an in-memory previous_result keeps the producer's order
    read: producer
    given: '{"bb":1,"a":2}'
    expect:
      keys: [bb, a]
      stored: '{"a":2,"bb":1}'
    rest_in: N1a and B2a, which bind previous_result to the producer text (ADR 0005, the routing table)
  - spec: FX-42/f
    provenance: disputed
    scope: later
    title: Python sees jsonb's rewritten number
    note: The given text is what JSON.stringify writes for 1e21.
    read: stored
    given: '1e+21'
    expect:
      stored: '1000000000000000000000'
    rest_in: L1, whose Python step parses the stored text as an int
  - spec: FX-42/g
    provenance: disputed
    title: a static object arg is jsonb-normalised
    note: The given text is the static value as the flow writes it.
    read: stored
    given: '{"zz": 1, "a": 2}'
    expect:
      keys: [a, zz]
      stored: '{"a":2,"zz":1}'
    rest_in: N1a, which stores the static value as the argument
