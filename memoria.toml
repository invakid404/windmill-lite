version = 3

# Not documentation inputs.
# - .jj/**: jj internal state (colocated with .git; .git is already invisible).
# - bin/**, dist/**: build output.
# - go.sum: dependency checksums; avoid review churn on lockfile-only updates.
#   go.mod remains a review input.
# - renovate.json: bot configuration that Renovate itself may rewrite (config
#   migrations). It is not a documented module, and as a review input outside
#   the auto-ack allowlist it would hold every such Renovate change for a
#   human ack.
# - Agent process records (impl.md, publish.md, done.md, review-*.md,
#   fix-r*.md, and the rest below): per-PR notes that coding agents write
#   while they work. They belong outside the repository; ignoring them keeps
#   a stray copy from re-pending a README. These globs are start-anchored,
#   so every name needs a pattern that matches it from the first character:
#   `fix-r*.md` does not match `ci-fix-r1.md`.
ignore = [
    ".jj/**",
    "bin/**",
    "dist/**",
    "go.sum",
    "renovate.json",
    "impl.md",
    "publish.md",
    "done.md",
    "merge-gate.md",
    "audit.md",
    "design-gate.md",
    "prep-workspace.md",
    "bootstrap.md",
    "fix-r*.md",
    "ci-fix-r*.md",
    "ci-round*.md",
    "review-*.md",
    "audit-comment*.md",
]
include = []

# The writing standard is docs/writing.md, and the glossary is
# docs/glossary.md. As guidance files, Memoria lists them in every review
# after the inline entries, and they are not inputs of any README. The
# inline entries are the review checklist: the standard's checkable rules,
# and what a reviewer verifies before an acknowledgement. Keep the limits
# here equal to docs/writing.md and scripts/check-docs.py; the script's
# tests compare them.
[documentation]
guidance = [
    "Review against the writing standard (docs/writing.md) and the glossary (docs/glossary.md), which Memoria lists after these entries. Read both before you review. These entries are the checklist of the standard's checkable rules.",
    "Structure: each heading names one topic. The most important fact comes first in the document, in each section and in each paragraph. A procedure is numbered steps with one action each, a set is a bullet list, and a comparison or reference data is a table.",
    "Length: a block of prose (a paragraph, a list item or a table cell) has at most 4 sentences and at most 80 words, and a sentence has at most 40 words. CI reports the blocks and sentences over these limits (scripts/check-docs.py).",
    "Sentences: active voice; present tense for what the code does today; articles kept; no noun cluster of more than three nouns; values with their units, quoted from the source; no marketing language, and no planned work described as shipped.",
    "Words: each glossary term only in its glossary meaning, and one term for one thing throughout the document.",
    "Every README starts with a **Current state:** line that says what works today, what is a stub and what waits on later work; a nested README states its scope there too. The root README leads with the product and the problem, then its current state, a quick start, and an index of every module README and of docs/.",
    "Self-contained: no internal plan or work code, as a name or as an explanation: no milestone ID (such as F3b or SC5), wave number, plan item, review round or pull request number. A reader who has never seen the project's plans understands every sentence. CI reports milestone IDs and other work codes (scripts/check-docs.py).",
    "Durable: the document records what the system does, why, and its limits, never the history of the work: no 'added in' or 'fixed in' a milestone, no revision notes, no round counts. Git and pull requests hold that history.",
    "Identifiers: an identifier appears only if a document in this repository defines it in one place as the stable name of a behaviour or a decision (a finding such as WR-2, a deviation such as D9, an ADR number). Each use outside the definition links to it, and its sentence is clear without the identifier. A milestone ID never qualifies.",
    "Decision records: an ADR keeps the decision, its context, the alternatives and the consequences. It tracks no milestone or work status.",
    "Each fact has one home: link to it, or repeat it only through a Memoria import (`memoria render`). Never copy whole sections between READMEs. Review notes belong in pull requests.",
    "Cross-check every claim against the code in the document's scope before you acknowledge. When the document describes a name, command, flag or behaviour that no longer matches the source, edit the document instead of acknowledging the drift.",
    "Clean room: describe Windmill behaviour in your own words, citing public documentation, the Apache-2.0 parts of Windmill, or observed behaviour. Never quote, translate, or paraphrase line by line any AGPL or proprietary Windmill source. Identifiers, JSON field names, enum values, and error strings that compatibility requires are fine.",
    "Markdown: GitHub-flavoured; Mermaid diagrams with neutral wording, the default rendering (no theme or colour overrides) and one claim each; code spans, code blocks, paths, identifiers and quoted errors byte-exact.",
]
guidance_files = ["docs/writing.md", "docs/glossary.md"]
section_guidance_files = []

[fingerprints]
default = "raw"
languages = {}

[lint]
missing_import_hint = true
