version = 3

# Not documentation inputs.
# - .jj/**: jj internal state (colocated with .git; .git is already invisible).
# - bin/**, dist/**: build output.
# - go.sum: dependency checksums; avoid review churn on lockfile-only updates.
#   go.mod remains a review input.
# - renovate.json: bot configuration that Renovate itself may rewrite (config
#   migrations). It is not a documented module, and as a review input outside
#   the auto-ack allowlist it would hold every such Renovate change for a
#   human ack.
# - Agent process records (impl.md, publish.md, done.md, review-*.md,
#   fix-r*.md, and the rest below): per-PR notes that coding agents write
#   while they work. They belong outside the repository; ignoring them keeps
#   a stray copy from re-pending a README. These globs are start-anchored,
#   so every name needs a pattern that matches it from the first character:
#   `fix-r*.md` does not match `ci-fix-r1.md`.
ignore = [
    ".jj/**",
    "bin/**",
    "dist/**",
    "go.sum",
    "renovate.json",
    "impl.md",
    "publish.md",
    "done.md",
    "merge-gate.md",
    "audit.md",
    "design-gate.md",
    "prep-workspace.md",
    "bootstrap.md",
    "fix-r*.md",
    "ci-fix-r*.md",
    "ci-round*.md",
    "review-*.md",
    "audit-comment*.md",
]
include = []

# The writing standard is docs/writing.md, and the glossary is
# docs/glossary.md. As guidance files, Memoria lists them in every review
# after the inline entries, and they are not inputs of any README. The
# inline entries are the review checklist: the standard's checkable rules,
# and what a reviewer verifies before an acknowledgement. Keep the limits
# here equal to docs/writing.md and scripts/check-docs.py; the script's
# tests compare them.
[documentation]
guidance = [
    "Review against the writing standard (docs/writing.md) and the glossary (docs/glossary.md), which Memoria lists after these entries. Read both before you review. These entries are the checklist of the standard's checkable rules.",
    "Structure: each heading identifies its section without the body, and the direct body of a section covers one topic. The most important fact comes first in the document, in each section and in each paragraph, with any limit that it needs to be true. A procedure is numbered steps with one action each, a set is a bullet list, and a comparison or reference data is a table.",
    "Length: a block of prose (a paragraph, a list item with all its paragraphs, or a table cell) has at most 4 sentences and at most 80 words, and a sentence has at most 40 words. Inline code counts as one word, and a link by its text. CI reports the blocks and sentences over these limits (scripts/check-docs.py).",
    "Sentences: active voice; present tense for what the system does; articles kept; no noun cluster of more than three nouns; quantities with their units and versions exact, each number taken from the code, a test or a linked measurement; no marketing language, and no planned work described as shipped.",
    "Words: when the document writes about a concept that the glossary defines, it uses the glossary term, only in its glossary meaning, and one term for one thing throughout. Qualified ordinary uses (a CI job, the repository root) are fine. Each project term is explained or linked to the glossary at its first use; general knowledge that docs/writing.md lists as assumed needs no explanation.",
    "Every package README starts with a **Current state:** line that says what works today, what is a stub and what waits on later work, followed by its scope. The root README is the exception: it leads with the product and the problem, then its **Current state:** paragraph, a quick start, and an index of every module README and of docs/.",
    "Self-contained: no internal plan or work code, as a name or as an explanation: no milestone ID (such as F3b or SC5), wave number, plan item, review round or pull request number. A reader who has never seen the project's plans understands every sentence. CI reports milestone IDs and other work codes (scripts/check-docs.py).",
    "Durable: the document records what the system does, why, and its limits, never the history of the work: no 'added in' or 'fixed in' a milestone, no revision notes, no round counts. Git and pull requests hold that history.",
    "Identifiers: outside the document that defines it, an identifier (such as a finding ID) may appear only as a link to its definition, and the same sentence must state the behaviour or rule in plain words. The ID is a pointer for traceability, never the explanation, so a reader who does not follow the link still understands the sentence. Inside the defining document, IDs are anchors as usual. The rule applies to code comments too: in a code comment, the link is the repository path of the defining file with its anchor, right after the ID, in the sentence that states the rule; where no such link fits, the comment leaves the ID out. Machine-readable data (a conformance case's finding field), code identifiers and file names stay byte-exact. A milestone ID never qualifies.",
    "ADRs: an ADR keeps the decision, its context, the alternatives and the consequences. It tracks no milestone or work status.",
    "Each fact has one authoritative home: link to it, with at most a short summary next to the link, or repeat it only through a Memoria import (`memoria render`). Never copy whole sections between READMEs. Review notes belong in pull requests.",
    "Cross-check every claim against its source of truth before you acknowledge: the code and tests for a README, a guide or a code comment; Windmill at the pinned version for the semantics reference; the accepted decision for an ADR, with what the code does not do yet marked as planned. When the document no longer matches its source, edit the document instead of acknowledging the drift.",
    "Clean room: describe Windmill behaviour in your own words, citing public documentation, the Apache-2.0 parts of Windmill, or observed behaviour. Never quote, translate, or paraphrase line by line any AGPL or proprietary Windmill source. Identifiers, JSON field names, enum values, and error strings that compatibility requires are fine.",
    "Markdown: GitHub-flavoured; Mermaid diagrams with the default rendering (no theme or colour overrides), labels that name things and actions rather than judge them, and one question answered by each diagram; code spans, code blocks, paths, identifiers and quoted errors byte-exact.",
]
guidance_files = ["docs/writing.md", "docs/glossary.md"]
section_guidance_files = []

[fingerprints]
default = "raw"
languages = {}

[lint]
missing_import_hint = true
