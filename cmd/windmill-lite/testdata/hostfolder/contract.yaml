# The host contract of the host-mode tests (cmd/windmill-lite/host_test.go):
# the flows the test host runs, one script it runs as a script job, and
# the host-provided modules whose instances the host registers (ADR 0010,
# D12), one of them outside the sync folder (milestone F3h).
roots:
  - flow: f/host/echo
  - flow: f/host/intercept
  - flow: f/host/reject
  - flow: f/host/scope
  - flow: f/host/spin
  - flow: f/host/stall
  - flow: f/host/timeout
  - flow: f/host/two
  - flow: f/host/linger
  - flow: f/host/variable
  - flow: f/host/cb_scope
  - flow: f/host/cb_asset
  - flow: f/host/big
  - flow: f/host/outside
  - flow: f/host/compute
  - flow: f/host/lease
  - script: f/host/sleep
host_modules: [f/host/scopes.ts, f/host/pool.ts, ../hostlib/tenant.ts]
