# The secret scan of CI's secrets job: gitleaks (MIT licence,
# https://github.com/gitleaks/gitleaks) scans each commit of a pull request
# with its default rules and the rule below. gitleaks reads this file when it
# runs at the repository root.
#
# Every allowlist below names one kind of value that the repository's
# synthetic fixtures hold on purpose, matched by its path and its exact
# form, so that the scan fails only on a real finding.

[extend]
useDefault = true

# The default rules miss a bearer token in a JSON string, such as the
# Authorization header in a recorded trigger event. wltest record replaces
# the oracle session's token with "<redacted-token>" wherever it reads data
# from the oracle, and this rule catches a token that gets past it.
[[rules]]
id = "http-bearer-token"
description = "A bearer token in an HTTP Authorization value"
regex = '''(?i)\bbearer[ \t]+([A-Za-z0-9._~+/-]{20,}=*)'''
secretGroup = 1
entropy = 3.0
keywords = ["bearer"]

# windmill-cli writes the SHA-256 digest of each script and flow into a sync
# tree's wmill-lock.yaml, under the item's path. A path with "key" in it,
# such as f/wl_je_shortcuts/keys10, makes the generic rule read the digest
# as an API key.
[[allowlists]]
description = "SHA-256 digests in a windmill-cli lock file"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)wmill-lock\.yaml$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']

# A step case sends a token that names no invocation and expects the
# facade to refuse it.
[[allowlists]]
description = "The made-up bearer token of a step case"
targetRules = ["http-bearer-token"]
condition = "AND"
paths = ['''^conformance/steps/bun/wa-31\.yaml$''']
regexTarget = "secret"
regexes = ['''^wl_not_this_invocations$''']

# The plugin command's test of secrets by reference passes a secret
# variable's value through an environment variable whose name has SECRET in
# it. Where the name precedes the synthetic value on one line, the generic
# rule reads the value as a key.
[[allowlists]]
description = "The synthetic secret of the plugin command's secrets-by-reference test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^cmd/windmill-lite/plugin_test\.go$''']
regexTarget = "secret"
regexes = ['''^synthetic-secret-7f1c2a$''']

# The tests of the harness environment give secret entries synthetic values.
# Where an identifier that names a secret takes such a value, the generic
# rule reads the value as a key: as the rule captures it, a value with a
# space or a slash ends there.
[[allowlists]]
description = "The synthetic secrets of wl's harness environment tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^wl/harnessenv_test\.go$''']
regexTarget = "secret"
regexes = [
  '''^synthetic-harness-secret-41d9$''',
  '''^synthetic-masked-secret-6a0e$''',
  '''^synthetic-trace-secret-91c4$''',
  '''^synthetic/url$''',
  '''^synthetic-provenance-secret-3c8d$''',
  '''^synthetic-tail-19$''',
  '''^synthetic-private-19$''',
  '''^u0026finished-24$''',
  '''^synthetic-plain-25$''',
]

[[allowlists]]
description = "The synthetic secrets of the plugin command's harness environment tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^cmd/windmill-lite/harnessenv_test\.go$''']
regexTarget = "secret"
regexes = ['''^synthetic-harness-secret-c83f$''', '''^synthetic-masked-secret-0d47$''']

[[allowlists]]
description = "The synthetic secret of internal/harness's late-call masking test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/harness/secrets_test\.go$''']
regexTarget = "secret"
regexes = ['''^synthetic-late-21$''']
