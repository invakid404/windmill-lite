name: Oracle

# Records the flow fixtures under conformance/flows, and the expression
# cases under conformance/exprs lifted into generated one-step flows, on the
# unmodified Windmill CE v1.767.0 image (ADR 0011, OR-19) and fails when a
# normalised observation differs from the committed recording, when a run
# has no recording, or when the CLI-generated metadata of a committed sync
# tree drifts (OR-8). Provenance (dates, timings, image ids) never fails it (OR-V5).
# The image is pulled by digest and run as a black box; it is never built
# on, tagged or pushed (OR-3). It runs nightly, on demand, and on pull
# requests that change the fixtures or the harness or carry the oracle
# label. Sessions run side by side: one worker for every fixture of the
# reference configuration (OR-4), two workers for the fixtures that need
# them (OR-5) and the smoke fixture under another
# LISTEN_NEW_EVENTS_INTERVAL_SEC (OR-7/a), and one session per changed
# configuration, which records only the fixtures that declare it
# (oracle.session; SessionConfigs in internal/oracle).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Oracle trigger
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      record: ${{ steps.decide.outputs.record }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to record
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'oracle') }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD" -- \
            conformance/ internal/oracle/ internal/conformance/ cmd/wltest/ \
            internal/openflow/ internal/yamlx/ internal/syncfolder/ \
            .github/workflows/oracle.yml go.mod go.sum)
          if [ "$HAS_LABEL" = "true" ] || [ -n "$changed" ]; then
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
          echo "label: $HAS_LABEL"
          echo "changed paths:"
          echo "$changed"

  record:
    name: Oracle record (${{ matrix.session.id }})
    needs: changes
    # !cancelled() lets the job run when the trigger job was skipped (on a
    # schedule or dispatch) but not after a cancellation.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.record == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.session.timeout || 45 }}
    strategy:
      fail-fast: false
      matrix:
        session:
          # One worker records every fixture, skipping those that need two.
          - id: workers1
            args: --workers 1 --skip-unmet-workers --skip-unmet-session conformance/flows conformance/exprs
          # Two workers record the fixtures that need them (OR-5/b), and the
          # smoke fixture again with LISTEN_NEW_EVENTS_INTERVAL_SEC=10: its
          # recordings, made at 1 s with one worker, must hold unchanged
          # (OR-7/a).
          - id: workers2
            args: --workers 2 --listen-interval 10 --skip-unmet-session conformance/flows/oracle/smoke conformance/flows/oracle/workers2 conformance/flows/client-api/dispatch conformance/flows/client-api/driven conformance/flows/control-flow/cf-7-release
          # A worker that serves the nativets tag (WORKER_TAGS=nativets,
          # Q-WR-21) records the native-step fixtures (batch E3f).
          - id: native
            args: --workers 1 --session native --skip-unmet-workers --skip-unmet-session conformance/flows
          # The reference configuration, for the fixtures whose runs wait a
          # minute or more on the server's own monitors (batch E3f), with a
          # longer run timeout.
          - id: long
            args: --workers 1 --session long --skip-unmet-workers --skip-unmet-session --run-timeout 5m conformance/flows
            timeout: 75
          # The same on two workers, for FX-26's retry delays, whose step
          # waits for the flows it starts, one of them over five minutes.
          - id: long2
            args: --workers 2 --session long --skip-unmet-session --run-timeout 9m conformance/flows/execution/fx-26-delays
            timeout: 45
          # MAX_RESULT_SIZE_MB=3 (OR-7/b, OR-7/c).
          - id: result_size
            args: --workers 1 --session result_size --skip-unmet-workers --skip-unmet-session conformance/flows
          # DISABLE_FLOW_SCRIPT=true (OF-V5/b).
          - id: flow_script_off
            args: --workers 1 --session flow_script_off --skip-unmet-workers --skip-unmet-session conformance/flows
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        # npx runs the pinned windmill-cli@1.767.0 as a tool (OR-8).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Build wltest
        run: go build -o bin/wltest ./cmd/wltest

      - name: Record the fixtures
        # wltest measures free disk itself and refuses to pull without the
        # reserve of OR-30. A run that has not completed after 2 minutes is
        # canceled and fails, so a hung run cannot exhaust the job; the
        # slowest runs (JE-2's three 20 s attempts) take about 75 s.
        run: |
          df -h /
          bin/wltest record --check --regenerate-metadata --repeat 2 --run-timeout 2m \
            --out "$RUNNER_TEMP/oracle/recorded" \
            --raw "$RUNNER_TEMP/oracle/raw" \
            --report "$RUNNER_TEMP/oracle/report.json" \
            ${{ matrix.session.args }}

      - name: Metadata drift gate (OR-8)
        if: ${{ !cancelled() }}
        run: |
          drift=$(git status --porcelain -uall -- conformance/)
          if [ -z "$drift" ]; then
            echo "The committed sync-tree metadata is current."
            exit 0
          fi
          echo "generate-metadata changed the fixture trees:" >&2
          echo "$drift" >&2
          mkdir -p "$RUNNER_TEMP/oracle/tree"
          git status --porcelain -uall -z -- conformance/ | while IFS= read -r -d '' entry; do
            file="${entry:3}"
            if [ -f "$file" ]; then
              cp --parents "$file" "$RUNNER_TEMP/oracle/tree/"
            fi
          done
          git diff -- conformance/ > "$RUNNER_TEMP/oracle/tree.diff"
          exit 1

      - name: Upload recordings, raw captures and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-${{ matrix.session.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle
          if-no-files-found: ignore
          retention-days: 30
