name: Release

# Releases windmill-lite from the tag v<version>, where <version> is the
# version field of harnesses/package.json, the one version of the engine
# and the npm package (scripts/release.py). RELEASING.md has the steps.
#
# 1. check: the tag is "v" + the package version, and the run releases
#    only from a tag of invakid404/windmill-lite (scripts/release.py mode).
# 2. engine: builds the engine binaries the repository builds, each on a
#    runner of its platform: Linux amd64 and arm64 as static binaries
#    (zig cc against musl, as CI's static-linux job builds them), and
#    macOS arm64 and amd64. Each must print "windmill-lite v<version>"
#    and pass selfcheck.
# 3. package: packs the npm package, runs its packaging test
#    (harnesses/npm/test/check.sh) on that tarball with the Linux amd64
#    engine of step 2, and runs npm publish --dry-run on it.
# 4. assets: LICENSES.txt, the licence texts that the binaries carry
#    (scripts/release.py notices), and the SHA-256 sums of the four
#    binaries and LICENSES.txt, in SHA256SUMS.
# 5. release: the GitHub Release of the tag, with the binaries,
#    LICENSES.txt and SHA256SUMS.
# 6. publish: npm publish --provenance --access public of the tarball
#    that step 3 tested, unless that version is on npm already. npm
#    trusted publishing authorises it: npm
#    exchanges the job's GitHub OIDC token (id-token: write) for a
#    short-lived publish token. No npm token or secret exists, and npm
#    accepts the exchange only from this workflow file of this repository,
#    as the package's trusted publisher names them.
#
# A dry run does steps 1 to 4 and creates and publishes nothing:
# workflow_dispatch with dry_run (the default), a pull request that
# changes this workflow, the package's manifest, lockfile, build or
# packaging test, or the release helper (the paths below), and any run in
# a fork. A dry run on a branch has no tag to check; a release (dry_run
# false) runs only from the tag, in invakid404/windmill-lite.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check everything, and create and publish nothing (npm publish --dry-run)"
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - harnesses/package.json
      - harnesses/bun.lock
      - harnesses/npm/**
      - scripts/release.py

permissions:
  contents: read

# One release per ref at a time. A release is never cancelled part-way; a
# pull request's newer push cancels its older dry run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag and decide whether this run releases
        # release.py mode (tested in scripts/test_release.py): a pushed tag
        # releases only in invakid404/windmill-lite, and a fork's tag is a
        # dry run; a dispatch releases only there, on a tag, with dry_run
        # false; a pull request is a dry run. A tag must be "v" + the
        # package version.
        id: version
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          version=$(python3 scripts/release.py version)
          mode=$(python3 scripts/release.py mode)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$mode" >> "$GITHUB_OUTPUT"
          echo "windmill-lite $version, $GITHUB_EVENT_NAME of the $GITHUB_REF_TYPE $GITHUB_REF_NAME in $GITHUB_REPOSITORY: $mode" | tee -a "$GITHUB_STEP_SUMMARY"

  engine:
    name: Engine (${{ matrix.os }}-${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: darwin
            arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BIN: windmill-lite-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # No build cache: a release engine is built from the tag's sources
        # alone.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Zig
        if: matrix.os == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build the static Linux engine
        if: matrix.os == 'linux'
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.target }}
        run: python3 scripts/release.py build-engine "$RUNNER_TEMP/$BIN" --static

      - name: Check that the Linux engine is static
        if: matrix.os == 'linux'
        run: |
          bin="$RUNNER_TEMP/$BIN"
          file "$bin"
          if readelf --program-headers "$bin" | grep -q INTERP; then
            echo "$bin names a program interpreter" >&2
            exit 1
          fi
          if readelf --dynamic "$bin" | grep -q NEEDED; then
            echo "$bin needs shared libraries" >&2
            exit 1
          fi

      - name: Build the macOS engine
        if: matrix.os == 'darwin'
        env:
          CGO_ENABLED: "1"
        run: |
          python3 scripts/release.py build-engine "$RUNNER_TEMP/$BIN"
          file "$RUNNER_TEMP/$BIN"

      - name: Check the engine's version and start it
        run: |
          python3 scripts/release.py check-engine "$RUNNER_TEMP/$BIN"
          "$RUNNER_TEMP/$BIN" selfcheck

      - name: Upload the engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BIN }}
          path: ${{ runner.temp }}/${{ env.BIN }}
          if-no-files-found: error
          retention-days: 14

  package:
    name: npm package
    needs: [check, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # The packaging test builds an engine of another version, which
        # must refuse the packed SDK.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        # The package's build refuses any Bun but the harness's pinned
        # 1.4.3.
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Set up Node
        # npm trusted publishing needs npm 11.5.1 or newer; Node 24.22.1
        # ships npm 11.19.1. The publish job uses the same Node.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Install the build helper's dependencies
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Install the package's dependencies
        working-directory: harnesses
        run: bun install --frozen-lockfile

      - name: Download the Linux amd64 engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windmill-lite-linux-amd64
          path: ${{ runner.temp }}/engine

      - name: Pack
        working-directory: harnesses
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          test -f "$RUNNER_TEMP/npm/windmill-lite-$VERSION.tgz"

      - name: Test the tarball with the release engine
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_TARBALL: ${{ runner.temp }}/npm/windmill-lite-${{ needs.check.outputs.version }}.tgz
          WL_ENGINE: ${{ runner.temp }}/engine/windmill-lite-linux-amd64
        run: |
          chmod +x "$WL_ENGINE"
          harnesses/npm/test/check.sh

      - name: npm publish --dry-run
        # npm refuses to publish over a version, even in a dry run. The
        # publish job skips a version that is on npm already, such as the
        # first version, which is published by hand (RELEASING.md), so
        # this step skips it too.
        run: |
          if published=$(npm view "windmill-lite@$VERSION" dist.integrity 2>/dev/null) && [ -n "$published" ]; then
            echo "::notice::windmill-lite@$VERSION is on npm already ($published); the publish job publishes nothing"
            exit 0
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "$RUNNER_TEMP/npm/windmill-lite-$VERSION.tgz" --dry-run --provenance --access public --tag "$tag"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/windmill-lite-${{ needs.check.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 14

  assets:
    name: Release assets
    needs: [check, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # notices lists the Go modules that the engine links, and reads
        # their licence files from the module cache.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the engines
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windmill-lite-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets

      - name: Write LICENSES.txt and SHA256SUMS
        run: |
          cd "$RUNNER_TEMP/assets"
          for bin in windmill-lite-linux-amd64 windmill-lite-linux-arm64 windmill-lite-darwin-arm64 windmill-lite-darwin-amd64; do
            test -f "$bin" || { echo "no $bin" >&2; exit 1; }
          done
          test "$(find . -type f | wc -l)" -eq 4
          cd "$GITHUB_WORKSPACE"
          python3 scripts/release.py notices "$RUNNER_TEMP/assets/LICENSES.txt"
          cd "$RUNNER_TEMP/assets"
          grep '^Go module ' LICENSES.txt
          sha256sum windmill-lite-* LICENSES.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, package, assets]
    # The check job decided; the event, the tag ref and the repository are
    # checked here again, so that no other run reaches a write permission.
    if: >-
      needs.check.outputs.dry_run == 'false' &&
      github.repository == 'invakid404/windmill-lite' &&
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --generate-notes $prerelease \
            "$RUNNER_TEMP"/assets/windmill-lite-* "$RUNNER_TEMP/assets/LICENSES.txt" "$RUNNER_TEMP/assets/SHA256SUMS"

  publish:
    name: npm publish
    needs: [check, package, release]
    if: >-
      needs.check.outputs.dry_run == 'false' &&
      github.repository == 'invakid404/windmill-lite' &&
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Check npm
        # Trusted publishing needs npm 11.5.1 or newer.
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm

      - name: Publish with provenance
        # No NODE_AUTH_TOKEN: npm authenticates through trusted publishing.
        # A version that is on npm already is not published again: npm
        # never replaces a version, and the first version is published by
        # hand before its tag (RELEASING.md). A pre-release goes to the
        # dist-tag next, which npm requires.
        run: |
          tgz="$RUNNER_TEMP/npm/windmill-lite-$VERSION.tgz"
          if published=$(npm view "windmill-lite@$VERSION" dist.integrity 2>/dev/null) && [ -n "$published" ]; then
            built="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            if [ "$published" = "$built" ]; then
              echo "::notice::windmill-lite@$VERSION is on npm already, with this tarball; nothing to publish"
            else
              echo "::warning::windmill-lite@$VERSION is on npm already, with another tarball ($published; this run built $built); nothing to publish"
            fi
            exit 0
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "$tgz" --provenance --access public --tag "$tag"
