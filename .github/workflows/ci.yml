          if [ "$PLAN" != success ] || [ "$BUCKETS" != success ]; then
            echo "the plan or a bucket of the QuickJS-only run did not succeed" >&2
            exit 1
          fi

      - name: Fail a cancelled run
        if: cancelled()
        run: |
          echo "the run was cancelled" >&2
          exit 1

