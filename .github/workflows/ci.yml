name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; superseded runs cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    # Branch protection requires the status checks "Go (ubuntu-latest)" and
    # "Go (macos-latest)". On Linux this job is the check. On macOS the tests
    # run in parts on parallel runners, and the job go-macos below reports
    # the check from their results. Renaming a job or a matrix entry needs
    # the same change in the protection settings or in go-macos.
    #
    # cmd/wltest's flow suite (TestFlowSuite) runs every flow fixture in
    # five modes, each a subtest: warm, fresh and host, and warm and host
    # from bundles built with shared code (ADR 0013), named warm-shared-code
    # and host-shared-code. macOS runners have three cores, so the suite
    # runs one fixture at a time there (GOMAXPROCS/2 is 1): in CI it took
    # about 42 of the 45 minutes of one macOS test step, 20 of them in its
    # two host modes. The macOS parts split the tests by complementary -run
    # and -skip patterns, so together they run every test that one
    # `go test ./...` runs: the packages without TestFlowSuite, the suite's
    # modes whose names do not start with "host", and those that do.
    # TestFlowSuite is defined only in cmd/wltest.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Go (ubuntu-latest)
            os: ubuntu-latest
            checks: true
          - name: Go (macos-latest, packages)
            os: macos-latest
            checks: true
            skip: ^TestFlowSuite$
          - name: Go (macos-latest, flow suite in warm and fresh mode)
            os: macos-latest
            packages: ./cmd/wltest
            run: ^TestFlowSuite$
            skip: ^TestFlowSuite$/^host
          - name: Go (macos-latest, flow suite in host mode)
            os: macos-latest
            packages: ./cmd/wltest
            run: ^TestFlowSuite$/^host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # The toolchain version comes from the `go` (or `toolchain`) line in
        # go.mod, so go.mod is the single source of truth for it.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        # The harness tests run on the Bun of Windmill v1.767.0's images
        # (WR-3); this pin moves only with that reference, never with a
        # Bun release (harness.PinnedBun).
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Set up Node
        # Deviation D13's Node side (conformance/steps/bun/d13.yaml, run by
        # cmd/wltest): the same esbuild CommonJS codebase bundle runs on
        # Node, as Windmill runs it, and on the Bun harness. Node 20 is the
        # major Windmill v1.767.0's image installs (WR-50); its patch there
        # is unpinned (Q-WR-24).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2

      - name: Locate Node
        run: echo "WL_NODE=$(command -v node)" >> "$GITHUB_ENV"

      - name: Fetch windmill-client 1.767.0
        # The Q-WA-4 env-view test (milestone W1, internal/harness) and the
        # facade's attribution test (milestone PF1,
        # internal/platform/facade) run the stock client of Windmill
        # v1.767.0: an Apache-2.0 package, used as a test dependency and
        # never committed. The tarball is checked
        # against the SHA-512 of its npm integrity hash.
        run: |
          dir="$RUNNER_TEMP/windmill-client"
          mkdir -p "$dir/node_modules/windmill-client"
          curl -sSfL --retry 3 -o "$dir/client.tgz" https://registry.npmjs.org/windmill-client/-/windmill-client-1.767.0.tgz
          echo "7eaa7609e5926052d874e1d086f317b6050da112dddd3dd33c39a7cf9b2a62a127ffc0e4fae1903f440a20b3359d266ef719f551d81c11cfd452bdaadb80c8c3  $dir/client.tgz" | shasum -a 512 -c -
          tar -xzf "$dir/client.tgz" -C "$dir/node_modules/windmill-client" --strip-components=1
          echo "WL_WINDMILL_CLIENT=$dir" >> "$GITHUB_ENV"

      - name: Install the build helper's dependencies
        # The Bun build helper (harnesses/bun/build, ADR 0010) parses
        # TypeScript with the parser its lockfile pins; the Go build tests
        # run it.
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Check formatting
        if: matrix.checks
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Check go.mod is tidy
        if: matrix.checks
        run: go mod tidy -diff

      - name: Vet
        if: matrix.checks
        run: go vet ./...

      - name: Test
        # WL_REQUIRE_BUN turns a missing Bun or client into a failure
        # instead of a skip, so the harness protocol and build tests, the
        # Q-WA-4 test and the host-mode tests (a host compiled with bun build
        # --compile) always run here; WL_REQUIRE_NODE does the same for
        # D13's Node side of the step suite.
        #
        # A part that selects tests by -run also passes -v, so its log shows
        # the time of each flow-suite mode.
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_REQUIRE_BUN: "1"
          WL_REQUIRE_NODE: "1"
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
          PACKAGES: ${{ matrix.packages || './...' }}
        run: |
          args=(-race -timeout 45m)
          if [ -n "$RUN" ]; then args+=(-v -run "$RUN"); fi
          if [ -n "$SKIP" ]; then args+=(-skip "$SKIP"); fi
          set -x
          go test "${args[@]}" "$PACKAGES"

      - name: Build a fixture bundle twice and compare
        if: matrix.checks
        # F4's exit gate (ADR 0010, 0012): the same inputs and pins give one
        # bundle digest. The second build reads a copy of the fixture in
        # another directory; the archives must be the same bytes.
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_BUILD_HELPER: ${{ github.workspace }}/harnesses/bun/build/main.ts
        run: |
          wl="$RUNNER_TEMP/windmill-lite"
          go build -o "$wl" ./cmd/windmill-lite
          fixture=internal/bundle/testdata/fixture
          cp -R "$fixture" "$RUNNER_TEMP/fixture-copy"
          a=$("$wl" build "$fixture/windmill" -contract "$fixture/contract.yaml" -o "$RUNNER_TEMP/a.wlb")
          b=$("$wl" build "$RUNNER_TEMP/fixture-copy/windmill" -contract "$RUNNER_TEMP/fixture-copy/contract.yaml" -o "$RUNNER_TEMP/b.wlb")
          echo "first build:  $a"
          echo "second build: $b"
          test "$a" = "$b"
          cmp "$RUNNER_TEMP/a.wlb" "$RUNNER_TEMP/b.wlb"
          "$wl" verify "$RUNNER_TEMP/b.wlb" -digest "$a"

      - name: Measure the expression pool under load
        if: matrix.checks
        # Prints latency percentiles of the native QuickJS-ng pool
        # (internal/expr/quickjs, milestone B1a). Report only: it sets no
        # threshold; the budget gate is milestone B2b's.
        env:
          WL_QUICKJS_LOAD: "1"
          WL_QUICKJS_LOAD_SECONDS: "1"
        run: go test -count=1 -run '^TestPoolUnderLoad$' -v ./internal/expr/quickjs

      - name: Report the expression budget gate
        if: matrix.checks
        # ADR 0003's budget gate, measured through the whole pipeline
        # (internal/expr, milestone B2b). Report only: the gate holds on the
        # benchmark machine; CI's shared runners show the trend.
        env:
          WL_EXPR_BUDGET: report
          WL_EXPR_BUDGET_SECONDS: "1"
        run: go test -count=1 -run '^TestBudgetGate$' -v ./internal/expr

      - name: Test repository scripts
        if: matrix.checks
        # Unit tests for the helpers in scripts/: the Renovate auto-ack
        # checks and the documentation check.
        run: python3 -m unittest discover -s scripts -v

  go-macos:
    # The required status check "Go (macos-latest)": it passes only when
    # every macOS part of the go job passed. A required check whose job is
    # skipped counts as passed, so this job runs even when a part failed,
    # unless the run was cancelled.
    name: Go (macos-latest)
    needs: go
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check the macOS parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" \
            --jq '.jobs[] | select(.name | startswith("Go (macos-latest, ")) | "\(.conclusion) \(.name)"' > parts.txt
          cat parts.txt
          test -s parts.txt || { echo "no macOS part of the go job ran" >&2; exit 1; }
          if grep -v '^success ' parts.txt; then
            echo "a macOS part of the go job did not pass" >&2
            exit 1
          fi

  static-linux:
    # The Linux engine is one static binary, built with zig cc against musl
    # (ADR 0003). This job builds the engine and the expression suite that
    # way for each Linux architecture, checks that the binaries are static,
    # runs the suite from them, and starts the engine on an empty base image
    # (ADR 0010, drift guard 5; milestone F4). The engine's heap uses
    # mimalloc, chosen because musl's malloc serialises the expression pool's
    # threads; the last step measures that choice (review item cl R3-2).
    name: Static Linux engine (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      # The static build of every binary below: the release engine's.
      STATIC_LDFLAGS: -linkmode=external -extldflags=-static
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Set up Bun
        # The static engine builds the fixture bundle that it then verifies
        # on the empty base.
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install the build helper's dependencies
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Build the engine and the expression suite as static binaries
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.target }}
        run: |
          go build -o "$RUNNER_TEMP/windmill-lite" -ldflags "$STATIC_LDFLAGS" ./cmd/windmill-lite
          go test -c -o "$RUNNER_TEMP/expr.test" -ldflags "$STATIC_LDFLAGS" ./internal/expr
          go test -c -o "$RUNNER_TEMP/quickjs.test" -ldflags "$STATIC_LDFLAGS" ./internal/expr/quickjs
          # For the allocator comparison below only: musl's own malloc.
          go test -c -tags wl_libc_malloc -o "$RUNNER_TEMP/quickjs-musl-malloc.test" -ldflags "$STATIC_LDFLAGS" ./internal/expr/quickjs

      - name: Check that the binaries are static
        run: |
          for bin in windmill-lite expr.test quickjs.test quickjs-musl-malloc.test; do
            bin="$RUNNER_TEMP/$bin"
            file "$bin"
            if readelf --program-headers "$bin" | grep -q INTERP; then
              echo "$bin names a program interpreter" >&2
              exit 1
            fi
            if readelf --dynamic "$bin" | grep -q NEEDED; then
              echo "$bin needs shared libraries" >&2
              exit 1
            fi
          done

      - name: Run the expression suite from the static binaries
        # The tests read testdata/ and the semantics reference by relative
        # paths, so each runs from its package directory.
        run: |
          (cd internal/expr && "$RUNNER_TEMP/expr.test" -test.v -test.count=1)
          (cd internal/expr/quickjs && "$RUNNER_TEMP/quickjs.test" -test.v -test.count=1)

      - name: Report the expression budget gate from the static engine
        # Report only (review item cl R3-2): ADR 0003's budget gate through
        # the pipeline, from the shipped static musl build. The table goes
        # to the job summary.
        env:
          WL_EXPR_BUDGET: report
          WL_EXPR_BUDGET_SECONDS: "1"
        run: |
          set -o pipefail
          cd internal/expr
          echo "### ${{ matrix.arch }}: expression budget gate (static, musl, mimalloc)" | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/expr.test" -test.run '^TestBudgetGate$' -test.count=1 | { grep -v '^\(PASS\|ok\)' || true; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start the engine on an empty base
        # An image FROM scratch holds only the engine and a bundle it built:
        # no C library, no /etc, no shell. The engine reports its version,
        # starts the expression engine and runs its probes (selfcheck), and
        # verifies the bundle.
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_BUILD_HELPER: ${{ github.workspace }}/harnesses/bun/build/main.ts
        run: |
          image="$RUNNER_TEMP/image"
          mkdir "$image"
          cp "$RUNNER_TEMP/windmill-lite" "$image/windmill-lite"
          fixture=internal/bundle/testdata/fixture
          digest=$("$image/windmill-lite" build "$fixture/windmill" -contract "$fixture/contract.yaml" -o "$image/fixture.wlb")
          printf 'FROM scratch\nCOPY windmill-lite fixture.wlb /\nENTRYPOINT ["/windmill-lite"]\n' > "$image/Dockerfile"
          docker build --tag windmill-lite-empty-base "$image"
          run() { docker run --rm --network none --read-only --user 65534:65534 windmill-lite-empty-base "$@"; }
          run version
          run selfcheck
          test "$(run verify /fixture.wlb -digest "$digest")" = "$digest"

      - name: Compare the expression pool's allocators
        # Report only (review item cl R3-2). The same load as the Go job's
        # measurement, run from four builds on the same runner: the release
        # build (static, musl, mimalloc), the static musl build with musl's
        # own malloc, and dynamic glibc builds with mimalloc and with
        # glibc's malloc. The tables go to the job summary.
        env:
          WL_QUICKJS_LOAD: "1"
          WL_QUICKJS_LOAD_SECONDS: "1"
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -c -o "$RUNNER_TEMP/quickjs-glibc.test" ./internal/expr/quickjs
          CGO_ENABLED=1 go test -c -tags wl_libc_malloc -o "$RUNNER_TEMP/quickjs-glibc-malloc.test" ./internal/expr/quickjs
          cd internal/expr/quickjs
          for build in "musl, mimalloc (release):quickjs" "musl, musl malloc:quickjs-musl-malloc" \
                       "glibc, mimalloc:quickjs-glibc" "glibc, glibc malloc:quickjs-glibc-malloc"; do
            echo "### ${{ matrix.arch }}: ${build%%:*}" | tee -a "$GITHUB_STEP_SUMMARY"
            "$RUNNER_TEMP/${build##*:}.test" -test.run '^TestPoolUnderLoad$' -test.count=1 | { grep -v '^\(PASS\|ok\)' || true; } | tee -a "$GITHUB_STEP_SUMMARY"
          done

  jsonb:
    # ADR 0005 checks the jsonb canonicaliser (internal/jsonval) against
    # PostgreSQL itself: every canonicaliser input of its tests is cast to
    # jsonb in the oracle's PostgreSQL image, pinned by the same digest as
    # the oracle's compose file (docs/semantics/oracle.md), and compared.
    # Service containers need a Linux runner. Branch protection does not
    # require this job.
    name: jsonb (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          # The test connects through the container's local socket; no
          # password is involved.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Compare jsonval with PostgreSQL jsonb
        env:
          WL_JSONB_PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U postgres
        run: go test -count=1 -v -run '^TestStoredMatchesPostgreSQL$' ./internal/jsonval

  bun:
    # The Bun harness's own developer checks (ADR 0003): its codec against
    # the golden frames the Go tests write, and the build helper's scans.
    # Not a required check; the Go tests above are the gate.
    name: Bun harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install the build helper's dependencies
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: harnesses/bun
        run: bun test

  bun-types:
    # A host that vendors the Bun host SDK as source (ADR 0009) typechecks
    # it with its own program. This job typechecks harnesses/bun/host and
    # harnesses/bun/runtime as such a host does, against the type
    # declarations of the pinned Bun (@types/bun 1.3.10, pinned with
    # TypeScript in harnesses/bun/test/typecheck), with and without the DOM
    # library, in strict and in non-strict mode. Branch protection does not
    # require this job.
    name: Bun SDK types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install TypeScript and the Bun type declarations
        working-directory: harnesses/bun/test/typecheck
        run: bun install --frozen-lockfile

      - name: Typecheck the host SDK and the harness runtime
        run: harnesses/bun/test/typecheck/check.sh

  docs:
    # The countable rules of the writing standard (docs/writing.md, "What CI
    # checks"). On a pull request, scripts/check-docs.py annotates the
    # Markdown blocks that the pull request changed; on every run it writes
    # the count of all warnings to the job summary. A warning leaves the exit
    # status at 0, and this job is not a required check.
    name: Docs (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; its first parent is
          # the base, which --diff-base compares against.
          fetch-depth: 2

      - name: Check the changed Markdown
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-docs.py --github --diff-base HEAD^1

      - name: Summarise all Markdown
        run: python3 scripts/check-docs.py --summary "$GITHUB_STEP_SUMMARY" > /dev/null

  secrets:
    # Scans each commit of a pull request for secrets with gitleaks (MIT
    # licence), using its default rules and the rule and allowlists in
    # .gitleaks.toml. Scanning each commit, not only the pull request's net
    # change, also catches a secret that one commit adds and a later commit
    # removes: a squash merge keeps it out of main, but the pull request's
    # branch keeps it readable. Output is redacted, so a finding is not
    # published in the log. Branch protection does not require this job.
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scan reads the commits between the base and the head.
          fetch-depth: 0

      - name: Install gitleaks
        # The release archive is checked against the SHA-256 that the
        # release's checksums file lists.
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Check the rules
        # The scan must find a bearer token in a recorded header, the leak
        # that wltest record's redaction guards against, and must find
        # nothing in the checked-out tree, whose synthetic values the
        # allowlists name. gitleaks exits with --exit-code on a finding and
        # with 1 on an error, so the first scan must exit with 3.
        run: |
          sample="$RUNNER_TEMP/sample"
          mkdir "$sample"
          token=$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
          printf '{"headers":{"authorization":"Bearer %s"}}\n' "$token" > "$sample/recorded.json"
          status=0
          gitleaks dir --no-banner --redact --exit-code 3 --config .gitleaks.toml "$sample" || status=$?
          if [ "$status" -ne 3 ]; then
            echo "gitleaks did not report the bearer token in the sample (exit status $status)" >&2
            exit 1
          fi
          gitleaks dir --no-banner --redact .

      - name: Scan the pull request's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
