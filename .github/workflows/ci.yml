name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; superseded runs cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    # Branch protection requires these job names as status checks
    # ("Go (ubuntu-latest)" and "Go (macos-latest)"). Renaming the job or a
    # matrix entry needs the same change in the protection settings.
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # The toolchain version comes from the `go` (or `toolchain`) line in
        # go.mod, so go.mod is the single source of truth for it.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        # The harness tests run on the Bun of Windmill v1.767.0's images
        # (WR-3); this pin moves only with that reference, never with a
        # Bun release (harness.PinnedBun).
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        # WL_REQUIRE_BUN turns a missing Bun into a failure instead of a
        # skip, so the harness protocol tests always run here.
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_REQUIRE_BUN: "1"
        run: go test -race ./...

      - name: Test repository scripts
        # Unit tests for the Renovate auto-ack helpers in scripts/.
        run: python3 -m unittest discover -s scripts -v

  bun:
    # The Bun harness's own developer checks (ADR 0003): its codec against
    # the golden frames the Go tests write. Not a required check; the Go
    # tests above are the gate.
    name: Bun harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Test
        working-directory: harnesses/bun
        run: bun test
