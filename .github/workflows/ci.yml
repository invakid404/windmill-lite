          path: ${{ runner.temp }}/plan

      - name: Restore the timing store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-go-quickjs-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: testbucket-go-quickjs-v1-

      - name: Audit and record the run
        # The audit fails when a planned package or test did not report, so
        # nothing is recorded from an incomplete run. A package that failed
        # adds no time. The split decisions are printed last.
        env:
          K: "3"
        run: |
          set -euo pipefail
          shopt -s nullglob
          events=(/tmp/testbucket-events/*.ndjson)
          if [ ${#events[@]} -eq 0 ]; then echo "no test events to record" >&2; exit 1; fi
          testbucket audit --runner go --shard-plan "$RUNNER_TEMP/plan/shard-plan.json" "${events[@]}"
          store="$RUNNER_TEMP/testbucket-store/test-timings.json"
          mkdir -p "$(dirname "$store")"
          testbucket ingest --runner go --store "$store" --count 1 --race --whale-k "$K" --live "$RUNNER_TEMP/plan/live.json" "${events[@]}"
          testbucket whales --k "$K" --store "$store" || true

      - name: Save the timing store
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-go-quickjs-v1-${{ github.run_id }}-${{ github.run_attempt }}

  static-linux:
    # The Linux engine is one static binary, built with zig cc against musl
    # (ADR 0003). This job builds the engine and the expression suite that
    # way for each Linux architecture, checks that the binaries are static,
    # runs the suite from them, and starts the engine on an empty base image
    # (ADR 0010, drift guard 5). Each QuickJS runtime's heap uses mimalloc,
    # while the rest of the program keeps the C library's malloc; mimalloc
    # was chosen because musl's malloc serialises the expression pool's
    # threads, and the last step measures that choice on four builds.
    name: Static Linux engine (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      # The static build of every binary below: the release engine's.
      STATIC_LDFLAGS: -linkmode=external -extldflags=-static
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Set up Bun
        # The static engine builds the fixture bundle that it then verifies
        # on the empty base.
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install the build helper's dependencies
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Build the engine and the expression suite as static binaries
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.target }}
        run: |
          go build -o "$RUNNER_TEMP/windmill-lite" -ldflags "$STATIC_LDFLAGS" ./cmd/windmill-lite
          go test -c -o "$RUNNER_TEMP/expr.test" -ldflags "$STATIC_LDFLAGS" ./internal/expr
          go test -c -o "$RUNNER_TEMP/quickjs.test" -ldflags "$STATIC_LDFLAGS" ./internal/expr/quickjs
          # For the allocator comparison below only: musl's own malloc.
          go test -c -tags wl_libc_malloc -o "$RUNNER_TEMP/quickjs-musl-malloc.test" -ldflags "$STATIC_LDFLAGS" ./internal/expr/quickjs

      - name: Check that the binaries are static
        run: |
          for bin in windmill-lite expr.test quickjs.test quickjs-musl-malloc.test; do
            bin="$RUNNER_TEMP/$bin"
            file "$bin"
            if readelf --program-headers "$bin" | grep -q INTERP; then
              echo "$bin names a program interpreter" >&2
              exit 1
            fi
            if readelf --dynamic "$bin" | grep -q NEEDED; then
              echo "$bin needs shared libraries" >&2
              exit 1
            fi
          done

      - name: Run the expression suite from the static binaries
        # The tests read testdata/ and the semantics reference by relative
        # paths, so each runs from its package directory.
        run: |
          (cd internal/expr && "$RUNNER_TEMP/expr.test" -test.v -test.count=1)
          (cd internal/expr/quickjs && "$RUNNER_TEMP/quickjs.test" -test.v -test.count=1)

      - name: Report the expression budget gate from the static engine
        # Report only: ADR 0003's budget gate through the pipeline, from the
        # shipped static musl build. The table goes to the job summary.
        env:
          WL_EXPR_BUDGET: report
          WL_EXPR_BUDGET_SECONDS: "1"
        run: |
          set -o pipefail
          cd internal/expr
          echo "### ${{ matrix.arch }}: expression budget gate (static, musl, mimalloc)" | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/expr.test" -test.run '^TestBudgetGate$' -test.count=1 | { grep -v '^\(PASS\|ok\)' || true; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start the engine on an empty base
        # An image FROM scratch holds only the engine and a bundle it built:
        # no C library, no /etc, no shell. The engine reports its version,
        # starts the expression engine and runs its probes (selfcheck), and
        # verifies the bundle.
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_BUILD_HELPER: ${{ github.workspace }}/harnesses/bun/build/main.ts
        run: |
          image="$RUNNER_TEMP/image"
          mkdir "$image"
          cp "$RUNNER_TEMP/windmill-lite" "$image/windmill-lite"
          fixture=internal/bundle/testdata/fixture
          digest=$("$image/windmill-lite" build "$fixture/windmill" -contract "$fixture/contract.yaml" -o "$image/fixture.wlb")
          printf 'FROM scratch\nCOPY windmill-lite fixture.wlb /\nENTRYPOINT ["/windmill-lite"]\n' > "$image/Dockerfile"
          docker build --tag windmill-lite-empty-base "$image"
          run() { docker run --rm --network none --read-only --user 65534:65534 windmill-lite-empty-base "$@"; }
          run version
          run selfcheck
          test "$(run verify /fixture.wlb -digest "$digest")" = "$digest"

      - name: Compare the expression pool's allocators
        # Report only. The same load as the Go job's measurement, run from four
        # builds on the same runner: the release build (static, musl, mimalloc), the
        # static musl build with musl's own malloc, and dynamic glibc builds with
        # mimalloc and with glibc's malloc. The tables go to the job summary.
        env:
          WL_QUICKJS_LOAD: "1"
          WL_QUICKJS_LOAD_SECONDS: "1"
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -c -o "$RUNNER_TEMP/quickjs-glibc.test" ./internal/expr/quickjs
          CGO_ENABLED=1 go test -c -tags wl_libc_malloc -o "$RUNNER_TEMP/quickjs-glibc-malloc.test" ./internal/expr/quickjs
          cd internal/expr/quickjs
          for build in "musl, mimalloc (release):quickjs" "musl, musl malloc:quickjs-musl-malloc" \
                       "glibc, mimalloc:quickjs-glibc" "glibc, glibc malloc:quickjs-glibc-malloc"; do
            echo "### ${{ matrix.arch }}: ${build%%:*}" | tee -a "$GITHUB_STEP_SUMMARY"
            "$RUNNER_TEMP/${build##*:}.test" -test.run '^TestPoolUnderLoad$' -test.count=1 | { grep -v '^\(PASS\|ok\)' || true; } | tee -a "$GITHUB_STEP_SUMMARY"
          done

  expr-images:
    # The expression engine built and run on each Ubuntu image by name, so
    # that a move of ubuntu-latest cannot drop an image unnoticed. Each
    # image's system C compiler builds the engine's C code differently: the
    # stack that one JavaScript call takes is 784 bytes with GCC 13
    # (ubuntu-24.04) and 1 728 bytes with GCC 15 (ubuntu-26.04), and the
    # engine scales its stack limit to it (internal/expr/quickjs,
    # StackLimit). On each image this job runs the expression packages, in
    # QuickJS-only mode too, and the selfcheck test, prints what the engine
    # measured, and starts the static Linux engine, which zig cc builds the
    # same way on every image. Branch protection requires both of its
    # checks, "Expression engine (ubuntu-24.04)" and
    # "Expression engine (ubuntu-26.04)", so a change to the images in its
    # matrix needs the same change in the protection settings.
    name: Expression engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Test the expression packages
        run: |
          gcc --version | head -n 1
          go test -race -count=1 ./internal/expr/...
          WL_TEST_QUICKJS_ONLY=1 go test -race -count=1 ./internal/expr

      - name: Print the stack measurements
        # The stack per call that the engine measured, the scaled limit, and
        # the depths that a simple recursion, JSON.parse, JSON.stringify and
        # nested source text reach under it with this image's compiler.
        run: go test -count=1 -v -run '^(TestCallStackBytes|TestOverflowDepthAtTheDefaultStack|TestProbeMatchesEvaluations)$' ./internal/expr/quickjs

      - name: Test selfcheck
        run: go test -count=1 -run '^TestSelfcheck$' ./cmd/windmill-lite

      - name: Start the engine built with the image's compiler
        run: |
          go build -o "$RUNNER_TEMP/windmill-lite" ./cmd/windmill-lite
          "$RUNNER_TEMP/windmill-lite" selfcheck

      - name: Start the static Linux engine
        env:
          CGO_ENABLED: "1"
          CC: zig cc -target x86_64-linux-musl
        run: |
          go build -o "$RUNNER_TEMP/windmill-lite-static" -ldflags "-linkmode=external -extldflags=-static" ./cmd/windmill-lite
          "$RUNNER_TEMP/windmill-lite-static" selfcheck

  jsonb:
    # ADR 0005 checks the jsonb canonicaliser (internal/jsonval) against
    # PostgreSQL itself: every canonicaliser input of its tests is cast to
    # jsonb in the oracle's PostgreSQL image, pinned by the same digest as
    # the oracle's compose file (docs/semantics/oracle.md), and compared;
    # and the bound above a value's stored size that the job reads use
    # (jsonval.StoredBound) is checked against pg_column_size. Service
    # containers need a Linux runner. Branch protection does not
    # require this job.
    name: jsonb (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          # The test connects through the container's local socket; no
          # password is involved.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Compare jsonval with PostgreSQL jsonb
        env:
          WL_JSONB_PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U postgres
        run: go test -count=1 -v -run '^(TestStoredMatchesPostgreSQL|TestStoredBoundAbovePostgreSQL|TestToastedSizeMatchesPostgreSQL)$' ./internal/jsonval

  redis:
    # The Redis resource store (wl/redisstore) against real servers: the
    # contract suite (wl/storetest) on one Redis and through Sentinel, the
    # fault tests through Toxiproxy, the eviction check, the run command's
    # cross-process test, and wltest check of client-api/state on the
    # Redis store in each mode of the flow suite.
    # scripts/redis-test-env.sh starts the containers, pinned by digest,
    # and prints the variables the tests read; without them the tests
    # skip, as they do in the jobs above. The containers need a Linux
    # runner, whose host reaches their addresses. Branch protection does
    # not require this job.
    name: Redis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Fetch windmill-client 1.862.0
        # As in the Go job: client-api/state runs the stock client.
        run: |
          dir="$RUNNER_TEMP/windmill-client"
          mkdir -p "$dir/node_modules/windmill-client"
          curl -sSfL --retry 3 -o "$dir/client.tgz" https://registry.npmjs.org/windmill-client/-/windmill-client-1.862.0.tgz
          echo "5ebad9cf352597fb2475e80267bf411b562b108c8eeea66a84a5d5a2ff12df68d8000ef8d2acef130a3acb77be9b22fb9ad5056314adf0695aee3533eef68811  $dir/client.tgz" | shasum -a 512 -c -
          tar -xzf "$dir/client.tgz" -C "$dir/node_modules/windmill-client" --strip-components=1
          echo "WL_WINDMILL_CLIENT=$dir" >> "$GITHUB_ENV"

      - name: Install the build helper's dependencies
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Start Redis, Sentinel and Toxiproxy
        run: scripts/redis-test-env.sh up >> "$GITHUB_ENV"

      - name: Test the Redis store
        run: go test -race -count=1 -v ./wl/redisstore

      - name: Test the run command on Redis
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_REQUIRE_BUN: "1"
        run: go test -race -count=1 -v -run '^TestRunCommand$' ./cmd/windmill-lite

      - name: Test wltest's fixture stores on Redis
        # Each fixture's runtime gets a Redis store of its own, which its
        # runs share.
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_REQUIRE_BUN: "1"
        run: go test -race -count=1 -v -run '^(TestFixtureStoresAreApart|TestFixtureStateOnRedis|TestStateTestClaim)$' ./cmd/wltest

      - name: Check client-api/state on the Redis store
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
        run: |
          go build -o "$RUNNER_TEMP/wltest" ./cmd/wltest
          export WL_REDIS_URL="$WL_TEST_REDIS_URL"
          for mode in "-mode warm" "-mode fresh" "-mode host" "-mode warm -shared-code" "-mode host -shared-code"; do
            # shellcheck disable=SC2086 # $mode holds the flags
            "$RUNNER_TEMP/wltest" check -resource-store redis $mode conformance/flows/client-api/state
          done

      - name: Remove the containers
        if: always()
        run: scripts/redis-test-env.sh down

  bun:
    # The Bun harness's own developer checks (ADR 0003): its codec against
    # the golden frames the Go tests write, and the build helper's scans.
    # Not a required check; the Go tests above are the gate.
    name: Bun harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install the build helper's dependencies
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: harnesses/bun
        run: bun test

  bun-types:
    # A host that vendors the Bun host SDK as source (ADR 0009) typechecks
    # it with its own program. This job typechecks harnesses/bun/host and
    # harnesses/bun/runtime as such a host does, against the type
    # declarations of the pinned Bun (@types/bun 1.4.3, pinned with
    # TypeScript in harnesses/bun/test/typecheck), with and without the DOM
    # library, in strict and in non-strict mode. It does so twice: with the
    # newest @types/node and with the oldest one a host is expected to use
    # (harnesses/bun/test/typecheck/oldest), since @types/bun accepts any.
    # Branch protection does not require this job.
    name: Bun SDK types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install TypeScript and the type declarations, newest @types/node
        working-directory: harnesses/bun/test/typecheck
        run: bun install --frozen-lockfile

      - name: Install TypeScript and the type declarations, oldest @types/node
        working-directory: harnesses/bun/test/typecheck/oldest
        run: bun install --frozen-lockfile

      - name: Typecheck the host SDK and the harness runtime
        run: harnesses/bun/test/typecheck/check.sh

  docs:
    # The countable rules of the writing standard (docs/writing.md, "What CI
    # checks"). On a pull request, scripts/check-docs.py annotates the
    # Markdown blocks that the pull request changed; on every run it writes
    # the count of all warnings to the job summary. A warning leaves the exit
    # status at 0, and this job is not a required check.
    name: Docs (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; its first parent is
          # the base, which --diff-base compares against.
          fetch-depth: 2

      - name: Check the changed Markdown
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-docs.py --github --diff-base HEAD^1

      - name: Summarise all Markdown
        run: python3 scripts/check-docs.py --summary "$GITHUB_STEP_SUMMARY" > /dev/null

  secrets:
    # Scans each commit of a pull request for secrets with gitleaks (MIT
    # licence), using its default rules and the rule and allowlists in
    # .gitleaks.toml. Scanning each commit, not only the pull request's net
    # change, also catches a secret that one commit adds and a later commit
    # removes: a squash merge keeps it out of main, but the pull request's
    # branch keeps it readable. Output is redacted, so a finding is not
    # published in the log. Branch protection does not require this job.
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scan reads the commits between the base and the head.
          fetch-depth: 0

      - name: Install gitleaks
        # The release archive is checked against the SHA-256 that the
        # release's checksums file lists.
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Check the rules
        # The scan must find a bearer token in a recorded header, the leak
        # that wltest record's redaction guards against, and must find
        # nothing in the checked-out tree, whose synthetic values the
        # allowlists name. gitleaks exits with --exit-code on a finding and
        # with 1 on an error, so the first scan must exit with 3.
        run: |
          sample="$RUNNER_TEMP/sample"
          mkdir "$sample"
          token=$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
          printf '{"headers":{"authorization":"Bearer %s"}}\n' "$token" > "$sample/recorded.json"
          status=0
          gitleaks dir --no-banner --redact --exit-code 3 --config .gitleaks.toml "$sample" || status=$?
          if [ "$status" -ne 3 ]; then
            echo "gitleaks did not report the bearer token in the sample (exit status $status)" >&2
            exit 1
          fi
          gitleaks dir --no-banner --redact .

      - name: Scan the pull request's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
