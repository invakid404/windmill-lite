name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; superseded runs cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    # Branch protection requires these job names as status checks
    # ("Go (ubuntu-latest)" and "Go (macos-latest)"). Renaming the job or a
    # matrix entry needs the same change in the protection settings.
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # The toolchain version comes from the `go` (or `toolchain`) line in
        # go.mod, so go.mod is the single source of truth for it.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        # The harness tests run on the Bun of Windmill v1.767.0's images
        # (WR-3); this pin moves only with that reference, never with a
        # Bun release (harness.PinnedBun).
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install the build helper's dependencies
        # The Bun build helper (harnesses/bun/build, ADR 0010) parses
        # TypeScript with the parser its lockfile pins; the Go build tests
        # run it.
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        # WL_REQUIRE_BUN turns a missing Bun into a failure instead of a
        # skip, so the harness protocol and build tests always run here.
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
          WL_REQUIRE_BUN: "1"
        run: go test -race ./...

      - name: Measure the expression pool under load
        # Prints latency percentiles of the native QuickJS-ng pool
        # (internal/expr/quickjs, milestone B1a). Report only: it sets no
        # threshold; the budget gate is milestone B2b's.
        env:
          WL_QUICKJS_LOAD: "1"
          WL_QUICKJS_LOAD_SECONDS: "1"
        run: go test -count=1 -run '^TestPoolUnderLoad$' -v ./internal/expr/quickjs

      - name: Test repository scripts
        # Unit tests for the Renovate auto-ack helpers in scripts/.
        run: python3 -m unittest discover -s scripts -v

  static-linux:
    # The Linux engine is one static binary, built with zig cc against musl
    # (ADR 0003). This job builds the expression engine's tests that way for
    # each Linux architecture, checks that the binary is static, and runs it
    # on a runner of that architecture.
    name: Static Linux engine (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build the engine tests as a static binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.target }}
        run: go test -c -o "$RUNNER_TEMP/quickjs.test" -ldflags '-linkmode=external -extldflags=-static' ./internal/expr/quickjs

      - name: Check that the binary is static
        run: |
          bin="$RUNNER_TEMP/quickjs.test"
          file "$bin"
          if readelf --program-headers "$bin" | grep -q INTERP; then
            echo "the binary names a program interpreter" >&2
            exit 1
          fi
          if readelf --dynamic "$bin" | grep -q NEEDED; then
            echo "the binary needs shared libraries" >&2
            exit 1
          fi

      - name: Run the engine tests from the static binary
        # The tests read testdata/ and the semantics reference by relative
        # paths, so they run from the package directory.
        working-directory: internal/expr/quickjs
        run: '"$RUNNER_TEMP/quickjs.test" -test.v -test.count=1'

  jsonb:
    # ADR 0005 checks the jsonb canonicaliser (internal/jsonval) against
    # PostgreSQL itself: every canonicaliser input of its tests is cast to
    # jsonb in the oracle's PostgreSQL image, pinned by the same digest as
    # the oracle's compose file (docs/semantics/oracle.md), and compared.
    # Service containers need a Linux runner. Branch protection does not
    # require this job.
    name: jsonb (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          # The test connects through the container's local socket; no
          # password is involved.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Compare jsonval with PostgreSQL jsonb
        env:
          WL_JSONB_PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U postgres
        run: go test -count=1 -v -run '^TestStoredMatchesPostgreSQL$' ./internal/jsonval

  bun:
    # The Bun harness's own developer checks (ADR 0003): its codec against
    # the golden frames the Go tests write, and the build helper's scans.
    # Not a required check; the Go tests above are the gate.
    name: Bun harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install the build helper's dependencies
        working-directory: harnesses/bun/build
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: harnesses/bun
        run: bun test
