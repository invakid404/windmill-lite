            *) echo "no testbucket archive is pinned for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/testbucket.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/invakid404/testbucket/releases/download/v${VERSION}/testbucket_${VERSION}_${asset}.tar.gz"
          echo "$sha256  $archive" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/testbucket"
          tar -xzf "$archive" -C "$RUNNER_TEMP/testbucket" testbucket
          echo "$RUNNER_TEMP/testbucket" >> "$GITHUB_PATH"
