# TEMPORARY diagnostic workflow (removed before review): what the
# alternative fix, pinning the inliner flags that keep the interpreter's
# frame small, would cost in interpreter speed.
name: Diag stack

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    name: Diag perf (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Interpreter speed by compiler and inliner flag
        working-directory: internal/expr/quickjs
        env:
          WL_DIAG_STACK: "1"
        run: |
          variants=("gcc|-O2 -g" "gcc|-O2 -g -fno-inline-small-functions" "clang|-O2 -g" "clang|-O2 -g -fno-inline-functions")
          if command -v gcc-13 > /dev/null; then variants+=("gcc-13|-O2 -g"); fi
          for round in 1 2; do
            for v in "${variants[@]}"; do
              IFS='|' read -r cc flags <<< "$v"
              CC="$cc" CGO_CFLAGS="$flags" go test -c -o "$RUNNER_TEMP/q.test" . > "$RUNNER_TEMP/build.log" 2>&1 || { echo "$cc [$flags]: build failed"; continue; }
              WL_DIAG_LABEL="r$round:$cc[$flags]" "$RUNNER_TEMP/q.test" -test.run '^(TestDiagPerf|TestCallStackBytes)$' -test.v -test.count=1 2>&1 | grep -E 'PERF|bytes of C stack per call' | sed -E 's/^ *[a-z_]+_test.go:[0-9]+: //'
            done
          done
