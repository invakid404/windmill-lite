# TEMPORARY diagnostic workflow (removed before review): measures the C
# stack that one JavaScript call takes in the QuickJS-ng engine on
# ubuntu-24.04 and ubuntu-26.04, and what the system compiler adds.
name: Diag stack

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    name: Diag stack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: System
        run: |
          set -x
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          uname -srm
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          ulimit -s
          ulimit -a
          ldd --version | head -1
          nproc
          ls /usr/bin | grep -E '^(gcc|clang|cc|c\+\+)(-[0-9]+)?$' | tr '\n' ' '; echo
          readlink -f "$(command -v gcc)" "$(command -v cc)"
          go version
          go env CC CXX CGO_ENABLED CGO_CFLAGS CGO_CPPFLAGS CGO_LDFLAGS GOAMD64

      - name: Compiler
        run: |
          set -x
          gcc --version | head -1
          gcc -v 2>&1 | grep -E '^gcc version'
          gcc -v 2>&1 | grep -E '^Configured with' | tr ' ' '\n' | grep -E 'enable-default|cet|ssp|pie|stack|hard|multiarch|with-arch|with-tune'
          gcc -Q -O2 --help=common | grep -E 'stack-protector|stack-clash|auto-var-init|cf-protection|omit-frame-pointer|zero-call-used|hardened|shrink-wrap|stack-reuse|ipa-ra|-fPIE|-fpie |-fPIC|-fpic |zero-init-padding|ipa-icf|inline-functions |-fipa-cp '
          gcc -Q -O2 --help=target | grep -E 'march|mtune|shstk|cet|indirect-branch|function-return|-mabi'
          gcc -O2 -dM -E -x c /dev/null | grep -E 'FORTIFY|SSP|__PIE__|__pie__|__GNUC__ |__VERSION__|STDC_VERSION|CET|SHSTK'
          echo 'int main(void){return 0;}' > "$RUNNER_TEMP/t.c"
          gcc -### -O2 -c "$RUNNER_TEMP/t.c" -o "$RUNNER_TEMP/t.o" 2>&1 | grep cc1
          ls /usr/lib/gcc/x86_64-linux-gnu/ || true
          cat "$(gcc -print-file-name=specs 2>/dev/null)" 2>/dev/null | head -5 || true
          clang --version | head -1 || true

      - name: How cgo compiles the engine
        run: go build -n -a ./internal/expr/quickjs 2>&1 | grep -E 'qjs_quickjs\.c' | head -3

      - name: Static frame of JS_CallInternal (-fstack-usage)
        working-directory: internal/expr/quickjs
        run: |
          base="-O2 -DNDEBUG -D_GNU_SOURCE -funsigned-char -Wno-unused-parameter -Wno-sign-compare -Imimalloc/include -fPIC -m64 -pthread -fmessage-length=0 -g -w"
          out="$RUNNER_TEMP/su"; mkdir -p "$out"
          variants=(
            "gcc|default|"
            "gcc|no-stack-protector|-fno-stack-protector"
            "gcc|no-stack-clash|-fno-stack-clash-protection"
            "gcc|no-cf-protection|-fcf-protection=none"
            "gcc|auto-var-init-uninit|-ftrivial-auto-var-init=uninitialized"
            "gcc|auto-var-init-zero|-ftrivial-auto-var-init=zero"
            "gcc|no-fortify|-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
            "gcc|omit-frame-pointer|-fomit-frame-pointer"
            "gcc|no-omit-frame-pointer|-fno-omit-frame-pointer"
            "gcc|std-gnu17|-std=gnu17"
            "gcc|no-shrink-wrap|-fno-shrink-wrap"
            "gcc|hardening-off|-fno-stack-protector -fno-stack-clash-protection -fcf-protection=none -ftrivial-auto-var-init=uninitialized -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
            "gcc|O1|-O1"
            "gcc|O3|-O3"
            "gcc|Os|-Os"
          )
          for v in gcc-12 gcc-13 gcc-14 gcc-15 gcc-16 clang; do
            if command -v "$v" > /dev/null; then variants+=("$v|default|"); fi
          done
          run() {
            IFS='|' read -r cc name flags <<< "$1"
            o="$out/$cc-$name"
            # shellcheck disable=SC2086
            if "$cc" $base $flags -fstack-usage -c qjs_quickjs.c -o "$o.o" 2> "$o.err"; then
              printf '%-8s %-24s %s\n' "$cc" "$name" "$(grep -E ':(JS_CallInternal|js_call_c_function|js_call_bound_function)([.][a-z0-9.]+)?\s' "$o.su" | awk '{print $1"="$2"("$3")"}' | sed 's/.*://' | tr '\n' ' ')"
            else
              printf '%-8s %-24s FAILED: %s\n' "$cc" "$name" "$(head -c 300 "$o.err")"
            fi
          }
          export -f run; export base out
          printf '%s\n' "${variants[@]}" | xargs -P "$(nproc)" -I{} bash -c 'run "$@"' _ {} | sort

      - name: Depth reached, as built by cgo
        working-directory: internal/expr/quickjs
        env:
          WL_DIAG_STACK: "1"
        run: |
          variants=(
            "gcc|default|-O2 -g"
            "gcc|no-stack-protector|-O2 -g -fno-stack-protector"
            "gcc|no-stack-clash|-O2 -g -fno-stack-clash-protection"
            "gcc|hardening-off|-O2 -g -fno-stack-protector -fno-stack-clash-protection -fcf-protection=none -ftrivial-auto-var-init=uninitialized -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
          )
          for v in gcc-13 gcc-14 gcc-15 gcc-16 clang; do
            if command -v "$v" > /dev/null; then variants+=("$v|default|-O2 -g"); fi
          done
          for v in "${variants[@]}"; do
            IFS='|' read -r cc name flags <<< "$v"
            rm -f "$RUNNER_TEMP/q.test"
            CC="$cc" CGO_CFLAGS="$flags" go test -c -o "$RUNNER_TEMP/q.test" . > "$RUNNER_TEMP/build.log" 2>&1 || { echo "$cc $name: build failed"; tail -20 "$RUNNER_TEMP/build.log"; continue; }
            WL_DIAG_LABEL="$cc/$name" "$RUNNER_TEMP/q.test" -test.run '^(TestDiagStack|TestOverflowDepthAtTheDefaultStack|TestLargeStackLimitStaysInsideTheThread)$' -test.v -test.count=1 2>&1 | tee -a "$RUNNER_TEMP/depth.txt" | grep -E 'DIAG|overflows|--- |got' || true
          done
          echo "=== summary ==="
          grep DIAG "$RUNNER_TEMP/depth.txt"
