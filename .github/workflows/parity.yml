name: Codebase parity

# The CLI parity check of milestone C2b (ADR 0002, decision 4; Q-WR-24):
# the unmodified windmill-cli@1.767.0, run with npx as a black-box tool
# (OR-8), pushes synthetic codebase scripts to a recording HTTP stub, and
# windmill-lite's esbuild reproduction of the CLI's settings must give the
# bundle bytes the CLI uploads (TestCLIParity in internal/bundle). The CLI
# is used, never depended on: no manifest names it and nothing of it is
# read. Branch protection does not require this job; the check's fallback,
# TestCLIOptionsFollowWR47, runs in the Go jobs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: Codebase parity (windmill-cli 1.767.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        # npx runs the pinned windmill-cli@1.767.0 on the Node major it
        # runs on in the oracle workflow (OR-8).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Compare codebase bundles with the CLI's uploads
        env:
          WL_WMILL_CLI: npx --yes windmill-cli@1.767.0
        run: go test -count=1 -run '^TestCLIParity$' -v ./internal/bundle
