name: Benchmarks

# Non-gating comparisons of G1's end-to-end benchmarks (cmd/windmill-lite,
# ADR 0005's benchmark plan) between builds of the engine, on GitHub's
# hosted runners, linux/amd64 and linux/arm64. It is started by hand
# (workflow_dispatch) and never gates a pull request; the figures of a
# change come from here, not from a laptop.
#
# Inputs:
#   - builds: the builds to compare, in order, as name=ref pairs separated
#     by spaces. Each job builds the benchmarks' test binary of every ref in
#     a worktree of its own, then runs the rounds; each round runs every
#     build once, the order rotating. benchstat compares each build with the
#     one before it and the last with the first. A build can add
#     environment to its runs, to compare a runtime setting on the same
#     code: name=ref:VAR=value:VAR=value (git refuses ':' in ref names), as
#     in tmpfs=<sha>:TMPDIR=/dev/shm or gc=<sha>:GOGC=400.
#   - groups: which benchmarks, a job per group and architecture:
#       boundary     BenchmarkStepBoundary, host, one run at a time,
#                    256 KiB to 16 MiB
#       shapes       BenchmarkHostShapes' shapes of 256 KiB to 16 MiB
#       passthrough  BenchmarkPassThrough
#       expressions  BenchmarkExpressions
#       peaks        BenchmarkRunPeaks (peak resident memory)
#       small        G1's configurations and shapes at 1 KiB and below, and
#                    the eight-concurrent shape, each in a process of its
#                    own (WL_BENCH_FRESH=1)
#       retained     BenchmarkRetainedHeap (what finished runs leave
#                    reachable on one long-lived runtime)
#       embedder     BenchmarkEmbedder: the embedder shapes, twelve
#                    workloads each on windmill-lite in host mode and as
#                    the in-process baseline, 20 requests per side per round
#       native       BenchmarkNativeRealm (what native-boundary
#                    invocations leave in a long-lived host or harness
#                    process after a full collection), at 8,000 runs:
#                    the resident set levels off only after about
#                    20,000 native invocations
#   - rounds: the rounds per job.
#   - small_builds: the builds of the small group, when it compares others
#     (empty: builds).
on:
  workflow_dispatch:
    inputs:
      builds:
        description: "Builds, in order: name=ref pairs separated by spaces"
        required: true
        default: "main=origin/main"
      groups:
        description: "Groups: boundary shapes passthrough expressions peaks small retained native embedder"
        required: true
        default: "boundary shapes passthrough expressions peaks small"
      rounds:
        description: "Rounds per job"
        required: true
        default: "10"
      small_builds:
        description: "Builds of the small group, when not the builds above"
        required: false
        default: ""

permissions:
  contents: read

# No concurrency group: a run started later must not cancel one in
# progress.

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      small_builds: ${{ steps.plan.outputs.small_builds }}
      groups: ${{ steps.plan.outputs.groups }}
      rounds: ${{ steps.plan.outputs.rounds }}
    steps:
      - id: plan
        env:
          IN_BUILDS: ${{ inputs.builds }}
          IN_GROUPS: ${{ inputs.groups }}
          IN_ROUNDS: ${{ inputs.rounds }}
          IN_SMALL: ${{ inputs.small_builds }}
        run: |
          groups='[]'
          if [ -n "$IN_GROUPS" ] && [ "$IN_GROUPS" != none ]; then
            groups=$(printf '%s\n' $IN_GROUPS | jq -R . | jq -sc .)
          fi
          echo "builds: $IN_BUILDS"
          echo "groups: $groups"
          {
            echo "builds=$IN_BUILDS"
            echo "small_builds=${IN_SMALL:-$IN_BUILDS}"
            echo "groups=$groups"
            echo "rounds=${IN_ROUNDS:-10}"
          } >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    name: Bench (${{ matrix.arch }}, ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 350
    env:
      BUILDS: ${{ matrix.group == 'small' && needs.plan.outputs.small_builds || needs.plan.outputs.builds }}
      ROUNDS: ${{ needs.plan.outputs.rounds }}
      GROUP: ${{ matrix.group }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Record the machine
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          { uname -a; nproc; lscpu; free -m; go version; "${{ steps.bun.outputs.bun-path }}" --version; echo "builds: $BUILDS"; } > "$RUNNER_TEMP/out/machine.txt" 2>&1
          cat "$RUNNER_TEMP/out/machine.txt"
      - name: Build each build's benchmarks
        run: |
          for pair in $BUILDS; do
            name=${pair%%=*} ref=${pair#*=} ref=${ref%%:*}
            src="$RUNNER_TEMP/src/$name"
            git worktree add --detach "$src" "$ref"
            echo "$name: $(git -C "$src" rev-parse HEAD)" | tee -a "$RUNNER_TEMP/out/machine.txt"
            (cd "$src/harnesses/bun/build" && bun install --frozen-lockfile)
            (cd "$src" && go test -c -o "$RUNNER_TEMP/bin/$name.test" ./cmd/windmill-lite)
          done
      - name: Run the rounds
        env:
          WL_BUN: ${{ steps.bun.outputs.bun-path }}
        run: |
          # Each line is one benchmark command of a round: its benchtime,
          # then its -bench pattern; WL_BENCH_SIZES and WL_BENCH_FRESH as
          # the group needs them.
          case "$GROUP" in
            boundary)
              export WL_BENCH_SIZES=256KiB,1MiB,4MiB,16MiB
              cmds=("3s BenchmarkStepBoundary/topology=host/conc=1/") ;;
            shapes)
              cmds=("5x BenchmarkHostShapes/shape=(s20-256KiB|s10-1MiB|s8-4MiB|s4-16MiB)\$") ;;
            passthrough)
              cmds=("10x BenchmarkPassThrough") ;;
            expressions)
              cmds=("10x BenchmarkExpressions") ;;
            peaks)
              cmds=("1x BenchmarkRunPeaks") ;;
            retained)
              cmds=("1x BenchmarkRetainedHeap") ;;
            native)
              export WL_NATIVE_RUNS=8000
              cmds=("1x BenchmarkNativeRealm") ;;
            embedder)
              export WL_BENCH_EMB_N=20
              cmds=("1x BenchmarkEmbedder") ;;
            small)
              export WL_BENCH_FRESH=1 WL_BENCH_SIZES=26B,1KiB
              cmds=("3s BenchmarkStepBoundary/topology=(host|subprocess)/conc=(1|8)/"
                    "20x BenchmarkHostShapes/shape=(bare-s600-1KiB|s50-1KiB|s600-1KiB|plain-s600-1KiB|pathsA-s50|resA-s50|resA-s50-1ms|s200-mixed-conc8)\$") ;;
            *) echo "unknown group $GROUP" >&2; exit 1 ;;
          esac
          read -r -a builds <<< "$BUILDS"
          nb=${#builds[@]}
          for r in $(seq 1 "$ROUNDS"); do
            for i in $(seq 0 $((nb - 1))); do
              pair=${builds[$(( (i + r) % nb ))]}
              name=${pair%%=*} spec=${pair#*=}
              # The build's own environment: the VAR=value fields after
              # its ref.
              envs=()
              IFS=: read -r -a fields <<< "$spec"
              for f in "${fields[@]:1}"; do envs+=("$f"); done
              for c in "${cmds[@]}"; do
                bt=${c%% *} pattern=${c#* }
                echo "round $r: $name ${envs[*]}, $pattern, $(date -u +%T), load $(cut -d' ' -f1-3 /proc/loadavg)"
                (cd "$RUNNER_TEMP/src/$name/cmd/windmill-lite" &&
                  env "${envs[@]}" "$RUNNER_TEMP/bin/$name.test" -test.run '^$' -test.bench "$pattern" -test.benchtime "$bt" -test.count 1 -test.timeout 0) >> "$RUNNER_TEMP/out/$name.txt"
              done
            done
          done
          grep -c '^Benchmark' "$RUNNER_TEMP"/out/*.txt
      - name: Compare with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          cd "$RUNNER_TEMP/out"
          read -r -a builds <<< "$BUILDS"
          names=()
          for pair in "${builds[@]}"; do names+=("${pair%%=*}"); done
          for i in $(seq 1 $((${#names[@]} - 1))); do
            a=${names[$((i - 1))]} b=${names[$i]}
            "$(go env GOPATH)/bin/benchstat" "$a=$a.txt" "$b=$b.txt" > "cmp-$a-$b.txt"
          done
          if [ ${#names[@]} -gt 2 ]; then
            a=${names[0]} b=${names[$((${#names[@]} - 1))]}
            "$(go env GOPATH)/bin/benchstat" "$a=$a.txt" "$b=$b.txt" > "cmp-$a-$b.txt"
          fi
          ls cmp-*.txt
          head -80 "cmp-${names[0]}-${names[$((${#names[@]} - 1))]}.txt" || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.arch }}-${{ matrix.group }}
          path: ${{ runner.temp }}/out
